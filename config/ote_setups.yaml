# ───────────────────────────────────────────────────────────────
# DS-паттерны = ТРИГГЕРЫ входа ВНУТРИ OTE-зоны сетапа
# Логика: OTE-сетап даёт ГДЕ (зона+риск), DS-паттерн даёт ЧЕМ триггерить LTF-вход
# (вместо «любого слома» — конкретный fvg+div). Имена = реальные флаги combinator_v3.
# Источники: DS-315 (HTF context) · DS-316 (LTF trigger) · DS-318 (hidden+regular вертикаль)
# ───────────────────────────────────────────────────────────────
ds_patterns:
  status: "DS-318 ГОТОВ (04.06) — hidden+regular вертикаль подтвердила нашу гипотезу"
  source: "data/research/2026-06-03--ds316/nested_ltf_15m_results.csv (7550) + ds315 (6906 MHT)"
  note: "FVG = ядро всех топов · SHORT>LONG (+63%) · hidden_1h+regular_15m рабочая вертикаль · +FVG=+0.3R"

  # LTF-триггеры SHORT (вход вниз в OTE-зоне, 15m)
  short_triggers:
    - { pattern: "bear_fvg_15m + rsi_ob_15m + pivot_bounce_down_PP_1D", n: 173, avgR: 1.983, wr: 99, src: ds316 }
    - { pattern: "bear_fvg_15m + wt_ob_15m",                            n: 282, avgR: 1.902, wr: 97, src: ds316 }
    - { pattern: "bear_fvg_15m + rsi_div_bear_hidden1h_regular15m",     n: 67,  avgR: 1.840, wr: 96, src: ds318 }  # наша вертикаль
    - { pattern: "rsi_div_bear_hidden1h_regular15m (solo)",             n: 353, avgR: 1.545, wr: 85, src: ds318 }

  # LTF-триггеры LONG (вход вверх в OTE-зоне, 15m)
  long_triggers:
    - { pattern: "bull_fvg_overlap_held_15m + wt_div_bull_hidden_15m",  n: 54,   avgR: 1.842, wr: 100, src: ds318 }
    - { pattern: "bull_fvg_overlap_held_15m (solo, наш Шаг 2)",         n: 1888, avgR: 1.552, wr: 97,  src: ds316 }
    - { pattern: "bull_fvg_15m + rsi_div_bull_hidden1h_regular15m",     n: 128,  avgR: 1.503, wr: 90,  src: ds318 }  # наша вертикаль
    - { pattern: "rsi_div_bull_hidden1h_regular15m (solo)",            n: 842,  avgR: 0.943, wr: 68,  src: ds318 }

  # HTF-контекст (DS-315, фильтр старшего ТФ — усиливает направление сетапа)
  htf_context:
    - { pattern: "bull_fvg_1d + bull_fvg_4h + discount_1h (LONG стек)", n: 53, avgR: 1.728, wr: 100, dir: long, src: ds315 }
    - { pattern: "atr_down_1d + bear_fvg_1h + pivot_bounce_R1 + wt_ob", n: 56, avgR: 1.741, wr: 96,  dir: short, src: ds315 }

  # Вертикаль дивергенций (ARCH-128 наш C-валидатор, подтверждён DS-318)
  divergence_vertical:
    rule: "hidden на HTF (1h) = валидатор тренда + regular на LTF (15m) = триггер входа"
    note: "hidden БЕЗ regular слабее (DS подтвердил). +FVG = +0.3R буст. SHORT-ветка сильнее."
    best_short: "bear_fvg_15m + rsi_div_bear_hidden1h_regular15m → +1.840 WR96%"
    best_long:  "bull_fvg_overlap_held_15m + wt_div_bull_hidden → +1.842 WR100%"
