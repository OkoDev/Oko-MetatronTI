  - { id: 1d_1h_cont,  htf: 1d, ltf: 1h,  type: cont, direction: both, avgR: 0.508, wr: 73, n: 218,  post_avgR: -0.25, post_n: 2,   enabled: false }
  - { id: 1d_5m_cont,  htf: 1d, ltf: 5m,  type: cont, direction: both, avgR: 0.487, wr: 70, n: 159,  post_avgR: 0.00,  post_n: 9,   enabled: false }
  - { id: 1d_4h_cont,  htf: 1d, ltf: 4h,  type: cont, direction: both, avgR: 0.432, wr: 77, n: 168,  post_avgR: -0.25, post_n: 2,   enabled: false }
  - { id: 4h_15m_cont, htf: 4h, ltf: 15m, type: cont, direction: both, avgR: 0.286, wr: 66, n: 925,  post_avgR: -0.03, post_n: 30,  enabled: false }
