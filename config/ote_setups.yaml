# 💀 Шкаф сетапов OTE-куба — машиночитаемый конфиг для движка генерации
# Источник: data/research/2026-06-04--ote-cube/SETUP_LIBRARY.md (бэктест 45 пар, tail 120K)
# Движок генерации читает этот файл → генерит VST-сделки по enabled-сетапам.
# Метрики (avgR/wr/n/post) = из бэктеста, для приоритизации и калибровки весов.
#
# ТИП сетапа:
#   pull = откат (контр-тренд к OTE-зоне HTF, TP=OTE-зона, цель близкая)
#   cont = продолжение (по тренду от OTE-зоны, TP=HTF-target, цель далёкая)
#   cont+hid = продолжение + HTF hidden-дивергенция как валидатор тренда
# НАПРАВЛЕНИЕ: both (откаты и тренд работают в обе стороны long/short)

meta:
  version: 1
  created: "2026-06-04"
  source: "OTE-куб research (ARCH-128), шкаф 18 сетапов, 0 брака"
  engine: "smc_engine.ote_retest_setups (эталон — ОДИН калькулятор, ARCH-118)"
  mode: VST            # виртуальная торговля, без shadow

# Общая механика исполнения (для всех сетапов)
execution:
  entry: "LTF-слом структуры внутри OTE-зоны HTF (ote_retest_setups)"
  ote_zone: [0.5, 0.79]          # зона входа (эталон smc_engine)
  sl: "LTF-структура (компактный, риск ×10) — НЕ инвалидационный для слома"
  tp1: { level_R: 1.0, close_pct: 50 }    # частичный: 50% на +1R
  runner: "остаток до target (pull→OTE-зона, cont→HTF-target), SL→BE после TP1"
  trail: "ATRTrend + TSL (ExitManager / tsl_updater — другой движок)"
  # 🔴 ВЫСТРЕЛ 04.06: касание+реакция (база) + СТЕК ПОДТВЕРЖДЕНИЙ ≥ min_confirmations.
  # Подтверждения (один калькулятор combinator + сырой WT): div · fvg_held · vol ·
  # liq_sweep (eql/eqh) · wt_cross (СЫРОЙ, не strict OS<-60) · atr (3m/15m, не шумный 5m).
  # ATRTrend = ОДИН голос, не единственное вето (5m шумит → ложно блокит чистый вход).
  min_confirmations: 3           # XLM LONG 5m имел 5 → выстрелит; слабые (1-2) отсекутся
  # runner должен давать >= этого RR, иначе rr_filter роутера зарежет (RR<2.0 строго).
  # Скип FIRE заранее (ARMED) вместо мёртвого дропа. = config.yaml trading.min_rr_ratio.
  min_runner_rr: 2.0
  # 🔴 КАЛИБРОВКА 04.06 (сверка с OKO-SM на XLM 5m): detect_structure_breaks length
  # default=50 СЛЕПНЕТ на свежих разворотах (лаг). length=5 = эталон Pine: CHoCH верный.
  choch_length_ltf: 5            # для LTF-структуры/разворота (под OKO-SM pivot)
  choch_length_micro: 3         # опц. микро-BOS (больше шума)

# 🔴 ZIGZAG параметры PER-ТФ (OKO-SM Waves: Глубина=depth, Отклонение=dev)
# Default zigzag_atr(11,3) ВРЁТ на 1h (пропускает пики → OTE смещена). Эталон = настройки
# пользователя per-ТФ. Урок 04.06: индикаторы НЕ идеальны, дефолты сверять с OKO-SM.
# find_setups_zz/ote_retest_setups должны брать depth/dev по ТФ, не хардкод.
zigzag_params:
  "1h": { depth: 8, dev: 2 }    # ✅ подтверждено (XLM 1h ловит истинный пик 0.2742)
  # TODO собрать у пользователя настройки OKO-SM Waves для остальных ТФ:
  "5m":  { depth: null, dev: null }
  "15m": { depth: null, dev: null }
  "4h":  { depth: null, dev: null }
  "1d":  { depth: null, dev: null }

# Веса по тирам (стартовые, калибруются update_signal_weights на закрытых VST-сделках)
tier_weights:
  1: 1.0      # пенка — полный вес
  2: 0.6      # тело — средний
  3: 0.3      # зерно — малый (маргинальные/редкие фазы)

# ───────────────────────────────────────────────────────────────
# 🥇 TIER 1 — ПЕНКА (avgR≥0.6, POST>0) · все откаты · enabled
# ───────────────────────────────────────────────────────────────
tier1:
  - { id: 4h_5m_pull,  htf: 4h, ltf: 5m,  type: pull, direction: both, avgR: 0.960, wr: 79, n: 786,  post_avgR: 0.75, post_n: 46,  enabled: true }
  - { id: 1h_5m_pull,  htf: 1h, ltf: 5m,  type: pull, direction: both, avgR: 0.822, wr: 81, n: 2183, post_avgR: 0.55, post_n: 168, enabled: true }
  - { id: 1d_1h_pull,  htf: 1d, ltf: 1h,  type: pull, direction: both, avgR: 0.710, wr: 78, n: 297,  post_avgR: 2.60, post_n: 2,   enabled: true }
  - { id: 1d_15m_pull, htf: 1d, ltf: 15m, type: pull, direction: both, avgR: 0.701, wr: 72, n: 339,  post_avgR: 0.08, post_n: 5,   enabled: true }
  - { id: 1d_4h_pull,  htf: 1d, ltf: 4h,  type: pull, direction: both, avgR: 0.651, wr: 75, n: 175,  post_avgR: 0.82, post_n: 2,   enabled: true }

# ───────────────────────────────────────────────────────────────
