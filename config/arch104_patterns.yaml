# Defaults для всех patterns
defaults:
  min_signal_strength: 60       # composite scoring threshold
  sl_lookback_bars: 10
  sl_buffer_pct: 0.1
  max_open_positions_per_pattern: 2
  intra_pair_correlation_cap: 1   # max 1 позиция per pair per pattern (D-011)

# Risk Intelligence integration
risk_intelligence:
  v1_enabled: true               # формульный (DEV-260)
  v2_enabled: true               # ML ensemble (DEV-261)
  decision_fusion_strategy: v2_with_v1_safeguard
  v2_threshold_p_win: 0.55
  # D-028 (2026-05-20): не нужен shadow — VST на BingX уже даёт production-like
  # execution с виртуальными деньгами. Сразу VST → LIVE.
  vst_observation_until: 2026-06-03   # 14 дней VST с новыми ARCH-104 patterns
  live_capital_ramp_start: 2026-06-04  # Stage 2 LIVE 10%

# Auto-retire (Phase 7 DEV-275)
auto_retire:
  enabled: true
  pattern_avgR_30d_threshold: 0.5   # × baseline
  min_trades_for_check: 20
  retire_action: shadow_only
