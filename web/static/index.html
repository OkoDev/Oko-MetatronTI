// Конвертация UTC → локальное время браузера (ручной парсинг, надёжно для всех браузеров)
const _p = n => String(n).padStart(2, '0');
function _utcDate(utcStr) {
  if (!utcStr) return null;
  // Поддержка форматов: "2026-03-23 13:13:54", "2026-03-23T13:13:54", "2026-03-23 13:13"
  const m = String(utcStr).match(/^(\d{4})-(\d{2})-(\d{2})[\sT](\d{2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return null;
  const [, y, mo, d, h, mi, se] = m;
  return new Date(Date.UTC(+y, +mo - 1, +d, +h, +mi, +(se || 0)));
}
function fmtLocal(utcStr) {
  const d = _utcDate(utcStr);
  if (!d) return '—';
  return `${_p(d.getDate())}.${_p(d.getMonth()+1)}.${d.getFullYear()} ${_p(d.getHours())}:${_p(d.getMinutes())}`;
}
function fmtLocalTime(utcStr) {
  const d = _utcDate(utcStr);
  if (!d) return '—';
  return `${_p(d.getHours())}:${_p(d.getMinutes())}`;
}
function fmtLocalShort(utcStr) {
  const d = _utcDate(utcStr);
  if (!d) return '—';
  return `${_p(d.getDate())}.${_p(d.getMonth()+1)} ${_p(d.getHours())}:${_p(d.getMinutes())}`;
}

function tslBadge(activated, tsl_tf) {
  if (activated) {
    const tf = tsl_tf || '?';
    return `<span class="badge badge-tsl" title="TSL активен — следит за трендом на ${tf}">TSL ${tf}</span>`;
  }
  return '<span style="color:#444;font-size:.75rem" title="TSL ещё не активирован">—</span>';
}

function regimeBadge(regime) {
  if (!regime) return '<span style="color:#444">—</span>';
  const colors = {
    TREND_UP:   '#2ea043',
    TREND_DOWN: '#f85149',
    RANGE:      '#d29922',
    HIGH_VOL:   '#a371f7',
  };
  const c = colors[regime] || '#8b949e';
  const short = { TREND_UP:'↑TRD', TREND_DOWN:'↓TRD', RANGE:'RNG', HIGH_VOL:'VOL' }[regime] || regime;
  return `<span style="color:${c};font-size:.72rem;font-weight:600" title="${regime}">${short}</span>`;
}

function mfeCell(mfe_r) {
  if (mfe_r == null) return '<span style="color:#444">—</span>';
  const cls = mfe_r >= 2 ? 'green' : mfe_r >= 1 ? '' : 'red';
  const color = mfe_r >= 2 ? '#2ea043' : mfe_r >= 1 ? '#e3b341' : '#8b949e';
  return `<span style="color:${color};font-weight:600" title="Max R достигнутый за жизнь сделки">${mfe_r >= 0 ? '+' : ''}${mfe_r.toFixed(2)}R</span>`;
}

function tpCell(tp_price, tp_source, entry, direction) {
  if (!tp_price) return '<span style="color:#444">—</span>';
  let dist_pct = '';
  if (entry) {
    const d = direction === 'LONG'
      ? (tp_price - entry) / entry * 100
      : (entry - tp_price) / entry * 100;
    dist_pct = ` <span style="color:#8b949e;font-size:.73rem">(${d >= 0 ? '+' : ''}${d.toFixed(1)}%)</span>`;
  }
  const src = tp_source ? ` title="Источник: ${tp_source}"` : '';
  const srcLabel = tp_source ? ` <span style="color:#555;font-size:.68rem">${tp_source}</span>` : '';
  return `<span class="green"${src}>${fmt(tp_price,4)}</span>${dist_pct}${srcLabel}`;
}

// ── Сортировка ────────────────────────────────────────────────────────────
let _openSort = { key: null, dir: 1 };
let _openRows = [];

function sortOpenBy(key, thEl) {
  if (_openSort.key === key) _openSort.dir *= -1;
  else { _openSort.key = key; _openSort.dir = 1; }
  document.querySelectorAll('#openTradesTbl th.sortable').forEach(t => {
    t.classList.remove('sort-asc','sort-desc');
  });
  thEl.classList.add(_openSort.dir === 1 ? 'sort-asc' : 'sort-desc');
  const sorted = [..._openRows].sort((a,b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1; if (bv == null) return -1;
    return (av < bv ? -1 : av > bv ? 1 : 0) * _openSort.dir;
  });
  const wrap = document.getElementById('openTblBody');
  if (wrap) wrap.innerHTML = renderOpenRows(sorted);
}

let _closedSort = { key: null, dir: 1 };

function sortClosedBy(key, thEl) {
  if (_closedSort.key === key) _closedSort.dir *= -1;
  else { _closedSort.key = key; _closedSort.dir = 1; }
  document.querySelectorAll('#closedTradesTbl th.sortable').forEach(t => {
    t.classList.remove('sort-asc','sort-desc');
  });
  thEl.classList.add(_closedSort.dir === 1 ? 'sort-asc' : 'sort-desc');
  const sorted = [..._recentRows].sort((a,b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1; if (bv == null) return -1;
    return (av < bv ? -1 : av > bv ? 1 : 0) * _closedSort.dir;
  });
  const wrap = document.getElementById('recentTableWrap');
  if (wrap) wrap.innerHTML = renderRecentRows(sorted);
}

// ── Risk Exposure ──────────────────────────────────────────────────────────
let _riskMeta = { risk_exposure_pct: null, risk_exposure_usdt: null, deposit_usdt: null, open_pnl_r: null };

function riskExposurePanel(rows) {
  if (!rows || !rows.length) return '';
  let tslActive = 0, longN = 0, shortN = 0, deepLoss = 0;
  rows.forEach(r => {
    if (r.tsl_activated) tslActive++;
    if (r.direction === 'LONG') longN++; else shortN++;
    if (r.unrealized_r != null && r.unrealized_r < -0.5) deepLoss++;
  });
  const tslPct  = rows.length ? Math.round(tslActive / rows.length * 100) : 0;
  const tslColor = tslPct >= 30 ? '#2ea043' : tslPct >= 10 ? '#d29922' : '#f85149';
  const dpColor  = deepLoss > 5 ? '#f85149' : deepLoss > 0 ? '#d29922' : '#2ea043';

  // Risk Exposure из API (с депозитом)
  const rePct  = _riskMeta.risk_exposure_pct;
  const reUsdt = _riskMeta.risk_exposure_usdt;
  const dep    = _riskMeta.deposit_usdt;
  const pnlR   = _riskMeta.open_pnl_r;
  const reColor = rePct == null ? '#8b949e' : rePct > 10 ? '#f85149' : rePct > 5 ? '#d29922' : '#2ea043';
  const pnlColor = pnlR == null ? '#8b949e' : pnlR > 0 ? '#2ea043' : pnlR < 0 ? '#f85149' : '#8b949e';
  const reStr  = rePct != null ? `${rePct.toFixed(1)}%` : '—';
  const reUsdtStr = (reUsdt != null && dep != null) ? `$${reUsdt.toFixed(0)} / $${dep.toFixed(0)}` : '';
  const pnlStr = pnlR != null ? (pnlR >= 0 ? '+' : '') + pnlR.toFixed(2) + 'R' : '—';

  return `<div class="risk-panel">
    <div class="rp-item"><div class="rp-label">Открыто позиций</div>
      <div class="rp-val blue">${rows.length}
        <span style="font-size:.75rem;color:#8b949e;font-weight:400"> L:${longN} S:${shortN}</span>
      </div></div>
    <div class="rp-item" title="Суммарный риск: N позиций × risk_pct%">
      <div class="rp-label">Под риском (депозит)</div>
      <div class="rp-val" style="color:${reColor}">${reStr}</div>
      <div style="font-size:.7rem;color:#555">${reUsdtStr}</div></div>
    <div class="rp-item" title="Сумма нереализованного R по всем открытым сделкам">
      <div class="rp-label">Open P&L</div>
      <div class="rp-val" style="color:${pnlColor}">${pnlStr}</div></div>
    <div class="rp-item"><div class="rp-label">TSL защита</div>
      <div class="rp-val" style="color:${tslColor}">${tslActive}
        <span style="font-size:.75rem;font-weight:400">(${tslPct}%)</span></div></div>
    <div class="rp-item"><div class="rp-label">Глубокий минус (&lt;−0.5R)</div>
      <div class="rp-val" style="color:${dpColor}">${deepLoss}</div></div>
  </div>`;
}

// ── Возраст позиции и EXPIRED countdown ───────────────────────────────────
const MAX_TRADE_H = 48;
function ageCell(created_at) {
  const d = _utcDate(created_at);
  if (!d) return '—';
  const now = Date.now();
  const ageMs = now - d.getTime();
  const ageH = ageMs / 3600000;
  const remH = MAX_TRADE_H - ageH;
  const ageStr = ageH < 1
    ? Math.round(ageMs/60000) + 'м'
    : ageH < 24
      ? ageH.toFixed(1) + 'ч'
      : (ageH/24).toFixed(1) + 'д';
  if (remH <= 0) return `<span class="red" title="Сделка истекает">⏰ EXPIRED</span>`;
  const expColor = remH < 4 ? '#f85149' : remH < 12 ? '#d29922' : '#8b949e';
  const expStr   = remH < 24 ? remH.toFixed(0)+'ч' : (remH/24).toFixed(1)+'д';
  return `<span style="color:#8b949e">${ageStr}</span>`
    + `<span style="color:${expColor};font-size:.68rem" title="До EXPIRED: ${expStr}"> /${expStr}</span>`;
}

function cascadeBadge(level) {
  if (!level) return '<span style="color:#333">—</span>';
  const cfg = { '4h': ['#2ea043','↑4h'], '1h': ['#d29922','→1h'], '15m': ['#58a6ff','↓15m'] };
  const [c, lbl] = cfg[level] || ['#8b949e', level];
  return `<span style="color:${c};font-size:.72rem;font-weight:700" title="TSL cascade level: ${level}">${lbl}</span>`;
}

function signalModeBadge(mode, confSources) {
  const modeColors = {
    'momentum':  ['#58a6ff', 'MOM'],
    'reversal':  ['#2ea043', 'REV'],
    'cascade':   ['#d29922', 'CAS'],
    'unknown':   ['#555',    '—'],
  };
  const [mc, ml] = modeColors[mode] || ['#555', mode || '—'];
  const sources = (confSources || []).filter(s => s);
  const tip = sources.length
    ? sources.map(s => s.replace('atr_change_','ATR-').replace('zone_os_','OS-').replace('zone_ob_','OB-')).join(' + ')
    : (mode || '—');
  const dots = sources.map(s => {
    if (s.includes('atr_change_1h'))  return '<span style="color:#f8c400;font-size:.8rem" title="ATR 1h">●</span>';
    if (s.includes('atr_change_4h'))  return '<span style="color:#2ea043;font-size:.8rem" title="ATR 4h">●</span>';
    if (s.includes('atr_change_15m')) return '<span style="color:#58a6ff;font-size:.8rem" title="ATR 15m">●</span>';
    if (s.includes('zone_os'))        return '<span style="color:#a371f7;font-size:.8rem" title="Zone OS">◆</span>';
    if (s.includes('zone_ob'))        return '<span style="color:#f85149;font-size:.8rem" title="Zone OB">◆</span>';
    return '<span style="color:#8b949e;font-size:.8rem">·</span>';
  }).join('');
  return `<span style="color:${mc};font-size:.7rem;font-weight:700" title="${tip}">${ml}</span> ${dots}`;
}

function renderOpenRows(rows) {
  return rows.map(r => {
    const pnl = r.unrealized_pct;
    const pnlClass = pnl == null ? '' : pnl >= 0 ? 'green' : 'red';
    const pnlStr = pnl != null ? (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '%' : '—';
    const rVal = r.unrealized_r;
    const rStr = rVal != null ? (rVal >= 0 ? '+' : '') + rVal.toFixed(2) + 'R' : '—';
    const rClass = rVal == null ? '' : rVal >= 0 ? 'green' : 'red';
    const curStr = r.current_price != null ? fmt(r.current_price, 4) : '<span style="color:#666">—</span>';
    let rowBg = '';
    if (r.tsl_activated) rowBg = 'background:rgba(184,126,255,0.07)';
    else if (rVal != null && rVal < -0.5) rowBg = 'background:rgba(248,81,73,0.05)';
    const rowStyle = rowBg ? ` style="${rowBg}"` : '';
    const tfLabel = r.timeframe ? `<span style="color:#555;font-size:.68rem"> ${r.timeframe}</span>` : '';
    return `<tr${rowStyle}>
      <td>${r.id}</td>
      <td>${symLink(r.symbol)}${tfLabel}</td>
      <td class="${r.direction==='LONG'?'green':'red'}">${r.direction}</td>
      <td>${r.signal_type||'—'}</td>
      <td>${signalModeBadge(r.signal_mode, r.conf_sources)}</td>
      <td>${regimeBadge(r.regime)}</td>
      <td>${fmt(r.entry_price,4)}</td>
      <td>${curStr}</td>
      <td class="${pnlClass}">${pnlStr}</td>
      <td class="${rClass}">${rStr}</td>
      <td>${mfeCell(r.mfe_r)}</td>
      <td class="red" title="${r.sl_source||''}">${fmt(r.stop_loss,4)}</td>
      <td>${tpCell(r.take_profit, r.tp_source, r.entry_price, r.direction)}</td>
      <td>${tslBadge(r.tsl_activated, r.tsl_tf)}</td>
      <td>${cascadeBadge(r.cascade_level)}</td>
      <td>${ageCell(r.created_at)}</td>
      <td><button onclick="closeTrade(${r.id},this)" style="background:#b22222;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:12px">✕</button></td>
    </tr>`;
  }).join('');
}

function openTradesTable(rows) {
  if (!rows || !rows.length) return '<p class="note">Нет открытых позиций</p>';
  _openRows = rows;
  return riskExposurePanel(rows) + `<table id="openTradesTbl"><thead><tr>
    <th class="sortable" onclick="sortOpenBy('id',this)">#</th>
    <th>Символ</th>
    <th class="sortable" onclick="sortOpenBy('direction',this)">Dir</th>
    <th class="sortable" onclick="sortOpenBy('signal_type',this)">Сигнал</th>
    <th title="signal_mode + confirmations (ATR/Zone)">Mode</th>
    <th class="sortable" onclick="sortOpenBy('regime',this)">Режим</th>
    <th>Вход</th><th>Сейчас</th>
    <th class="sortable" onclick="sortOpenBy('unrealized_pct',this)">P&L%</th>
    <th class="sortable" onclick="sortOpenBy('unrealized_r',this)">R сейчас</th>
    <th class="sortable" onclick="sortOpenBy('mfe_r',this)">Max R↑</th>
    <th>SL</th><th>TP</th><th>TSL</th><th title="TSL Cascade уровень: 4h→1h→15m">Casc</th>
    <th class="sortable" onclick="sortOpenBy('created_at',this)">Возраст/Exp</th>
    <th>✕</th>
  </tr></thead><tbody id="openTblBody">${renderOpenRows(rows)}</tbody></table>`;
}

async function closeTrade(id, btn) {
  if (!confirm(`Закрыть сделку #${id} по текущей цене?`)) return;
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await fetch(`/api/trades/${id}/close`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    if (!r.ok) {
      const msg = await r.text().catch(() => `HTTP ${r.status}`);
      alert(msg || `Ошибка ${r.status}`);
      btn.textContent = 'Err'; btn.disabled = false;
      return;
    }
    const d = await r.json();
    if (d.ok) { btn.textContent = '✓'; btn.style.background='#2a6'; load(); }
    else { btn.textContent = 'Err'; btn.disabled = false; }
  } catch(e) { btn.textContent = 'Err'; btn.disabled = false; }
}

let _recentRows = [];
let _closedPage = 1;
let _closedPerPage = 50;
let _closedInitialized = false;
let _closedTotal = 0;
let _closedTotalPages = 1;

// ── Вставка новой закрытой сделки в начало таблицы (SSE trade_closed) ─────
// Работает без перезагрузки: добавляет строку в начало tbody и обновляет счётчик.
function prependClosedTrade(trade) {
  // Обновляем внутренний счётчик
  _closedTotal++;
  const hdr = document.getElementById('closedTotalHeader');
  if (hdr) hdr.textContent = `(всего ${_closedTotal})`;

  // Добавляем в массив данных (для фильтров и сортировки)
  _recentRows.unshift(trade);
  // Держим массив в разумных пределах (не дублируем из пагинации)
  if (_recentRows.length > _closedPerPage * 2) {
    _recentRows.pop();
  }

  // Вставляем строку в начало таблицы истории (если страница открыта)
  const wrap = document.getElementById('recentTableWrap');
  if (!wrap) return;

  // Проверяем: есть ли уже таблица (история загружена)
  const tbl = wrap.querySelector('table#closedTradesTbl');
  if (!tbl) {
    // Таблица ещё не создана — просто перерисуем всё
    wrap.innerHTML = renderRecentRows(_recentRows);
    return;
  }
  const tbody = tbl.querySelector('tbody');
  if (!tbody) return;

  // Рендерим одну строку и вставляем в начало
  const tempDiv = document.createElement('div');
  // renderRecentRows возвращает полную таблицу, нам нужна только строка
  const rowHtml = _renderSingleClosedRow(trade);
  tempDiv.innerHTML = rowHtml;
  const newRow = tempDiv.firstElementChild;
  if (newRow && tbody.firstChild) {
    tbody.insertBefore(newRow, tbody.firstChild);
  } else if (newRow) {
    tbody.appendChild(newRow);
  }
}

// ── Рендер одной строки закрытой сделки (используется в prependClosedTrade) ─
function _renderSingleClosedRow(r) {
  const capPct = r.captured_R_pct != null ? fmt(r.captured_R_pct,0)+'%' : '—';
  const capClass = r.captured_R_pct != null ? (r.captured_R_pct >= 60 ? 'green' : r.captured_R_pct >= 30 ? 'yellow' : 'red') : '';
  const tpSrc = (r.tp_source||'').replace('pivot_','').split(':')[0] || '—';
  const durStr = r.duration_minutes != null
    ? (r.duration_minutes < 60 ? Math.round(r.duration_minutes)+'м'
      : r.duration_minutes < 1440 ? (r.duration_minutes/60).toFixed(1)+'ч'
      : (r.duration_minutes/1440).toFixed(1)+'д')
    : '—';
  const fc = parseTradeFeatures(r);
  const trigCell = atrChipForTrigger(fc.triggerCat) || '<span style="color:#444">—</span>';
  const trigTitle = fc.triggerSource || 'без trigger_source';
  const breakdownBar = strengthBreakdownBar(fc.breakdown);
  return `<tr>
    <td>${r.id}</td>
    <td>${symLink(r.symbol)}</td>
    <td class="${r.direction==='LONG'?'green':'red'}">${r.direction||'—'}</td>
    <td>${r.signal_type||'—'}</td>
    <td title="${trigTitle}">${trigCell}</td>
    <td>${zoneCell(fc.zone)}</td>
    <td>${regimeBadge(r.regime)}</td>
    <td style="color:#8b949e;font-size:.75rem">${r.timeframe||'—'}</td>
    <td>${r.status === 'TSL' ? `<span class="badge badge-tsl" title="TF: ${r.tsl_tf||'?'}">TSL ${r.tsl_tf||'?'}</span>` : badge(r.status)}</td>
    <td class="${color(r.profit_pct)}">${fmtPct(r.profit_pct)}</td>
    <td class="${color(r.R_multiple)}">${fmt(r.R_multiple,2)}</td>
    <td>${breakdownBar || '<span style="color:#444">—</span>'}</td>
    <td class="yellow">${r.max_R_possible != null ? fmt(r.max_R_possible,2) : '—'}</td>
    <td class="${capClass}">${capPct}</td>
    <td style="color:#8b949e;font-size:.75rem">${tpSrc}</td>
    <td style="color:#8b949e">${durStr}</td>
    <td style="color:#8b949e;font-size:.8rem">${fmtLocalShort(r.created_at)}</td>
    <td style="font-size:.85rem">${fmtLocalShort(r.closed_at)}</td>
  </tr>`;
}

async function loadClosedPage(page) {
  _closedPage = page;
  try {
    const r = await fetch(`/api/closed_trades?page=${page}&per_page=${_closedPerPage}`);
    const d = await r.json();
    _closedTotal = d.total;
    _closedTotalPages = d.total_pages;
    _recentRows = d.rows || [];
    const wrap = document.getElementById('recentTableWrap');
    if (wrap) wrap.innerHTML = renderRecentRows(_recentRows);
    updatePaginationControls();
    updateFilterOptions();
    applyFilters();
  } catch(e) { console.error('loadClosedPage:', e); }
}

function updatePaginationControls() {
  const hdr = document.getElementById('closedTotalHeader');
  if (hdr) hdr.textContent = `(всего ${_closedTotal})`;
  const el = document.getElementById('closedPagination');
  if (!el) return;
  const from = (_closedPage - 1) * _closedPerPage + 1;
  const to = Math.min(_closedPage * _closedPerPage, _closedTotal);
  const isFirst = _closedPage <= 1, isLast = _closedPage >= _closedTotalPages;
  const btn = (label, page, disabled) =>
    `<button onclick="loadClosedPage(${page})" ${disabled?'disabled':''}
      style="background:${disabled?'#161b22':'#21262d'};border:1px solid ${disabled?'#21262d':'#30363d'};
             color:${disabled?'#484f58':'#c9d1d9'};border-radius:6px;padding:4px 10px;
             font-size:.8rem;cursor:${disabled?'default':'pointer'}">${label}</button>`;
  el.innerHTML =
    btn('⟪', 1, isFirst) +
    btn('‹ Пред', _closedPage - 1, isFirst) +
    `<span style="padding:4px 14px;background:#161b22;border:1px solid #30363d;border-radius:6px;
                  font-size:.8rem;color:#8b949e;white-space:nowrap">
       стр.&nbsp;<strong style="color:#c9d1d9">${_closedPage}</strong>&nbsp;/&nbsp;${_closedTotalPages}
       <span style="color:#484f58;margin:0 6px">·</span>
       <strong style="color:#c9d1d9">${from}–${to}</strong>&nbsp;из&nbsp;${_closedTotal}
     </span>` +
    btn('След ›', _closedPage + 1, isLast) +
    btn('⟫', _closedTotalPages, isLast) +
    `<select onchange="changePerPage(this.value)"
       style="margin-left:6px;background:#161b22;border:1px solid #30363d;color:#c9d1d9;
              border-radius:6px;padding:4px 8px;font-size:.8rem;cursor:pointer">
       ${[20,50,100,200].map(n=>`<option value="${n}"${n===_closedPerPage?' selected':''}>${n}&nbsp;/&nbsp;стр.</option>`).join('')}
     </select>`;
}

function changePerPage(val) {
  _closedPerPage = parseInt(val);
  loadClosedPage(1);
}

function updateFilterOptions() {
  const statuses = [...new Set(_recentRows.map(r=>r.status).filter(Boolean))].sort();
  const dirs     = [...new Set(_recentRows.map(r=>r.direction).filter(Boolean))].sort();
  const sigs     = [...new Set(_recentRows.map(r=>r.signal_type).filter(Boolean))].sort();
  const mkOpts = (id, vals) => {
    const el = document.getElementById(id); if (!el) return;
    const cur = el.value;
    el.innerHTML = `<option value="">Все</option>` + vals.map(v=>`<option value="${v}"${v===cur?' selected':''}>${v}</option>`).join('');
  };
  mkOpts('fStatus', statuses);
  mkOpts('fDir', dirs);
  mkOpts('fSig', sigs);
}

// ── DEV-207: trigger_source helper ─────────────────────────────────────────
// Парсит features_json (строка или объект) и возвращает trigger_source / atr_tf / zone / strength_breakdown.
function parseTradeFeatures(r) {
  if (r._featCache) return r._featCache;
  let fj = r.features_json;
  if (typeof fj === 'string') {
    try { fj = JSON.parse(fj); } catch { fj = null; }
  }
  fj = fj || {};
  // Прямые поля (если когда-то будут писаться)
  let triggerSource = fj.trigger_source || null;
  let atrTf = fj.atr_tf || null;
  let zone = fj.zone || fj.wt_zone || null;
  // Сканируем confirmations[] — реальный источник истины (DEV-202)
  const confs = Array.isArray(fj.confirmations) ? fj.confirmations : [];
  if (!triggerSource || !atrTf || !zone) {
    let best = null;  // confirmation с max weight + source 'atr_change_*'
    for (const c of confs) {
      if (!c || typeof c !== 'object') continue;
      const s = c.source || '';
      if (typeof s !== 'string') continue;
      if (s.startsWith('atr_change_')) {
        const w = c.weight || 0;
        if (best == null || w > best.weight) best = c;
      }
    }
    if (best) {
      if (!triggerSource) triggerSource = best.source;
      if (!atrTf) atrTf = best.source.slice('atr_change_'.length);
      if (!zone && best.evidence && best.evidence.zone) zone = best.evidence.zone;
    }
  }
  let triggerCat = 'other';
  if (typeof triggerSource === 'string') {
    if (triggerSource.startsWith('atr_change_')) {
      triggerCat = triggerSource;
    } else if (triggerSource.startsWith('event_bus')) {
      triggerCat = 'event_bus';
    } else {
      triggerCat = triggerSource;
    }
  }
  const cache = {
    triggerSource,
    triggerCat,
    atrTf,
    zone,
    breakdown: fj.strength_breakdown || null,
    confirmations: confs.length ? confs : null,
  };
  Object.defineProperty(r, '_featCache', { value: cache, enumerable: false });
  return cache;
}

function atrChipForTrigger(triggerCat) {
  if (!triggerCat || triggerCat === 'other') return '';
  if (triggerCat === 'atr_change_1h')  return '<span style="color:#f8c400;font-size:.85rem;margin-right:3px" title="ATR Change 1h">●</span>';
  if (triggerCat === 'atr_change_4h')  return '<span style="color:#2ea043;font-size:.85rem;margin-right:3px" title="ATR Change 4h">●</span>';
  if (triggerCat === 'atr_change_15m') return '<span style="color:#58a6ff;font-size:.85rem;margin-right:3px" title="ATR Change 15m">●</span>';
  if (triggerCat === 'event_bus')      return '<span style="color:#a371f7;font-size:.78rem;margin-right:3px" title="EventBus">◆</span>';
  return '';
}

function zoneCell(zone) {
  if (!zone) return '<span style="color:#444">—</span>';
  const z = String(zone).toUpperCase();
  if (z.includes('OS')) return '<span style="color:#a371f7;font-size:.72rem;font-weight:700" title="Oversold">OS</span>';
  if (z.includes('OB')) return '<span style="color:#f85149;font-size:.72rem;font-weight:700" title="Overbought">OB</span>';
  return `<span style="color:#8b949e;font-size:.72rem">${z.slice(0,4)}</span>`;
}

// Stack-bar для strength_breakdown { trigger: N, confirmations: M, ... }
function strengthBreakdownBar(breakdown) {
  if (!breakdown || typeof breakdown !== 'object') return '';
  const entries = Object.entries(breakdown).filter(([k, v]) => typeof v === 'number' && v > 0);
  if (!entries.length) return '';
  const total = entries.reduce((s, [, v]) => s + v, 0);
  if (total <= 0) return '';
  const colors = { trigger: '#1f6feb', confirmations: '#2ea043', confirmations_total: '#2ea043',
                   base: '#1f6feb', divergence: '#a371f7', volume: '#d29922', mtf: '#58a6ff' };
  const W = 70, H = 8;
  let x = 0;
  const segs = entries.map(([k, v]) => {
    const w = Math.max(1, Math.round(v / total * W));
    const c = colors[k] || '#8b949e';
    const r = `<rect x="${x}" y="0" width="${w}" height="${H}" fill="${c}"><title>${k}: ${v}</title></rect>`;
    x += w;
    return r;
  }).join('');
  const tip = entries.map(([k, v]) => `${k}=${v}`).join(' / ');
  return `<svg width="${W}" height="${H}" style="vertical-align:middle" title="${tip}">${segs}</svg>`;
}

function recentTable(rows) {
  _recentRows = rows || [];
  if (!_closedInitialized) {
    _closedInitialized = true;
    setTimeout(() => loadClosedPage(1), 0);
  }
  return `
  <div class="filter-bar">
    <label>Статус:</label>
    <select id="fStatus" onchange="applyFilters()"><option value="">Все</option></select>
    <label>Dir:</label>
    <select id="fDir" onchange="applyFilters()"><option value="">Все</option></select>
    <label>Сигнал:</label>
    <select id="fSig" onchange="applyFilters()"><option value="">Все</option></select>
    <label>Режим:</label>
    <select id="fRegime" onchange="applyFilters()">
      <option value="">Все</option>
      <option value="TREND_UP">TREND_UP</option>
      <option value="TREND_DOWN">TREND_DOWN</option>
      <option value="RANGE">RANGE</option>
      <option value="HIGH_VOL">HIGH_VOL</option>
    </select>
    <label>TF:</label>
    <select id="fTf" onchange="applyFilters()">
      <option value="">Все</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h">4h</option>
      <option value="1d">1d</option>
    </select>
    <label>Trigger:</label>
    <select id="fTrigger" onchange="applyFilters()">
      <option value="">Все</option>

      <option value="atr_change_4h">ATR 4h</option>

  <div id="recentTableWrap">${renderRecentRows(_recentRows)}</div>`;
}

function renderRecentRows(rows) {
  if (!rows.length) return '<p class="note">Нет сделок по фильтру</p>';
  const s = (key, label) =>
    `<th class="sortable" onclick="sortClosedBy('${key}',this)">${label}</th>`;
  return `<table id="closedTradesTbl"><thead><tr>
    ${s('id','#')}<th>Символ</th>${s('direction','Dir')}
    ${s('signal_type','Сигнал')}<th title="ATR trigger / EventBus">Trig</th><th title="OS/OB зона">Zone</th>
    ${s('regime','Режим')}<th>TF</th>${s('status','Статус')}
    ${s('profit_pct','Profit%')}${s('R_multiple','R')}<th title="strength_breakdown">Str</th>
    ${s('max_R_possible','Max R')}${s('captured_R_pct','Cap%')}
    <th>TP src</th>${s('duration_minutes','Длит')}${s('created_at','Открыта')}${s('closed_at','Закрыта')}
  </tr></thead><tbody>` +
  rows.map(r => {
    const capPct = r.captured_R_pct != null ? fmt(r.captured_R_pct,0)+'%' : '—';
    const capClass = r.captured_R_pct != null ? (r.captured_R_pct >= 60 ? 'green' : r.captured_R_pct >= 30 ? 'yellow' : 'red') : '';
    const tpSrc = (r.tp_source||'').replace('pivot_','').split(':')[0] || '—';
    const durStr = r.duration_minutes != null
      ? (r.duration_minutes < 60 ? Math.round(r.duration_minutes)+'м'
        : r.duration_minutes < 1440 ? (r.duration_minutes/60).toFixed(1)+'ч'
        : (r.duration_minutes/1440).toFixed(1)+'д')
      : '—';
    const fc = parseTradeFeatures(r);
    const trigCell = atrChipForTrigger(fc.triggerCat) || '<span style="color:#444">—</span>';
    const trigTitle = fc.triggerSource || 'без trigger_source';
    const breakdownBar = strengthBreakdownBar(fc.breakdown);
    return `<tr>
      <td>${r.id}</td>
      <td>${symLink(r.symbol)}</td>
      <td class="${r.direction==='LONG'?'green':'red'}">${r.direction||'—'}</td>
      <td>${r.signal_type||'—'}</td>
      <td title="${trigTitle}">${trigCell}</td>
      <td>${zoneCell(fc.zone)}</td>
      <td>${regimeBadge(r.regime)}</td>
      <td style="color:#8b949e;font-size:.75rem">${r.timeframe||'—'}</td>
      <td>${r.status === 'TSL' ? `<span class="badge badge-tsl" title="TF: ${r.tsl_tf||'?'}">TSL ${r.tsl_tf||'?'}</span>` : badge(r.status)}</td>
      <td class="${color(r.profit_pct)}">${fmtPct(r.profit_pct)}</td>
      <td class="${color(r.R_multiple)}">${fmt(r.R_multiple,2)}</td>
      <td>${breakdownBar || '<span style="color:#444">—</span>'}</td>
      <td class="yellow">${r.max_R_possible != null ? fmt(r.max_R_possible,2) : '—'}</td>
      <td class="${capClass}">${capPct}</td>
      <td style="color:#8b949e;font-size:.75rem">${tpSrc}</td>
      <td style="color:#8b949e">${durStr}</td>
      <td style="color:#8b949e;font-size:.8rem">${fmtLocalShort(r.created_at)}</td>
      <td style="font-size:.85rem">${fmtLocalShort(r.closed_at)}</td>
    </tr>`;
  }).join('') + '</tbody></table>';
}

function applyFilters() {
  const st   = document.getElementById('fStatus')?.value  || '';
  const dir  = document.getElementById('fDir')?.value     || '';
  const sig  = document.getElementById('fSig')?.value     || '';
  const reg  = document.getElementById('fRegime')?.value  || '';
  const tf   = document.getElementById('fTf')?.value      || '';
  const trig = document.getElementById('fTrigger')?.value || '';
  const filtered = _recentRows.filter(r => {
    if (st  && r.status      !== st)  return false;
    if (dir && r.direction   !== dir) return false;
    if (sig && r.signal_type !== sig) return false;
    if (reg && r.regime      !== reg) return false;
    if (tf  && r.timeframe   !== tf)  return false;
    if (trig) {
      const cat = parseTradeFeatures(r).triggerCat;
      if (cat !== trig) return false;
    }
    return true;
  });
  const wrap = document.getElementById('recentTableWrap');
  if (wrap) wrap.innerHTML = renderRecentRows(filtered);
}

function resetFilters() {
  ['fStatus','fDir','fSig','fRegime','fTf','fTrigger'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  applyFilters();
}

// ════════════════════════════════════════════════════════════════════════════
// DEV-207: Dropped Signals UI + ATR Change visualization
// ════════════════════════════════════════════════════════════════════════════

let _dropsHours = 24;
let _dropsFilters = { symbol: '', gate: '', signal: '', direction: '' };
let _dropsRecent = [];
let _dropsRecentPage = 1;
const DROPS_PER_PAGE = 50;

const GATE_COLORS = {
  'dedup': '#58a6ff',
  'sl_cooldown': '#fb8500',
  'pair_cooldown_sl_streak': '#f85149',
  'strength_too_low': '#f8c400',
  'min_strength_register': '#f8c400',
  'min_volume_usd': '#8b949e',
};
function gateColor(gate) {
  return GATE_COLORS[gate] || '#a371f7';
}

async function loadDropsPage() {
  const root = document.getElementById('dropsContent');
  if (!root) return;
  try {
    const [topResp, recentResp] = await Promise.all([
      fetch(`/api/dropped?hours=${_dropsHours}&limit=10`),
      fetch(`/api/dropped?hours=${_dropsHours}&limit=200&detail=1`),
    ]);
    const top = await topResp.json();
    const recent = await recentResp.json();
    _dropsRecent = recent.recent || [];
    _dropsRecentPage = 1;
    // Нормализуем ключи (decision_trace.get_top_drops отдаёт `gate`, не `gate_name`)
    const drops = (top.drops || []).map(d => ({
      gate_name: d.gate_name || d.gate,
      count: d.count,
      symbols: d.symbols,
    }));
    root.innerHTML = renderDropsPage(drops);
    renderDropsRecentTable();
    // Update sidebar badge
    const totalCnt = drops.reduce((s, d) => s + (d.count || 0), 0);
    const badge = document.getElementById('navDropsCount');
    if (badge) badge.textContent = totalCnt > 999 ? (totalCnt/1000).toFixed(1)+'k' : String(totalCnt);
  } catch (e) {
    console.error('loadDropsPage:', e);
    root.innerHTML = '<p class="note red">Ошибка загрузки: ' + (e.message || e) + '</p>';
  }
}

function changeDropsPeriod(hours) {
  _dropsHours = parseInt(hours);
  loadDropsPage();
}

function renderDropsPage(topGates) {
  const totalDrops = topGates.reduce((s, d) => s + (d.count || 0), 0);
  const top1 = topGates[0] || null;
  const top1Pct = top1 && totalDrops ? (top1.count / totalDrops * 100).toFixed(0) : 0;
  const periodLabel = _dropsHours <= 1 ? '1ч' : _dropsHours <= 6 ? '6ч' : _dropsHours <= 24 ? '24ч' : '7д';

  const periodBtn = (h, lbl) => {
    const active = _dropsHours === h;
    return `<button onclick="changeDropsPeriod(${h})"
      style="background:${active?'#1f6feb':'#21262d'};color:${active?'#fff':'#c9d1d9'};
             border:1px solid ${active?'#1f6feb':'#30363d'};border-radius:6px;
             padding:4px 12px;font-size:.8rem;cursor:pointer;font-weight:${active?'700':'400'}">
      ${lbl}</button>`;
  };

  return `
  <!-- Метрики верхней панели -->
  <section style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <span style="color:#8b949e;font-size:.8rem">Период:</span>
      ${periodBtn(1, '1ч')}
      ${periodBtn(6, '6ч')}
      ${periodBtn(24, '24ч')}
      ${periodBtn(168, '7д')}
      <button onclick="loadDropsPage()" style="margin-left:auto;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:4px 10px;font-size:.78rem;cursor:pointer">↻ Обновить</button>
    </div>
    <div class="cards" style="grid-template-columns:repeat(3,1fr)">
      <div class="card">
        <div class="label">Total drops за ${periodLabel}</div>
        <div class="value" style="color:#f85149">${totalDrops.toLocaleString('ru')}</div>
        <div class="label" style="margin-top:4px">отброшено gate-фильтрами</div>
      </div>
      <div class="card">
        <div class="label">Топ gate</div>
        <div class="value" style="font-size:1.15rem;color:${top1?gateColor(top1.gate_name):'#8b949e'}">${top1 ? top1.gate_name : '—'}</div>
        <div class="label" style="margin-top:4px">${top1 ? top1.count + ' (' + top1Pct + '%)' : 'нет данных'}</div>
      </div>
      <div class="card">
        <div class="label">Drops/час (sparkline 24ч)</div>
        <div id="dropsSparkline" style="margin-top:4px;height:42px">${renderDropsSparkline()}</div>
      </div>
    </div>
  </section>

  <!-- Топ-10 gates -->
  <section>
    <h2>Топ gates за ${periodLabel}</h2>
    ${renderTopGatesCards(topGates, totalDrops)}
  </section>

  <!-- Recent drops -->
  <section>
    <h2>Последние drops <span style="color:#8b949e;font-size:.8em;font-weight:400">(${_dropsRecent.length} записей)</span></h2>
    <div class="filter-bar">
      <label>Символ:</label>
      <input id="dfSymbol" type="text" placeholder="BTC" oninput="onDropsFilter()" style="width:90px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:3px 7px;font-size:.8rem">
      <label>Gate:</label>
      <select id="dfGate" onchange="onDropsFilter()"><option value="">Все</option></select>
      <label>Сигнал:</label>
      <select id="dfSignal" onchange="onDropsFilter()"><option value="">Все</option></select>
      <label>Dir:</label>
      <select id="dfDir" onchange="onDropsFilter()">
        <option value="">Все</option><option value="LONG">LONG</option><option value="SHORT">SHORT</option>
      </select>
      <button onclick="resetDropsFilters()">✕ Сброс</button>
    </div>
    <div id="dropsRecentPagination" style="margin:10px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap"></div>
    <div id="dropsRecentWrap"><p class="note">Загрузка…</p></div>
  </section>`;
}

function renderTopGatesCards(rows, total) {
  if (!rows || !rows.length) return '<p class="note">Нет drops за период</p>';
  const max = Math.max(...rows.map(r => r.count));
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px">
    ${rows.map(r => {
      const c = gateColor(r.gate_name);
      const pct = total ? (r.count / total * 100).toFixed(1) : 0;
      const barW = max ? Math.round(r.count / max * 100) : 0;
      const symStr = r.symbols != null ? `${r.symbols} пар` : '';
      return `<div style="background:#161b22;border:1px solid ${c}44;border-left:3px solid ${c};border-radius:8px;padding:10px 12px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px">
          <div style="font-weight:700;color:${c};font-size:.88rem">${r.gate_name}</div>
          <div style="font-size:1.15rem;font-weight:700;color:#c9d1d9">${r.count}</div>
        </div>
        <div style="background:#21262d;border-radius:3px;height:4px;margin:6px 0">
          <div style="background:${c};width:${barW}%;height:100%;border-radius:3px"></div>
        </div>
        <div style="font-size:.7rem;color:#8b949e">${symStr} <span style="color:#484f58">·</span> ${pct}% от total</div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderDropsSparkline() {
  if (!_dropsRecent || !_dropsRecent.length) return '<span style="color:#484f58;font-size:.78rem">нет данных</span>';
  const buckets = new Array(24).fill(0);
  const now = Date.now();
  _dropsRecent.forEach(d => {
    const t = Date.parse((d.dropped_at || '').replace(' ', 'T') + 'Z');
    if (isNaN(t)) return;
    const hAgo = Math.floor((now - t) / 3600_000);
    if (hAgo >= 0 && hAgo < 24) buckets[23 - hAgo]++;
  });
  const max = Math.max(...buckets, 1);
  const W = 220, H = 42, bW = W / 24;
  const bars = buckets.map((c, i) => {
    const h = Math.round(c / max * (H - 4));
    return `<rect x="${i * bW}" y="${H - h}" width="${bW - 0.6}" height="${h}" fill="#f85149aa" rx="1"><title>${c} drops, ${23-i}ч назад</title></rect>`;
  }).join('');
  return `<svg width="${W}" height="${H}" style="display:block">${bars}</svg>`;
}

function onDropsFilter() {
  _dropsFilters.symbol = (document.getElementById('dfSymbol')?.value || '').trim().toUpperCase();
  _dropsFilters.gate = document.getElementById('dfGate')?.value || '';
  _dropsFilters.signal = document.getElementById('dfSignal')?.value || '';
  _dropsFilters.direction = document.getElementById('dfDir')?.value || '';
  _dropsRecentPage = 1;
  renderDropsRecentTable();
}

function resetDropsFilters() {
  _dropsFilters = { symbol: '', gate: '', signal: '', direction: '' };
  ['dfSymbol','dfGate','dfSignal','dfDir'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  _dropsRecentPage = 1;
  renderDropsRecentTable();
}

function filterDrops(rows) {
  const f = _dropsFilters;
  return rows.filter(r =>
    (!f.symbol || (r.symbol || '').toUpperCase().includes(f.symbol)) &&
    (!f.gate   || r.gate_name === f.gate) &&
    (!f.signal || (r.signal_type || '') === f.signal) &&
    (!f.direction || r.direction === f.direction)
  );
}

function renderDropsRecentTable() {
  // Filter dropdowns: fill once from full dataset
  const fillOnce = (id, vals) => {
    const el = document.getElementById(id);
    if (!el || el.options.length > 1) return;
    el.innerHTML = '<option value="">Все</option>' +
      [...new Set(vals.filter(Boolean))].sort().map(v => `<option value="${v}">${v}</option>`).join('');
  };
  fillOnce('dfGate',   _dropsRecent.map(r => r.gate_name));
  fillOnce('dfSignal', _dropsRecent.map(r => r.signal_type));

  const filtered = filterDrops(_dropsRecent);
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / DROPS_PER_PAGE));
  if (_dropsRecentPage > totalPages) _dropsRecentPage = totalPages;
  const from = (_dropsRecentPage - 1) * DROPS_PER_PAGE;
  const slice = filtered.slice(from, from + DROPS_PER_PAGE);

  const wrap = document.getElementById('dropsRecentWrap');
  if (!wrap) return;
  if (!filtered.length) {
    wrap.innerHTML = '<p class="note">Нет drops по фильтру</p>';
  } else {
    wrap.innerHTML = `<table><thead><tr>
      <th>Время</th><th>Символ</th><th>Сигнал</th><th>Dir</th><th>Strength</th>
      <th>Gate</th><th>Причина</th>
    </tr></thead><tbody>${slice.map(d => {
      const c = gateColor(d.gate_name);
      const reason = (d.drop_reason || '').replace(/"/g, '&quot;');
      const short = (d.drop_reason || '').slice(0, 70);
      return `<tr>
        <td style="color:#8b949e;font-size:.78rem;white-space:nowrap">${fmtLocalShort(d.dropped_at)}</td>
        <td>${symLink(d.symbol)}</td>
        <td>${d.signal_type || '—'}</td>
        <td class="${d.direction==='LONG'?'green':d.direction==='SHORT'?'red':''}">${d.direction || '—'}</td>
        <td style="color:#c9d1d9">${d.strength != null ? d.strength : '—'}</td>
        <td><span style="color:${c};font-weight:700">${d.gate_name}</span></td>
        <td style="color:#8b949e;font-size:.78rem" title="${reason}">${short}${(d.drop_reason||'').length>70?'…':''}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
  }

  // Pagination
  const pgEl = document.getElementById('dropsRecentPagination');
  if (pgEl) {
    if (totalPages <= 1) { pgEl.innerHTML = ''; return; }
    const btn = (lbl, p, dis) =>
      `<button onclick="gotoDropsPage(${p})" ${dis?'disabled':''}
        style="background:${dis?'#161b22':'#21262d'};border:1px solid ${dis?'#21262d':'#30363d'};
               color:${dis?'#484f58':'#c9d1d9'};border-radius:6px;padding:3px 9px;
               font-size:.78rem;cursor:${dis?'default':'pointer'}">${lbl}</button>`;
    const isFirst = _dropsRecentPage <= 1, isLast = _dropsRecentPage >= totalPages;
    pgEl.innerHTML =
      btn('‹', _dropsRecentPage - 1, isFirst) +
      `<span style="padding:3px 10px;background:#161b22;border:1px solid #30363d;border-radius:6px;font-size:.78rem;color:#8b949e">
         стр.&nbsp;<strong style="color:#c9d1d9">${_dropsRecentPage}</strong>&nbsp;/&nbsp;${totalPages}
         <span style="color:#484f58;margin:0 6px">·</span>
         <strong style="color:#c9d1d9">${total}</strong> drops
       </span>` +
      btn('›', _dropsRecentPage + 1, isLast);
  }
}

function gotoDropsPage(p) {
  _dropsRecentPage = Math.max(1, p);
  renderDropsRecentTable();
}

// ── DEV-207: ATR Change cards (summary page) ─────────────────────────────
async function loadAtrCards() {
  const wrap = document.getElementById('atrChangeCards');
  if (!wrap) return;
  try {
    const r = await fetch('/api/atr_stats');
    const j = await r.json();
    const atr = j.atr || {};
    const order = ['1h', '4h', '15m'];
    const colors = { '1h': '#f8c400', '4h': '#2ea043', '15m': '#58a6ff' };
    wrap.innerHTML = order.map(tf => {
      const s = atr[tf] || { closed: 0, open: 0, wr: 0, avg_r: 0, total_r: 0, best_r: null };
      const c = colors[tf];
      const wrCls = s.wr >= 50 ? 'green' : s.wr >= 40 ? 'yellow' : 'red';
      const arCls = s.avg_r > 0 ? 'green' : s.avg_r < 0 ? 'red' : '';
      const trCls = s.total_r > 0 ? 'green' : s.total_r < 0 ? 'red' : '';
      const bestStr = s.best_r != null ? (s.best_r >= 0 ? '+' : '') + s.best_r.toFixed(2) + 'R' : '—';
      const arStr = (s.avg_r >= 0 ? '+' : '') + s.avg_r.toFixed(3) + 'R';
      const trStr = (s.total_r >= 0 ? '+' : '') + s.total_r.toFixed(1) + 'R';
      return `<div class="card" style="border-color:${c}55;border-left:3px solid ${c}">
        <div class="label" style="display:flex;align-items:center;gap:5px">
          <span style="color:${c};font-size:1rem">●</span>
          <span style="color:${c};font-weight:700">ATR Change ${tf}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
          <div><div class="label">Сделок</div><div style="font-weight:700;color:#c9d1d9">${s.closed}</div></div>
          <div><div class="label">Открытых</div><div style="font-weight:700;color:#c9d1d9">${s.open}</div></div>
          <div><div class="label">WR</div><div class="${wrCls}" style="font-weight:700">${s.wr.toFixed(1)}%</div></div>
          <div><div class="label">avg R</div><div class="${arCls}" style="font-weight:700">${arStr}</div></div>
          <div><div class="label">Total R</div><div class="${trCls}" style="font-weight:700">${trStr}</div></div>
          <div><div class="label">Best R</div><div class="green" style="font-weight:700">${bestStr}</div></div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('loadAtrCards:', e);
    wrap.innerHTML = '<p class="note red">Ошибка загрузки ATR метрик</p>';
  }
}

// ── DEV-144e: SVG Donut chart ─────────────────────────────────────────────
function drawDonut(data, colors, size) {
  size = size || 130;
  if (!data || !data.length) return '<p class="note">Нет данных</p>';
  const total = data.reduce(function(s, d) { return s + (d.value || 0); }, 0);
  if (!total) return '<p class="note">Нет данных</p>';
  const cx = size/2, cy = size/2, r = size * 0.38, ri = size * 0.24;
  let angle = -Math.PI / 2;
  const slices = data.map(function(d, i) {
    const frac = d.value / total;
    const a1 = angle, a2 = angle + frac * Math.PI * 2;
    angle = a2;
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
    const xi1 = cx + ri*Math.cos(a1), yi1 = cy + ri*Math.sin(a1);
    const xi2 = cx + ri*Math.cos(a2), yi2 = cy + ri*Math.sin(a2);
    const large = frac > 0.5 ? 1 : 0;
    const path = 'M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 +
                 ' L ' + xi2 + ' ' + yi2 + ' A ' + ri + ' ' + ri + ' 0 ' + large + ' 0 ' + xi1 + ' ' + yi1 + ' Z';
    const clr = colors[i % colors.length];
    const pct = Math.round(frac * 100);
    return '<path d="' + path + '" fill="' + clr + '" opacity="0.85"><title>' + d.label + ': ' + d.value + ' (' + pct + '%)</title></path>';
  }).join('');
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" style="width:' + size + 'px;height:' + size + 'px;flex-shrink:0">' + slices + '</svg>';
}

function signalDonut(rows) {
  if (!rows || !rows.length) return '<p class="note">Нет данных</p>';
  const COLORS = ['#58a6ff','#3fb950','#d29922','#b87eff','#f85149','#79c0ff','#e3b341'];
  const data = rows.map(function(r) { return { label: r.signal_type||'?', value: r.total||0 }; });
  const legend = rows.map(function(r, i) {
    const rColor = r.avg_r > 0 ? '#3fb950' : r.avg_r < 0 ? '#f85149' : '#8b949e';
    return '<div class="donut-legend-row">' +
      '<span class="donut-legend-dot" style="background:' + COLORS[i%COLORS.length] + '"></span>' +
      '<span class="donut-legend-lbl">' + (r.signal_type||'?') + '</span>' +
      '<span class="donut-legend-val">' + (r.total||0) + '</span>' +
      '<span style="color:' + rColor + ';font-size:.72rem;min-width:40px;text-align:right">' + (r.avg_r > 0 ? '+' : '') + fmt(r.avg_r, 2) + 'R</span>' +
    '</div>';
  }).join('');
  return '<div class="donut-wrap">' + drawDonut(data, COLORS) + '<div class="donut-legend">' + legend + '</div></div>';
}

function regimeDonut(rows) {
  if (!rows || !rows.length) return '<p class="note">Нет данных</p>';
  const REGIME_COLORS = { TREND_UP:'#3fb950', TREND_DOWN:'#f85149', RANGE:'#d29922', HIGH_VOL:'#b87eff' };
  const REGIME_LABELS = { TREND_UP:'Тренд ↑', TREND_DOWN:'Тренд ↓', RANGE:'Боковик', HIGH_VOL:'Высокая vol' };
  const valid = rows.filter(function(r) { return r.regime && r.regime !== 'unknown'; });
  if (!valid.length) return '<p class="note">Режимы накапливаются (старые сделки до 04.03 имеют NULL)</p>';
  const data   = valid.map(function(r) { return { label: REGIME_LABELS[r.regime]||r.regime, value: r.total||0 }; });
  const colors = valid.map(function(r) { return REGIME_COLORS[r.regime]||'#8b949e'; });
  const legend = valid.map(function(r, i) {
    const wrColor = (r.win_rate||0) >= 50 ? '#3fb950' : '#f85149';
    return '<div class="donut-legend-row">' +
      '<span class="donut-legend-dot" style="background:' + colors[i] + '"></span>' +
      '<span class="donut-legend-lbl">' + (REGIME_LABELS[r.regime]||r.regime) + '</span>' +
      '<span class="donut-legend-val">' + (r.total||0) + '</span>' +
      '<span style="color:' + wrColor + ';font-size:.72rem;min-width:42px;text-align:right">WR ' + (r.win_rate||0) + '%</span>' +
    '</div>';
  }).join('');
  return '<div class="donut-wrap">' + drawDonut(data, colors) + '<div class="donut-legend">' + legend + '</div></div>';
}
