<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Bot Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  /* ── SPA Layout ── */
  .app-layout { display: flex; flex: 1; overflow: hidden; }
  /* ── Sidebar ── */
  .sidebar { width: 210px; min-width: 210px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-logo { padding: 16px 16px 12px; border-bottom: 1px solid #21262d; }
  .sidebar-logo h1 { font-size: .95rem; color: #58a6ff; font-weight: 700; }
  .sidebar-logo .sub { font-size: .68rem; color: #484f58; margin-top: 3px; }
  .nav-group { padding: 10px 0 4px; }
  .nav-label { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; color: #484f58; padding: 0 14px 5px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 14px; cursor: pointer; color: #8b949e; font-size: .85rem; border-left: 3px solid transparent; text-decoration: none; transition: background .15s, color .15s; }
  .nav-item:hover { background: #1c2128; color: #c9d1d9; }
  .nav-item.active { background: #1c2128; color: #58a6ff; border-left-color: #58a6ff; }
  .nav-item .icon { font-size: .95rem; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: #1a2a3a; color: #58a6ff; border-radius: 10px; padding: 1px 7px; font-size: .68rem; font-weight: 700; }
  .sidebar-footer { margin-top: auto; border-top: 1px solid #21262d; padding: 6px 0; }
  /* ── Main area ── */
  .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .topbar-title { font-size: .9rem; color: #c9d1d9; font-weight: 600; }
  #updated { font-size: .75rem; color: #8b949e; }
  .content { flex: 1; overflow-y: auto; padding: 20px 24px; }
  /* ── Pages ── */
  .page { display: none; }
  .page.active { display: block; }
  /* ── Sections ── */
  section { margin-bottom: 28px; }
  h2 { font-size: .85rem; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; border-bottom: 1px solid #21262d; padding-bottom: 6px; }
  /* ── Cards ── */
  .cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 20px; min-width: 140px; flex: 1; }
  .card .label { font-size: .75rem; color: #8b949e; margin-bottom: 6px; }
  .card .value { font-size: 1.5rem; font-weight: 700; }
  /* ── Colors ── */
  .green { color: #3fb950; } .red { color: #f85149; } .blue { color: #58a6ff; } .yellow { color: #d29922; } .purple { color: #b87eff; }
  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; padding: 8px 10px; background: #161b22; color: #8b949e; border-bottom: 1px solid #30363d; }
  td { padding: 7px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2128; }
  /* ── Badges ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .badge-tp  { background: #1a3a1f; color: #3fb950; }
  .badge-sl  { background: #3a1a1a; color: #f85149; }
  .badge-tsl { background: #2a1a3a; color: #b87eff; }
  .badge-exp { background: #2d2a1a; color: #d29922; }
  .badge-open{ background: #1a2a3a; color: #58a6ff; }
  /* ── Misc ── */
  #loader { text-align: center; padding: 60px; color: #8b949e; font-size: 1.1rem; }
  .note { color: #8b949e; font-size: .85rem; font-style: italic; padding: 12px 0; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .filter-bar select, .filter-bar input { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; padding: 4px 8px; font-size: .8rem; cursor: pointer; }
  .filter-bar label { font-size: .8rem; color: #8b949e; }
  .filter-bar button { background: #21262d; border: 1px solid #30363d; color: #8b949e; border-radius: 6px; padding: 4px 10px; font-size: .8rem; cursor: pointer; }
  .filter-bar button:hover { color: #c9d1d9; border-color: #8b949e; }
  /* ── Sortable table headers ── */
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: #c9d1d9; }
  th.sort-asc::after  { content: ' ▲'; font-size: .65rem; color: #58a6ff; }
  th.sort-desc::after { content: ' ▼'; font-size: .65rem; color: #58a6ff; }
  /* ── Risk Exposure panel ── */
  .risk-panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
  .risk-panel .rp-item { display: flex; flex-direction: column; gap: 2px; }
  .risk-panel .rp-label { font-size: .7rem; color: #8b949e; text-transform: uppercase; letter-spacing: .06em; }
  .risk-panel .rp-val { font-size: 1.1rem; font-weight: 700; }
  /* ── Hero grid (144d + D-067 QW3: 4-я карточка Drops) ── */
  .hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .hero-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 18px 22px; display: flex; flex-direction: column; gap: 3px; }
  .hero-card .hc-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: #8b949e; }
  .hero-card .hc-val { font-size: 2rem; font-weight: 700; line-height: 1.15; }
  .hero-card .hc-sub { font-size: .78rem; color: #8b949e; margin-top: 3px; }
  .hero-card .hc-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .hero-card .hc-mini { font-size: .82rem; }
  .hc-bar { height: 5px; background: #21262d; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .hc-bar-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
  @media (max-width: 1180px) { .hero-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 540px)  { .hero-grid { grid-template-columns: 1fr; } }
  /* ── D-067 QW1: Critical Alerts (diagnostic-first) ── */
  .critical-alerts { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
  .alert-banner { padding: 10px 14px; border-radius: 8px; font-size: .88rem; font-weight: 600;
    display: flex; align-items: center; gap: 10px; border-left: 4px solid; }
  .alert-banner.red   { background: #3a1a1a; color: #f85149; border-left-color: #f85149;
    animation: alert-pulse 2s ease-in-out infinite; }
  .alert-banner.amber { background: #3a2a1a; color: #d29922; border-left-color: #d29922; }
  .alert-banner .alert-icon { font-size: 1.1rem; flex-shrink: 0; }
  .alert-banner .alert-detail { font-weight: 400; color: #8b949e; font-size: .78rem; margin-left: auto; }
  @keyframes alert-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,81,73,0); }
    50%      { box-shadow: 0 0 0 4px rgba(248,81,73,0.15); }
  }
  /* ── D-067 QW2: collapsible details/summary стилизация ── */
  details.section-collapsible { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 0 16px; margin-bottom: 12px; }
  details.section-collapsible > summary { cursor: pointer; padding: 14px 0; font-size: 1.1rem;
    font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
  details.section-collapsible > summary::before { content: '▶'; font-size: .7rem; color: #8b949e;
    transition: transform .2s; }
  details.section-collapsible[open] > summary::before { transform: rotate(90deg); }
  details.section-collapsible[open] { padding-bottom: 16px; }
  details.section-collapsible > summary::-webkit-details-marker { display: none; }
  /* ── Donut (144e) ── */
  .donut-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .donut-legend { flex: 1; min-width: 130px; display: flex; flex-direction: column; gap: 5px; }
  .donut-legend-row { display: flex; align-items: center; gap: 6px; font-size: .79rem; }
  .donut-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend-lbl { color: #8b949e; flex: 1; }
  .donut-legend-val { color: #c9d1d9; font-weight: 600; }
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>&#x1F4CA; Oko MTF</h1>
      <div class="sub">Trade Dashboard</div>

        <span id="btc4hBadge" style="display:none;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700;border:1px solid #30363d"></span>
        <span id="exchangeHealthBadge" title="Статус соединения с BingX" style="padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700;border:1px solid #30363d;background:#1a2a1a;color:#3fb950">● BingX</span>
        <span id="scanHealthBadge" title="Статус scan_loop (D-053 detection)" style="padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700;border:1px solid #30363d;background:#1a2a3a;color:#8b949e">? Скан</span>
        <span id="updated">загрузка...</span>
        <a id="modeBadge" href="/trading" style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:700;background:#21262d;color:#8b949e;border:1px solid #30363d;text-decoration:none;cursor:pointer">
          <span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span>
          <span id="modeLabel">SIM</span>
        </a>
      </div>
    </div>
    <div class="content" id="app">
      <div id="loader">&#x23F3; Загрузка данных...</div>
    </div>
  </div>
</div>

<script>
const fmt = (v, dec=2) => v == null ? '—' : (+v).toFixed(dec);
const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + fmt(v, 2) + '%';

// ── Всплывающие подсказки ──────────────────────────────────────────────────
const TOOLTIPS = {
  // signal_type (ТФ входа)
  'confluence':     '[ТФ: 15m] Confluence Scanner — lookback 20 баров: WT в OS/OB + TSL кросс (close) + пивоты + дивергенция. WT_CROSS в зоне OS/OB обязателен.',
  'wt_signal':      '[ТФ: 15m] WaveTrend Signal — кросс wt1/wt2 в зонах OS (<−60) или OB (>+60). Классический разворотный сигнал.',
  'pivot_reversal': '[ТФ: 15m] Pivot Reversal — разворот у уровней пивота (Woodie/Camarilla: S1/S2/R1/R2/PP). Цена отбилась от структурного уровня.',
  'trend_signal':   '[ТФ: 15m] Trend Signal — смена тренда по EMA + ADX. Работает на трендовых рынках, слаб в боковике.',
  'anomaly':        '[ТФ: 15m] Volume Anomaly — аномальный всплеск объёма (>3σ от среднего). Может быть началом движения или ложным выбросом.',
  'mtf_bias':       '[ТФ: 3m→1d] MTF Bias — выравнивание 7 таймфреймов. Нужно: alignment ≥65%, senior gate 2/3, WT кросс на entry TF.',
  'composite':      '[ТФ: 15m] Composite — несколько детекторов одновременно. Высокое confidence, но редкий сигнал.',
  'divergence':     '[ТФ: 15m] Divergence — дивергенция WT: Regular (разворот) или Hidden (продолжение тренда). Price LL + wt HL (бычья).',
  // strategy_name
  'conservative':   'Strategy Pattern: Conservative — повышенный min_strength, меньше сделок, выше качество входа.',
  // confluence factors
  'WT_OS':           '[ТФ: 15m] WT1 < −60 в окне lookback → зона перепроданности. Рынок перепродан, ищем разворот вверх. +20 очков.',
  'WT_OB':           '[ТФ: 15m] WT1 > +60 в окне lookback → зона перекупленности. Рынок перекуплен, ищем разворот вниз. +20 очков.',
  'TSL_CROSS_UP':    '[ТФ: 15m] TSL-линия пробита вверх: close[i] > trenddown[i-1]. Подтверждённая смена тренда DOWN→UP по закрытию свечи. +20 очков.',
  'TSL_CROSS_DOWN':  '[ТФ: 15m] TSL-линия пробита вниз: close[i] < trendup[i-1]. Подтверждённая смена тренда UP→DOWN по закрытию свечи. +20 очков.',
  'WT_CROSS_UP':     '[ТФ: 15m] ⚡ ОБЯЗАТЕЛЕН: wt1 пересёк wt2 снизу вверх в OS зоне (<−60). Без этого сигнал не выдаётся. +15 очков.',
  'WT_CROSS_DOWN':   '[ТФ: 15m] ⚡ ОБЯЗАТЕЛЕН: wt1 пересёк wt2 сверху вниз в OB зоне (>+60). Без этого сигнал не выдаётся. +15 очков.',
  'NEAR_SUPPORT':    '[ТФ: 1D/1W пивоты] Цена (low) в ±0.5% от S1/S2/PP. Структурная поддержка подтверждает вход. +25 очков.',
  'NEAR_RESISTANCE': '[ТФ: 1D/1W пивоты] Цена (high) в ±0.5% от R1/R2/PP. Структурное сопротивление подтверждает SHORT. +25 очков.',
  'WT_DIVERGENCE':   '[ТФ: 15m] Дивергенция WT в окне: price LL + wt1 HL (бычья) или price HH + wt1 LH (медвежья). +20 очков.',
  'ABOVE_PP':        '[ТФ: 1D PP] Текущая цена выше дневного PP → бычий контекст. +15 очков.',
  'BELOW_PP':        '[ТФ: 1D PP] Текущая цена ниже дневного PP → медвежий контекст. +15 очков.',
  'TREND_1H_UP':     '[ТФ: 1h] ★ Бонус +10: тренд на 1h = UP совпадает с LONG. Старший ТФ подтверждает направление.',
  'TREND_1H_DOWN':   '[ТФ: 1h] ★ Бонус +10: тренд на 1h = DOWN совпадает с SHORT. Старший ТФ подтверждает направление.',
  'DUAL_CROSS':      '[ТФ: 15m] ★ Бонус +10: оба кросса (TSL_CROSS + WT_CROSS) на 15m присутствуют одновременно. Двойное подтверждение.',
  // regime
  'TREND_UP':   'Режим рынка [15m]: восходящий тренд — ADX высокий + EMA растут. Лонги предпочтительнее.',
  'TREND_DOWN': 'Режим рынка [15m]: нисходящий тренд — ADX высокий + EMA падают. Шорты предпочтительнее.',
  'RANGE':      'Режим рынка [15m]: боковик — ADX низкий, цена в диапазоне. Confluence получает штраф -15 к score.',
  'HIGH_VOL':   'Режим рынка [15m]: высокая волатильность — ATR аномально широкий. Стопы шире, риск выше.',
  'unknown':    'Режим не определён (старые сделки до добавления market_regime).',
  '—':          'Нет данных / поле не заполнено.',
};
const tip = key => TOOLTIPS[key] ? ` title="${TOOLTIPS[key]}"` : '';
const badge = s => {
  const map = {TP:'badge-tp', SL:'badge-sl', TSL:'badge-tsl', EXPIRED:'badge-exp', OPEN:'badge-open'};
  return `<span class="badge ${map[s]||''}">${s}</span>`;
};
const color = (v, inv=false) => {
  if (v == null) return '';
  const pos = inv ? v < 0 : v > 0;
  return pos ? 'green' : (v === 0 ? '' : 'red');
};

async function updateModeBadge() {
  try {
    const r = await fetch('/api/trading/status');
    if (!r.ok) return;
    const d = await r.json();
    const mode = d.mode || 'SIM';
    const modeColors = { SIM: '#8b949e', VST: '#58a6ff', LIVE: '#3fb950' };
    const modeBg     = { SIM: '#21262d', VST: '#1a2a3a', LIVE: '#1a3a1f' };
    const modeBorder = { SIM: '#30363d', VST: '#1f6feb', LIVE: '#238636' };
    const badge = document.getElementById('modeBadge');
    const label = document.getElementById('modeLabel');
    label.textContent = mode;
    badge.style.color       = modeColors[mode] || '#8b949e';
    badge.style.background  = modeBg[mode]     || '#21262d';
    badge.style.borderColor = modeBorder[mode] || '#30363d';
    if (d.vst_balance != null) {
      badge.title = `Баланс: ${d.vst_balance.toLocaleString('ru')} VST`;
    }
  } catch(_) {}
}

async function loadLiveOrders() {
  try {
    const r = await fetch('/api/live_orders');
    if (!r.ok) return;
    const d = await r.json();
    const section = document.getElementById('liveOrdersSection');
    if (!section) return;
    // Показываем только для VST/LIVE
    if (d.mode === 'SIM' || d.mode === 'SIM_ONLY') {
      section.style.display = 'none';
      return;
    }
    section.style.display = '';
    const countEl = document.getElementById('liveOrdersCount');
    if (countEl) countEl.textContent = `(${d.count})`;
    const body = document.getElementById('liveOrdersBody');
    if (!body) return;
    if (!d.orders || d.orders.length === 0) {
      body.innerHTML = '<p class="note">Открытых позиций на бирже нет.</p>';
      return;
    }
    const rows = d.orders.map(o => {
      const sideColor = o.side === 'LONG' ? '#26a69a' : '#ef5350';
      // DEV-144b: показываем реальные цены SL/TP из simulated_trades
      const fmtPrice = (v) => v != null ? parseFloat(v).toPrecision(5) : null;
      const slPrice = fmtPrice(o.stop_loss);
      const tpPrice = fmtPrice(o.take_profit);
      const slLabel = slPrice
        ? `<span style="color:#ef5350">SL ${slPrice}</span>`
        : (o.sl_order_id ? `<span style="color:#ef5350">SL✓</span>` : '<span style="color:#555">SL—</span>');
      const tpLabel = tpPrice
        ? `<span style="color:#26a69a">TP ${tpPrice}</span>`
        : (o.tp_order_id ? `<span style="color:#26a69a">TP✓</span>` : '<span style="color:#555">TP—</span>');
      const slipLabel = o.slip_pct != null && o.slip_pct !== 0
        ? `<span style="color:#ffeb3b">${o.slip_pct > 0 ? '+' : ''}${o.slip_pct.toFixed(2)}%</span>` : '—';
      const created = o.created_at ? o.created_at.substring(0, 16).replace('T', ' ') : '—';
      return `<tr>
        <td>${o.symbol}</td>
        <td style="color:${sideColor};font-weight:600">${o.side}</td>
        <td>${o.qty != null ? o.qty : '—'}</td>
        <td style="font-size:.8em;color:#8b949e">${o.exchange_order_id || '—'}</td>
        <td>${slLabel}&nbsp;${tpLabel}</td>
        <td>${slipLabel}</td>
        <td style="font-size:.8em;color:#8b949e">${created}</td>
      </tr>`;
    }).join('');
    body.innerHTML = `<table><thead><tr>
      <th>Пара</th><th>Сторона</th><th>Объём</th>
      <th>Order ID</th><th>SL / TP</th><th>Проскальз.</th><th>Время</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  } catch(_) {}
}

async function loadLive() {
  try {
    const r = await fetch('/api/live');
    if (!r.ok) return;

        heroBalVal.textContent = 'SIM';

      } else {
        const bal = d.balance;

        heroBalVal.textContent = fmtUsd(bal.equity);
        heroBalVal.style.color = '#58a6ff';

        if (heroBalSub) {

            '&nbsp;&nbsp;P&L: <span style="color:' + pnlColor + '">' + (pnl >= 0 ? '+' : '') + fmtUsd(pnl) + '</span>' +
            (bal.used_margin > 0 ? '&nbsp;&nbsp;Маржа: <span style="color:#8b949e">' + fmtUsd(bal.used_margin) + '</span>' : '') +
            '<br><span style="color:#484f58;font-size:.68rem">' + d.mode + ' · ' + new Date(d.timestamp).toLocaleTimeString('ru') + '</span>';
        }
      }
    }
    // (exchangeBalanceWidget оставляем для обратной совместимости — скрыт)

    if (balWidget) balWidget.style.display = 'none';

    // ── Реальные позиции BingX на странице Открытые ────────────────────────

    if (!posSection) return;
    if (d.mode === 'SIM') { posSection.style.display = 'none'; return; }
    posSection.style.display = '';
    const posBody = document.getElementById('exchangePosBody');
    const posCount = document.getElementById('exchangePosCount');
    if (!posBody) return;
    if (!d.positions || d.positions.length === 0) {
      if (posCount) posCount.textContent = '(0)';
      posBody.innerHTML = '<p class="note">Позиций на бирже нет.</p>';
      return;
    }
    if (posCount) posCount.textContent = `(${d.positions.length})`;
    const fmtP = v => v != null ? parseFloat(v).toPrecision(5) : null;
    const rows = d.positions.map(p => {
      const sideColor = p.side === 'LONG' ? '#3fb950' : '#f85149';
      const pnl = p.unrealized_pnl || 0;
      const pnlColor = pnl >= 0 ? '#3fb950' : '#f85149';
      const pnlStr = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
      const ep = p.entry_price > 0 ? p.entry_price.toPrecision(5) : '—';
      const mp = p.mark_price > 0 ? p.mark_price.toPrecision(5) : '—';
      const movePct = (p.entry_price > 0 && p.mark_price > 0)
        ? ((p.mark_price - p.entry_price) / p.entry_price * 100 * (p.side === 'SHORT' ? -1 : 1)).toFixed(2)
        : null;
      const moveStr = movePct != null
        ? `<span style="color:${+movePct >= 0 ? '#3fb950' : '#f85149'}">${+movePct >= 0 ? '+' : ''}${movePct}%</span>`
        : '—';
      const sym = (p.symbol || '').replace('-USDT', '/USDT');
      // SL/TP из simulated_trades (если найдены)
      const slStr = fmtP(p.stop_loss)
        ? `<span style="color:#f85149">SL ${fmtP(p.stop_loss)}</span>` : '<span style="color:#555">—</span>';
      const tpStr = fmtP(p.take_profit)
        ? `<span style="color:#3fb950">TP ${fmtP(p.take_profit)}</span>` : '<span style="color:#555">—</span>';
      return `<tr>
        <td>${sym}</td>
        <td style="color:${sideColor};font-weight:600">${p.side}</td>
        <td style="font-size:.85em;color:#8b949e">${ep}</td>
        <td style="font-size:.85em">${mp}&nbsp;${moveStr}</td>
        <td style="color:${pnlColor};font-weight:600">${pnlStr}</td>
        <td style="font-size:.82em">${slStr}&nbsp;${tpStr}</td>
        <td>${p.leverage}×</td>
      </tr>`;
    }).join('');
    posBody.innerHTML = `<table><thead><tr>
      <th>Пара</th><th>Сторона</th><th>Вход</th><th>Текущая</th>
      <th>Unrealized P&amp;L</th><th>SL / TP</th><th>Плечо</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  } catch(_) {}
}

async function loadExchangeHistory(days) {
  const histSection = document.getElementById('exchangeHistSection');
  const histBody    = document.getElementById('exchHistBody');
  const histSummary = document.getElementById('exchHistSummary');
  if (!histSection) return;

  try {
    const r = await fetch('/api/exchange_history?days=' + (days || 7));
    if (!r.ok) return;
    const d = await r.json();

    if (!d.total) {
      histSection.style.display = 'none';
      return;
    }
    histSection.style.display = '';

    const s = d.summary;
    const wrStr  = s.win_rate != null ? `WR ${s.win_rate}%` : '';
    const avgStr = s.avg_r    != null ? `avg R ${s.avg_r > 0 ? '+' : ''}${s.avg_r}` : '';
    histSummary.innerHTML =
      `<span style="color:#3fb950">TP ${s.tp}</span> ` +
      `<span style="color:#b87eff">TSL ${s.tsl}</span> ` +
      `<span style="color:#f85149">SL ${s.sl}</span>` +
      (wrStr  ? ` &nbsp;·&nbsp; ${wrStr}`  : '') +
      (avgStr ? ` &nbsp;·&nbsp; <span style="color:${s.avg_r >= 0 ? '#3fb950' : '#f85149'}">${avgStr}</span>` : '');

    const fmtP = v => v != null ? parseFloat(v).toPrecision(4) : '—';
    const fmtR = v => v != null ? (v > 0 ? '+' : '') + parseFloat(v).toFixed(2) + 'R' : '—';
    const fmtPct = v => v != null ? (v > 0 ? '+' : '') + parseFloat(v).toFixed(2) + '%' : '—';
    const STATUS_COLOR = {TP:'#3fb950', TSL:'#b87eff', SL:'#f85149', EXPIRED:'#d29922'};
    const fmtTime = s => s ? s.replace('T',' ').slice(0,16) : '—';
    const fmtDur = m => {
      if (!m) return '—';
      if (m < 60) return m + 'м';
      return Math.round(m/60) + 'ч ' + (m%60) + 'м';
    };

    const rows = d.trades.map(t => {
      const sc = STATUS_COLOR[t.status] || '#8b949e';
      const rColor = t.R_multiple != null ? (t.R_multiple >= 0 ? '#3fb950' : '#f85149') : '#8b949e';
      const sym = (t.symbol||'').replace(':USDT','');
      return `<tr>
        <td style="font-size:.78em;color:#8b949e">${fmtTime(t.closed_at)}</td>
        <td><a href="/pair/${encodeURIComponent(t.symbol)}" style="color:#58a6ff;text-decoration:none">${sym}</a></td>
        <td style="color:${t.direction==='LONG'?'#3fb950':'#f85149'};font-weight:600">${t.direction}</td>
        <td style="font-size:.78em;color:#8b949e">${t.signal_type||'—'}</td>
        <td style="font-size:.82em">${fmtP(t.entry_price)}</td>
        <td style="font-size:.82em">${fmtP(t.exit_price)}</td>
        <td style="font-size:.8em;color:#8b949e">${fmtP(t.stop_loss)}&nbsp;/&nbsp;${fmtP(t.take_profit)}</td>
        <td style="color:${sc};font-weight:700">${t.status}</td>
        <td style="color:${rColor};font-weight:600">${fmtR(t.R_multiple)}</td>
        <td style="color:${rColor}">${fmtPct(t.profit_pct)}</td>
        <td style="font-size:.78em;color:#8b949e">${fmtDur(t.duration_minutes)}</td>
        <td style="font-size:.75em;color:#484f58">${t.regime||'—'}</td>
      </tr>`;
    }).join('');

    histBody.innerHTML = `<div style="overflow-x:auto"><table style="font-size:.83em">
      <thead><tr>
        <th>Закрыто</th><th>Пара</th><th>Сторона</th><th>Сигнал</th>
        <th>Вход</th><th>Выход</th><th>SL / TP</th>
        <th>Статус</th><th>R</th><th>P&L%</th><th>Время</th><th>Режим</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  } catch(_) {}
}

async function load() {
  try {
    const days = window._swhDays || 14;
    const [r1, r2, r3, r4, r5, r6] = await Promise.all([
      fetch('/api/stats'), fetch('/api/stats/confluence'),
      fetch('/api/stats/breakeven'), fetch('/api/equity'),
      fetch('/api/stats/analytics'),
      fetch('/api/signal_weights/history?days=' + days)
    ]);
    const d  = await r1.json();
    const cf = await r2.json();
    const be = await r3.json();
    const eq = await r4.json();
    const an = await r5.json();
    const swh = await r6.json();
    applyDashboardPayload({
      stats: d,
      confluence: cf,
      breakeven: be,
      equity: eq,
      analytics: an,
      signal_weights: swh
    }, 'REST');
  } catch(e) {
    document.getElementById('updated').textContent = 'Ошибка загрузки: ' + e.message;

}

let _lastLiveRefreshAt = 0;
let _lastExchangeHistoryRefreshAt = 0;
const LIVE_REFRESH_MS = 10000;
const EXCHANGE_HISTORY_REFRESH_MS = 30000;

function captureExternalPanels() {
  const posSection = document.getElementById('exchangePosSection');
  const posBody = document.getElementById('exchangePosBody');
  const posCount = document.getElementById('exchangePosCount');
  const histSection = document.getElementById('exchangeHistSection');
  const histBody = document.getElementById('exchHistBody');
  const histSummary = document.getElementById('exchHistSummary');
  const g = id => document.getElementById(id);
  return {
    posDisplay: posSection ? posSection.style.display : null,
    posBody: posBody ? posBody.innerHTML : null,
    posCount: posCount ? posCount.textContent : null,
    histDisplay: histSection ? histSection.style.display : null,
    histBody: histBody ? histBody.innerHTML : null,
    histSummary: histSummary ? histSummary.innerHTML : null,
    fStatus:  g('fStatus')  ? g('fStatus').value  : null,
    fDir:     g('fDir')     ? g('fDir').value     : null,
    fSig:     g('fSig')     ? g('fSig').value     : null,
    fRegime:  g('fRegime')  ? g('fRegime').value  : null,
    fTf:      g('fTf')      ? g('fTf').value      : null,
    fTrigger: g('fTrigger') ? g('fTrigger').value : null,
    closedPage: _closedPage || 1,
  };
}

function restoreExternalPanels(state) {
  if (!state) return;
  const posSection = document.getElementById('exchangePosSection');
  const posBody = document.getElementById('exchangePosBody');
  const posCount = document.getElementById('exchangePosCount');
  const histSection = document.getElementById('exchangeHistSection');
  const histBody = document.getElementById('exchHistBody');
  const histSummary = document.getElementById('exchHistSummary');
  if (posSection && state.posDisplay !== null) posSection.style.display = state.posDisplay;
  if (posBody && state.posBody !== null) posBody.innerHTML = state.posBody;
  if (posCount && state.posCount !== null) posCount.textContent = state.posCount;
  if (histSection && state.histDisplay !== null) histSection.style.display = state.histDisplay;
  if (histBody && state.histBody !== null) histBody.innerHTML = state.histBody;
  const sv = (id, val) => { if (val === null) return; const el = document.getElementById(id); if (el) el.value = val; };
  sv('fStatus',  state.fStatus);
  sv('fDir',     state.fDir);
  sv('fSig',     state.fSig);
  sv('fRegime',  state.fRegime);
  sv('fTf',      state.fTf);
  sv('fTrigger', state.fTrigger);
  if (state.closedPage) _closedPage = state.closedPage;
  if (histSummary && state.histSummary !== null) histSummary.innerHTML = state.histSummary;
}

function refreshExternalPanelsIfDue(force) {
  const now = Date.now();
  if (force || now - _lastLiveRefreshAt > LIVE_REFRESH_MS) {
    _lastLiveRefreshAt = now;
    loadLive();
  }
  if (force || now - _lastExchangeHistoryRefreshAt > EXCHANGE_HISTORY_REFRESH_MS) {
    _lastExchangeHistoryRefreshAt = now;
    loadExchangeHistory(selectedExchangeHistoryDays());
  }
}

// ── Флаг первого рендера — DOM создаётся один раз ─────────────────────────
let _appBootstrapped = false;

function applyDashboardPayload(payload, source) {
  if (!payload || !payload.stats) return;
  if (!_appBootstrapped) {
    // Первый рендер: полная замена DOM (создаём скелет страниц)
    _appBootstrapped = true;
    const externalState = captureExternalPanels();
    render(
      payload.stats,
      payload.confluence,
      payload.breakeven,
      payload.equity,
      payload.analytics,
      payload.signal_weights
    );
    restoreExternalPanels(externalState);
  } else {
    // Последующие обновления: патчим только данные, не трогаем DOM страниц
    patchData(payload);
  }
  document.getElementById('updated').textContent =
    (source || 'SSE') + ': ' + new Date().toLocaleTimeString('ru');
  updateModeBadge();
  refreshExternalPanelsIfDue(false);
}

// ── Точечное обновление данных без пересоздания DOM ───────────────────────
// Обновляет только изменяемые секции: Сводка, Открытые, Аналитика.
// Страницы История и Drops НЕ трогаются при SSE (у них собственный цикл загрузки).
function patchData(payload) {
  const d   = payload.stats;
  const cf  = payload.confluence;
  const be  = payload.breakeven;
  const eq  = payload.equity;
  const an  = payload.analytics;
  const swh = payload.signal_weights;

  if (!d) return;

  // ── Обновляем метаданные риска (используются в карточках) ───────────────
  _riskMeta = {
    risk_exposure_pct:  d.risk_exposure_pct  ?? null,
    risk_exposure_usdt: d.risk_exposure_usdt ?? null,
    deposit_usdt:       d.deposit_usdt       ?? null,
    open_pnl_r:         d.open_pnl_r         ?? null,
  };

  // ── Страница Сводка: обновляем внутренний контейнер ─────────────────────
  const summaryContent = document.getElementById('page-summary-content');
  if (summaryContent) {
    const _pDep  = document.getElementById('projDeposit')?.value;
    const _pRisk = document.getElementById('projRisk')?.value;
    const _pMode = document.getElementById('projMode')?.value;
    const _pHeroHtml = document.getElementById('heroBalance')?.innerHTML;
    const _pAtrHtml  = document.getElementById('atrChangeCards')?.innerHTML;
    summaryContent.innerHTML = buildSummaryContent(d, eq);
    const sv2 = (id, val) => { if (!val) return; const el = document.getElementById(id); if (el) el.value = val; };
    sv2('projDeposit', _pDep); sv2('projRisk', _pRisk); sv2('projMode', _pMode);
    if (_pHeroHtml) { const el = document.getElementById('heroBalance'); if (el) el.innerHTML = _pHeroHtml; }
    if (_pAtrHtml)  { const el = document.getElementById('atrChangeCards'); if (el) el.innerHTML = _pAtrHtml; }
    setTimeout(() => {
      if (window.updateProj) window.updateProj();
      if (window.updateEquity) window.updateEquity();
      if (window.loadDropsCard) window.loadDropsCard();   // D-067 QW3
    }, 0);
  }

  // ── Страница Открытые: обновляем только tbody (уже работает) ────────────
  const openTbl = document.getElementById('openTblBody');
  if (openTbl && d.open_trades) {
    _openRows = d.open_trades;
    openTbl.innerHTML = renderOpenRows(d.open_trades);
  }
  // Счётчик открытых в sidebar
  const oc = document.getElementById('navOpenCount');
  if (oc) oc.textContent = (d.open_trades || []).length;

  // ── Страница Аналитика: обновляем внутренний контейнер ──────────────────
  const analyticsContent = document.getElementById('page-analytics-content');
  if (analyticsContent) {
    analyticsContent.innerHTML = buildAnalyticsContent(d, cf, be, an, swh);
  }

  // ── Топбар: BTC 4h badge + Exchange Health ───────────────────────────────
  _patchTopbarBadges(d);
}

let _dashboardEvents = null;
let _dashboardFallbackTimer = null;
let _dashboardWatchdogTimer = null;
let _dashboardLastEventAt = 0;

function stopDashboardFallback() {
  if (_dashboardFallbackTimer) {
    clearInterval(_dashboardFallbackTimer);
    _dashboardFallbackTimer = null;
  }
}

function startDashboardFallback() {
  if (_dashboardFallbackTimer) return;
  _dashboardFallbackTimer = setInterval(load, 5000);
}

function startDashboardWatchdog() {
  if (_dashboardWatchdogTimer) clearInterval(_dashboardWatchdogTimer);
  _dashboardLastEventAt = Date.now();
  _dashboardWatchdogTimer = setInterval(() => {
    if (Date.now() - _dashboardLastEventAt > 12000) {
      startDashboardFallback();
    }
  }, 3000);
}

function startDashboardSse() {
  if (_dashboardEvents) {
    _dashboardEvents.close();
    _dashboardEvents = null;
  }
  if (!window.EventSource) {
    startDashboardFallback();
    return;
  }
  const days = window._swhDays || 14;
  const es = new EventSource('/api/events?dashboard=1&days=' + encodeURIComponent(days));
  _dashboardEvents = es;
  startDashboardWatchdog();
  es.addEventListener('dashboard', e => {
    try {
      _dashboardLastEventAt = Date.now();
      stopDashboardFallback();
      applyDashboardPayload(JSON.parse(e.data), 'SSE');
    } catch (err) {
      document.getElementById('updated').textContent = 'SSE parse error: ' + err.message;
    }
  });
  // ── SSE event: trade_closed — добавляем строку в начало таблицы истории ──
  es.addEventListener('trade_closed', e => {
    try {
      const trade = JSON.parse(e.data);
      prependClosedTrade(trade);
    } catch (err) {
      console.warn('trade_closed parse error:', err);
    }
  });
  es.onopen = () => {
    document.getElementById('updated').textContent = 'SSE connected...';
  };
  es.onerror = () => {
    document.getElementById('updated').textContent = 'SSE reconnecting...';
    startDashboardFallback();
  };
}

// ── Equity Curve ─────────────────────────────────────────────────────────────
let _eqTrades = [];

function calcEquity(trades, openTrades, deposit, riskPct, leverage, takerFeePct, maxPositions) {
  leverage    = leverage    || 1;
  takerFeePct = takerFeePct != null ? takerFeePct : 0.05; // BingX taker fee per side, %
  maxPositions = maxPositions || 0; // 0 = unlimited

  // --- Фильтр по макс. позициям (симуляция реального кол-ва открытых сделок) ---
  let activeTrades = trades;
  if (maxPositions > 0) {
    activeTrades = [];
    const open = []; // {created_at, closed_at}
    // Сортируем по времени открытия
    const sorted = [...trades].sort((a, b) =>
      (a.created_at || a.closed_at || '').localeCompare(b.created_at || b.closed_at || ''));
    for (const t of sorted) {
      const now = t.created_at || t.closed_at;
      // Убираем уже закрытые
      const filtered = open.filter(o => o.closed_at && now && o.closed_at > now);
      open.length = 0; open.push(...filtered);
      if (open.length < maxPositions) {
        open.push({ created_at: t.created_at, closed_at: t.closed_at });
        activeTrades.push(t);
      }
    }
    // Возвращаем порядок по closed_at (как исходный)
    activeTrades.sort((a, b) =>
      (a.closed_at || '').localeCompare(b.closed_at || ''));
  }

  let balance = deposit;
  const points = [{ t: null, b: deposit, r: 0 }];
  let peak = deposit;
  let maxDD = 0, bestPnl = 0, worstPnl = 0;
  const feeRate = takerFeePct / 100; // per side

  for (const t of activeTrades) {
    const r = t.R_multiple || 0;

    // Комиссия: taker fee × 2 (вход + выход) × нотионал
    // Нотионал = balance × riskPct% × leverage / sl_dist_pct
    // sl_dist_pct из реальных данных сделки, fallback 2%
    let sl_dist_pct = 0.02;
    if (t.entry_price && t.stop_loss && t.entry_price > 0) {
      const d = Math.abs(t.entry_price - t.stop_loss) / t.entry_price;
      if (d > 0.0001) sl_dist_pct = d;
    }
    const notional  = balance * (riskPct / 100) * leverage / sl_dist_pct;
    const commission = notional * feeRate * 2;

    // P&L: riskPct% от баланса × R (симметрично для + и -)
    // Плечо уже учтено в размере позиции через sl_dist_pct — не умножаем дважды
    const pnl = balance * (riskPct / 100) * r;
    balance += pnl - commission;
    if (balance < 0) balance = 0;

    if (balance > peak) peak = balance;
    const dd = peak > 0 ? (peak - balance) / peak * 100 : 0;
    if (dd > maxDD) maxDD = dd;
    const netPnl = pnl - commission;
    if (netPnl > bestPnl)  bestPnl  = netPnl;
    if (netPnl < worstPnl) worstPnl = netPnl;
    points.push({ t: t.closed_at, b: balance, r, status: t.status, sym: t.symbol });
  }

  // Добавить открытые сделки (unrealized)
  for (const t of (openTrades || [])) {
    if (t.unrealized_r == null) continue;
    const pnl = balance * (riskPct / 100) * t.unrealized_r;
    balance += pnl;
    points.push({ t: t.created_at, b: balance, r: t.unrealized_r, status: 'OPEN', sym: t.symbol, open: true });
  }

  return { points, balance, maxDD: Math.round(maxDD * 10) / 10, bestPnl, worstPnl };
}

function drawEquitySVG(points, startDeposit) {
  if (points.length < 2) return '<p class="note">Недостаточно данных для графика</p>';
  const W = 900, H = 230, PAD = { t: 16, r: 16, b: 48, l: 64 };
  const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;

  const vals = points.map(p => p.b);
  const minV = Math.min(...vals) * 0.998;
  const maxV = Math.max(...vals) * 1.002;
  const range = maxV - minV || 1;

  const px = (i) => PAD.l + (i / (points.length - 1)) * cW;
  const py = (v) => PAD.t + cH - ((v - minV) / range) * cH;

  const pts = points.map((p, i) => `${px(i)},${py(p.b)}`).join(' ');
  const depClamped = Math.max(minV, Math.min(maxV, startDeposit));
  const depY = py(depClamped);
  const areaPath = `M ${px(0)},${depY} ` +
    points.map((p, i) => `L ${px(i)},${py(p.b)}`).join(' ') +
    ` L ${px(points.length - 1)},${depY} Z`;

  // Y axis labels
  const yLabels = [minV, minV + range*0.25, minV + range*0.5, minV + range*0.75, maxV].map(v => {
    const label = v >= 1000 ? '$' + Math.round(v/10)/100 + 'k' : '$' + Math.round(v);
    return `<text x="${PAD.l-6}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="#484f58">${label}</text>`;
  }).join('');

  // X axis date labels — ~6 равномерных меток
  const datedPts = points.map((p, i) => ({...p, i})).filter(p => p.t);
  const xLabels = [];
  if (datedPts.length >= 2) {
    const step = Math.max(1, Math.floor(datedPts.length / 6));
    const picks = [];
    for (let k = 0; k < datedPts.length; k += step) picks.push(datedPts[k]);
    const last = datedPts[datedPts.length - 1];
    if (picks[picks.length-1] !== last) picks.push(last);
    for (const p of picks) {
      const d = new Date(p.t);
      const mo = (d.getMonth()+1).toString().padStart(2,'0');
      const dy = d.getDate().toString().padStart(2,'0');
      const hr = d.getHours().toString().padStart(2,'0');
      const label = mo + '/' + dy;
      const x = px(p.i);
      xLabels.push(`<line x1="${x}" y1="${PAD.t+cH}" x2="${x}" y2="${PAD.t+cH+5}" stroke="#30363d" stroke-width="1"/>`);
      xLabels.push(`<text x="${x}" y="${PAD.t+cH+16}" text-anchor="middle" font-size="10" fill="#484f58">${label}</text>`);
    }
  }

  const baseLine = `<line x1="${PAD.l}" y1="${depY}" x2="${PAD.l+cW}" y2="${depY}" stroke="#30363d" stroke-dasharray="4,3" stroke-width="1"/>`;
  const xAxisLine = `<line x1="${PAD.l}" y1="${PAD.t+cH}" x2="${PAD.l+cW}" y2="${PAD.t+cH}" stroke="#21262d" stroke-width="1"/>`;

  const openDots = points.filter(p => p.open).map(p => {
    const idx = points.indexOf(p);
    return `<circle cx="${px(idx)}" cy="${py(p.b)}" r="3" fill="#58a6ff" opacity="0.7"/>`;
  }).join('');

  const lastBalance = points[points.length-1].b;
  const isUp = lastBalance >= startDeposit;

  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
    <defs>
      <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${isUp ? '#3fb950' : '#f85149'}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${isUp ? '#3fb950' : '#f85149'}" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    ${xAxisLine}${baseLine}${yLabels}${xLabels.join('')}
    <path d="${areaPath}" fill="url(#eqGrad)"/>
    <polyline points="${pts}" fill="none" stroke="${isUp ? '#3fb950' : '#f85149'}" stroke-width="1.5"/>
    ${openDots}
    <circle cx="${px(points.length-1)}" cy="${py(lastBalance)}" r="4" fill="${isUp ? '#3fb950' : '#f85149'}"/>
  </svg>`;
}

// DEV-177: SVG multi-line chart — траектория адаптивных весов
function drawWeightsTrajectorySVG(swh) {
  if (!swh || !swh.points || swh.points.length < 2) {
    return '<p class="note">Недостаточно данных — снэпшоты копятся раз в час.</p>';
  }
  const W = 900, H = 260, PAD = { t: 14, r: 16, b: 46, l: 56 };
  const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;
  const types = swh.signal_types || [];
  const points = swh.points;
  const baseW = swh.base_weights || {};

  // Палитра — цвета уже используемые в теме
  const palette = ['#3fb950', '#f85149', '#58a6ff', '#d29922', '#a371f7', '#ff7b72', '#56d4dd'];
  const colorOf = (i) => palette[i % palette.length];

  // Диапазон Y — общий по всем типам, base_weights включаем чтобы пунктиры были видны
  let vals = [];
  for (const p of points) for (const st of types) {
    const v = p.weights[st];
    if (v !== null && v !== undefined) vals.push(v);
  }
  for (const st of types) if (baseW[st] !== undefined) vals.push(baseW[st]);
  if (!vals.length) return '<p class="note">Нет данных по весам.</p>';
  const minV = Math.min(...vals, 0) * 0.92;
  const maxV = Math.max(...vals) * 1.08;
  const range = maxV - minV || 1;

  const px = (i) => PAD.l + (i / (points.length - 1)) * cW;
  const py = (v) => PAD.t + cH - ((v - minV) / range) * cH;

  // Y labels
  const yLabels = [minV, minV + range*0.25, minV + range*0.5, minV + range*0.75, maxV].map(v =>
    `<text x="${PAD.l-6}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="#484f58">${v.toFixed(3)}</text>`
  ).join('');

  // X labels (6 равномерных)
  const xLabels = [];
  const step = Math.max(1, Math.floor(points.length / 6));
  for (let k = 0; k < points.length; k += step) {
    const p = points[k];
    const d = new Date(p.t);
    const mo = (d.getMonth()+1).toString().padStart(2,'0');
    const dy = d.getDate().toString().padStart(2,'0');
    const x = px(k);
    xLabels.push(`<line x1="${x}" y1="${PAD.t+cH}" x2="${x}" y2="${PAD.t+cH+4}" stroke="#30363d" stroke-width="1"/>`);
    xLabels.push(`<text x="${x}" y="${PAD.t+cH+16}" text-anchor="middle" font-size="10" fill="#484f58">${mo}/${dy}</text>`);
  }

  // Линии по типам + пунктиры базовых весов
  const lines = types.map((st, i) => {
    const color = colorOf(i);
    const poly = points
      .map((p, idx) => {
        const v = p.weights[st];
        return (v !== null && v !== undefined) ? `${px(idx)},${py(v)}` : null;
      })
      .filter(s => s !== null).join(' ');
    const base = baseW[st];
    const baseLine = (base !== undefined)
      ? `<line x1="${PAD.l}" y1="${py(base)}" x2="${PAD.l+cW}" y2="${py(base)}" stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity="0.35"/>`
      : '';
    const lastIdx = points.length - 1;
    const lastV = points[lastIdx].weights[st];
    const lastDot = (lastV !== null && lastV !== undefined)
      ? `<circle cx="${px(lastIdx)}" cy="${py(lastV)}" r="3" fill="${color}"/>`
      : '';
    return baseLine + `<polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.6"/>` + lastDot;
  }).join('');

  // Легенда
  const legend = types.map((st, i) => {
    const color = colorOf(i);
    const lastIdx = points.length - 1;
    const lastV = points[lastIdx].weights[st];
    const base = baseW[st];
    const delta = (lastV !== undefined && lastV !== null && base !== undefined)
      ? ` (${lastV > base ? '+' : ''}${((lastV - base) / base * 100).toFixed(0)}%)`
      : '';
    const vTxt = (lastV !== null && lastV !== undefined) ? lastV.toFixed(3) : '—';
    return `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:.82rem">
      <span style="width:14px;height:3px;background:${color};display:inline-block"></span>
      <span style="color:#c9d1d9">${st}</span>
      <span style="color:#8b949e">${vTxt}${delta}</span>
    </span>`;
  }).join('');

  const xAxisLine = `<line x1="${PAD.l}" y1="${PAD.t+cH}" x2="${PAD.l+cW}" y2="${PAD.t+cH}" stroke="#21262d" stroke-width="1"/>`;
  return `
    <div style="margin-bottom:8px">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
      ${xAxisLine}${yLabels}${xLabels.join('')}${lines}
    </svg>
    <p class="note" style="margin-top:6px">Пунктир — базовый вес из config. Линия — адаптивный вес (EMA). Снэпшот раз в час. Период: ${swh.days}д.</p>
  `;
}

window.updateEquity = function() {
  const depEl    = document.getElementById('eqDeposit');
  const riskEl   = document.getElementById('eqRisk');
  const levEl    = document.getElementById('eqLeverage');
  const feeEl    = document.getElementById('eqFee');
  const maxPosEl = document.getElementById('eqMaxPos');
  const startEl  = document.getElementById('eqStartDate');
  if (!depEl || !riskEl) return;
  const deposit    = parseFloat(depEl.value)    || 1000;
  const riskPct    = parseFloat(riskEl.value)   || 1;
  const leverage   = parseFloat(levEl?.value    || '1')    || 1;
  const takerFee   = parseFloat(feeEl?.value    != null ? feeEl.value : '0.05');
  const maxPos     = parseInt(maxPosEl?.value   || '0', 10) || 0;
  const startDate  = startEl?.value || '';
  localStorage.setItem('eqDeposit',  deposit);
  localStorage.setItem('eqRisk',     riskPct);
  localStorage.setItem('eqLeverage', leverage);
  localStorage.setItem('eqFee',      takerFee);
  localStorage.setItem('eqMaxPos',   maxPos);
  localStorage.setItem('eqStartDate', startDate);

  // Фильтр по дате начала депозита
  let baseTrades = window._eqTrades || [];
  if (startDate) {
    const cutoffMs = new Date(startDate).getTime();
    baseTrades = baseTrades.filter(t => t.closed_at && new Date(t.closed_at).getTime() >= cutoffMs);
  }

  // Полная кривая с комиссией и лимитом позиций
  const { points: allPts } = calcEquity(baseTrades, window._eqOpenTrades, deposit, riskPct, leverage, takerFee, maxPos);

  // Срезаем по зуму
  const cutoff = _eqCutoff(window._eqZoom || 'ALL');
  let visPts = allPts;
  let startDep = deposit;
  if (cutoff && allPts.length > 1) {
    let startIdx = 0;
    for (let i = 0; i < allPts.length - 1; i++) {
      if (!allPts[i].t || new Date(allPts[i].t) < cutoff) startIdx = i;
      else break;
    }
    startDep = allPts[startIdx].b;
    visPts = allPts.slice(startIdx);
  }

  // Метрики по видимому диапазону
  const balance = visPts.length ? visPts[visPts.length-1].b : startDep;
  let peak = startDep, maxDD = 0, bestPnl = 0, worstPnl = 0;
  for (let i = 0; i < visPts.length; i++) {
    if (visPts[i].b > peak) peak = visPts[i].b;
    const dd = peak > 0 ? (peak - visPts[i].b) / peak * 100 : 0;
    if (dd > maxDD) maxDD = dd;
    if (i > 0) {
      const pnl = visPts[i].b - visPts[i-1].b;
      if (pnl > bestPnl) bestPnl = pnl;
      if (pnl < worstPnl) worstPnl = pnl;
    }
  }
  maxDD = Math.round(maxDD * 10) / 10;

  const pnlTotal = balance - startDep;
  const pnlPct   = startDep > 0 ? pnlTotal / startDep * 100 : 0;
  const isUp     = pnlTotal >= 0;

  const metrics = [
    { label: 'Текущий баланс',  val: '$' + Math.round(balance * 100) / 100, cls: isUp ? 'green' : 'red' },
    { label: 'P&L',             val: (isUp ? '+' : '') + '$' + Math.round(pnlTotal*100)/100 + ' (' + (isUp?'+':'') + Math.round(pnlPct*10)/10 + '%)', cls: isUp ? 'green' : 'red' },
    { label: 'Макс. просадка',  val: '-' + maxDD + '%', cls: maxDD > 20 ? 'red' : maxDD > 10 ? 'yellow' : 'green' },
    { label: 'Лучшая сделка',   val: '+$' + Math.round(bestPnl*100)/100, cls: 'green' },
    { label: 'Худшая сделка',   val: '-$' + Math.round(Math.abs(worstPnl)*100)/100, cls: 'red' },
  ].map(m => `
    <div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 16px;min-width:120px">
      <div class="label">${m.label}</div>
      <div style="font-size:1.1rem;font-weight:700;margin-top:4px" class="${m.cls}">${m.val}</div>
    </div>`).join('');

  const metricsEl = document.getElementById('eqMetrics');
  if (metricsEl) metricsEl.innerHTML = metrics;
  const chartEl = document.getElementById('eqChart');
  if (chartEl) chartEl.innerHTML = drawEquitySVG(visPts, startDep);

  // Подсветка активной кнопки зума
  ['1D','3D','1W','1M','3M','ALL'].forEach(z => {
    const btn = document.getElementById('eqZ' + z);
    if (!btn) return;
    const active = z === (window._eqZoom || 'ALL');
    btn.style.background  = active ? '#21262d' : '#0d1117';
    btn.style.color       = active ? '#c9d1d9' : '#8b949e';
    btn.style.borderColor = active ? '#58a6ff' : '#30363d';
  });
};

function sessionHeatmap(rows) {

  const order = ['LONDON', 'NY', 'ASIA', '?'];
  const sorted = order.map(s => rows.find(r => r.session === s)).filter(Boolean);
  const remaining = rows.filter(r => !order.includes(r.session));

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">

          <div><div class="label">avg R</div><div class="${color(avr)}" style="font-weight:700">${avr>0?'+':''}${avr}</div></div>

// ── DEV-116: R-Distribution Histogram ────────────────────────────────────────
function rDistributionChart(data) {
  if (!data || !data.buckets || !data.buckets.length) return '<p class="note">Нет данных</p>';
  const { buckets, counts, total } = data;
  const maxC = Math.max(...counts, 1);
  const W = 860, H = 160, PAD = {l:40, r:10, t:10, b:40};
  const cW = W - PAD.l - PAD.r;
  const cH = H - PAD.t - PAD.b;
  const bW = Math.floor(cW / buckets.length) - 1;

  const bars = buckets.map((lbl, i) => {
    const c = counts[i];
    const bH = maxC > 0 ? Math.round(c / maxC * cH) : 0;
    const x = PAD.l + i * (cW / buckets.length);
    const y = PAD.t + cH - bH;
    // зелёный для положительных бакетов, красный для отрицательных
    const isPos = lbl.startsWith('0') || lbl.startsWith('>') || /^[1-9]/.test(lbl);
    const fill = isPos ? '#2ea04388' : '#f8514988';
    const pct = total > 0 ? (c/total*100).toFixed(0) : 0;
    return `<rect x="${x}" y="${y}" width="${bW}" height="${bH}" fill="${fill}" rx="2">
      <title>${lbl}: ${c} сделок (${pct}%)</title></rect>
    ${c > 0 ? `<text x="${x+bW/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="#8b949e">${c}</text>` : ''}`;
  }).join('');

  const xLabels = buckets.map((lbl, i) => {
    if (i % 2 !== 0) return '';
    const x = PAD.l + i * (cW / buckets.length) + bW/2;
    return `<text x="${x}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#484f58">${lbl}</text>`;
  }).join('');

  const zero_x = PAD.l + 5 * (cW / buckets.length); // бакет "0..0.5" — граница 0
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">
    <line x1="${zero_x}" y1="${PAD.t}" x2="${zero_x}" y2="${PAD.t+cH}" stroke="#30363d" stroke-dasharray="4"/>
    ${bars}${xLabels}
    <text x="${PAD.l-4}" y="${PAD.t+cH/2}" text-anchor="middle" font-size="10" fill="#484f58" transform="rotate(-90,${PAD.l-12},${PAD.t+cH/2})">Кол-во</text>
  </svg>`;
}

// ── DEV-116 + D-075 (26.05): MFE vs Exit R Scatter — toggle SL/EXPIRED ──────
// State persist в localStorage. SL скрыт по умолчанию (75% точек = шум линии у -1R).
function _mfeHiddenSet() {
  try {
    const raw = localStorage.getItem('mfe_hidden_statuses');
    return new Set(raw ? JSON.parse(raw) : ['SL']);   // default: SL hidden
  } catch (e) { return new Set(['SL']); }
}
function _mfeSetHidden(set) {
  try { localStorage.setItem('mfe_hidden_statuses', JSON.stringify([...set])); } catch (e) {}
}
window.toggleMfeStatus = function(status) {
  const hidden = _mfeHiddenSet();
  hidden.has(status) ? hidden.delete(status) : hidden.add(status);
  _mfeSetHidden(hidden);
  // Re-render через global window.lastAnalyticsData (set в renderSummary)
  const container = document.getElementById('mfe_scatter_container');
  if (container && window.lastAnalyticsData) {
    container.innerHTML = mfeScatter(window.lastAnalyticsData.mfe_scatter);
  }
};

function mfeScatter(rows) {
  if (!rows || !rows.length) return '<p class="note">Нет данных MFE</p>';

  const hidden = _mfeHiddenSet();
  const visibleRows = rows.filter(r => !hidden.has(r.status));

  const W = 500, H = 300, PAD = {l:48, r:16, t:16, b:40};
  const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;

  // Auto-scale по visible rows (без SL шкала будет лучше)
  const baseRows = visibleRows.length ? visibleRows : rows;
  const mfeVals = baseRows.map(r => r.mfe_r);
  const exitVals = baseRows.map(r => r.exit_r);
  const maxX = Math.min(Math.max(...mfeVals, 4), 12);
  const minY = Math.max(Math.min(...exitVals, -1), -2);
  const maxY = Math.min(Math.max(...exitVals, 2), 8);

  const px = v => PAD.l + Math.min(v / maxX, 1) * cW;
  const py = v => PAD.t + cH - ((v - minY) / (maxY - minY)) * cH;

  const COLORS = {TP:'#3fb950', TSL:'#b87eff', SL:'#f85149', EXPIRED:'#d29922'};
  const counts = {TP:0, TSL:0, SL:0, EXPIRED:0};
  rows.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });

  const dots = visibleRows.map(r => {
    const x = px(r.mfe_r), y = py(r.exit_r);
    if (x < PAD.l || x > W-PAD.r || y < PAD.t || y > H-PAD.b) return '';
    const fill = COLORS[r.status] || '#8b949e';
    return `<circle cx="${x}" cy="${y}" r="3" fill="${fill}" opacity="0.6">
      <title>${r.signal_type} ${r.status} | exit=${r.exit_r}R | MFE=${r.mfe_r}R</title></circle>`;
  }).join('');

  // Оси
  const yLabels = [minY, 0, Math.round(maxY/2), maxY].map(v =>
    `<text x="${PAD.l-4}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="#484f58">${v>0?'+':''}${v}R</text>`
  ).join('');
  const xLabels = [0,2,4,6,8,10,12].filter(v=>v<=maxX).map(v =>
    `<text x="${px(v)}" y="${H-4}" text-anchor="middle" font-size="10" fill="#484f58">${v}R</text>`
  ).join('');

  // Interactive legend: клик скрывает/показывает статус. Скрытые — opacity 0.3
  const legend = Object.entries(COLORS).map(([s,c]) => {
    const isHidden = hidden.has(s);
    const opacity = isHidden ? '0.3' : '1';
    const deco = isHidden ? 'text-decoration:line-through;' : '';
    return `<span onclick="toggleMfeStatus('${s}')" style="margin-right:10px;cursor:pointer;opacity:${opacity};${deco}user-select:none" title="${isHidden ? 'Показать' : 'Скрыть'} ${s}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:3px"></span>${s} <span style="color:#6e7681">(${counts[s]||0})</span></span>`;
  }).join('');

  return `
  <div style="font-size:.72rem;color:#8b949e;margin-bottom:6px">${legend} <span style="margin-left:8px;color:#484f58">• клик для toggle • показано ${visibleRows.length}/${rows.length}</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">
    <line x1="${px(0)}" y1="${PAD.t}" x2="${px(0)}" y2="${PAD.t+cH}" stroke="#30363d"/>
    <line x1="${PAD.l}" y1="${py(0)}" x2="${PAD.l+cW}" y2="${py(0)}" stroke="#30363d"/>
    <line x1="${PAD.l}" y1="${py(0)}" x2="${px(maxX)}" y2="${py(maxX)}" stroke="#58a6ff22" stroke-dasharray="5"/>
    ${dots}${yLabels}${xLabels}
    <text x="${PAD.l+cW/2}" y="${H-1}" text-anchor="middle" font-size="10" fill="#484f58">MFE (max достигнутый R)</text>
    <text x="12" y="${PAD.t+cH/2}" text-anchor="middle" font-size="10" fill="#484f58" transform="rotate(-90,12,${PAD.t+cH/2})">Exit R</text>
  </svg>`;
}

// ── Строит HTML для секции Сводки (для первого render и patchData) ─────────
// D-067 QW1: Critical Alerts — баннеры при деградации (BingX/scan/pairs/latency).
// Логика: проверяет ключевые health-маркеры в d.exchange_health, d.status.scan_health,
// d.status.monitored_pairs, d.exchange_latency_ms. Возвращает HTML секции или ''.
function criticalAlerts(d) {
  const alerts = [];
  const eh = d.exchange_health || 'HEALTHY';
  const lat = d.exchange_latency_ms;
  const st = d.status || {};
  const sh = st.scan_health || 'unknown';
  const mp = st.monitored_pairs ?? 0;
  // D-076 (26.05): ссылка на cryptohopper external status — отличает наши баги от проблем биржи
  const bingxStatusLink = `<a href="https://status.cryptohopper.com/exchange.html?detail=bingx" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;margin-left:6px">проверить статус BingX</a>`;
  if (eh === 'DOWN') {
    alerts.push(`<div class="alert-banner red"><span class="alert-icon">⛔</span>
      BingX недоступен ${bingxStatusLink} <span class="alert-detail">бот не открывает live ордера</span></div>`);
  } else if (eh === 'DEGRADED' || (lat != null && lat > 3000)) {
    alerts.push(`<div class="alert-banner amber"><span class="alert-icon">⚠</span>
      BingX лагает ${bingxStatusLink} <span class="alert-detail">latency=${lat ?? '?'}ms</span></div>`);
  }
  if (sh === 'DEAD') {
    alerts.push(`<div class="alert-banner red"><span class="alert-icon">💀</span>
      Scan loop мёртв <span class="alert-detail">подозрение на cascade D-053 — рестарт нужен</span></div>`);
  } else if (sh === 'delayed') {
    alerts.push(`<div class="alert-banner amber"><span class="alert-icon">⏳</span>
      Scan loop задержка <span class="alert-detail">age &gt; 6 мин</span></div>`);
  }
  if (mp === 0 && st.is_monitoring) {
    alerts.push(`<div class="alert-banner amber"><span class="alert-icon">📵</span>
      monitored_pairs = 0 <span class="alert-detail">бот стартует или recovery</span></div>`);
  }
  return alerts.length ? `<section class="critical-alerts">${alerts.join('')}</section>` : '';
}

// Включает: hero-grid, equity curve, KPI карточки, ATR Change секцию.
function buildSummaryContent(d, eq) {
  const s = d.summary || {};
  const wr = (s.win_rate ?? 0) / 100;
  const rWin  = s.avg_r_win  ?? 0;
  const rLoss = s.avg_r_loss ?? 0;
  const ev = wr * rWin + (1 - wr) * rLoss;
  const evRound = Math.round(ev * 100) / 100;
  const pfDenom = (1 - wr) * Math.abs(rLoss);
  const pf = pfDenom > 0 ? Math.round(wr * rWin / pfDenom * 100) / 100 : null;
  const cpdAll = s.closed_per_day ?? 0;

  function maxLoseStreak(n, wr) {
    const lossRate = 1 - wr;
    if (lossRate <= 0) return 0;
    return Math.round(Math.log(n) / Math.log(1 / lossRate));
  }
  function maxDD(streak, riskPct) {
    return Math.round((1 - Math.pow(1 - riskPct / 100, streak)) * 1000) / 10;
  }

  // Сохраняем для updateProj
  window._ev = ev;
  window._wr = wr;
  window._cpdAll = cpdAll;
  window.maxLoseStreak = maxLoseStreak;
  window.maxDD = maxDD;

  const projRow = ev > 0 ? `
    <div class="card" style="min-width:380px;flex:2;border-color:#3fb95044" id="projCard">
      <div class="label" style="font-size:.85rem;color:#c9d1d9;font-weight:600">
        &#x1F4B0; Калькулятор роста депозита (compound)
        <span style="color:#555;font-size:.7rem"> EV = ${evRound > 0 ? '+' : ''}${evRound.toFixed(2)}R/сделку</span>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin:8px 0 10px;flex-wrap:wrap">
        <div><div class="label">Депозит $</div>
          <input id="projDeposit" type="number" value="100" min="10" max="1000000"
            style="width:90px;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;padding:4px 8px;font-size:.9rem"
            oninput="updateProj()"></div>
        <div><div class="label">Риск %/сделку</div>
          <input id="projRisk" type="number" value="1" min="0.05" max="10" step="0.05"
            style="width:70px;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;padding:4px 8px;font-size:.9rem"
            oninput="updateProj()"></div>
        <div><div class="label">Режим</div>
          <select id="projMode" style="background:#0d1117;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;padding:4px 8px;font-size:.85rem" onchange="updateProj()">
            <option value="manual3">Ручной · 3/день</option>
            <option value="manual5">Ручной · 5/день</option>
            <option value="manual10">Ручной · 10/день</option>
            <option value="auto" ${cpdAll > 0 ? '' : 'disabled'}>Авторежим · все (${cpdAll}/день)</option>
          </select></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px">
        <div style="text-align:center">
          <div class="label">Рост за 30 дней</div>
          <div class="value green" style="font-size:1.6rem" id="projPct">...</div>
          <div class="label" id="projFin">...</div>
        </div>
        <div style="text-align:center">
          <div class="label">Макс. серия SL</div>
          <div class="value yellow" style="font-size:1.6rem" id="projStreak">...</div>
          <div class="label">подряд убыточных</div>
        </div>
        <div style="text-align:center">
          <div class="label">Макс. просадка</div>
          <div class="value red" style="font-size:1.6rem" id="projDD">...</div>
          <div class="label">при серии SL</div>
        </div>
      </div>
      <div style="margin-top:10px;font-size:.75rem;color:#555;border-top:1px solid #21262d;padding-top:6px">
        ⚠️ Compound-прогноз на основе симуляции. WR 33% при 2370 сделок → до 19 SL подряд статистически.
        Авторежим берёт <b>все</b> сигналы бота — нужен малый риск (0.1-0.3%) чтобы выдержать просадку.
      </div>
    </div>` : '';

  window.updateProj = function() {
    const dep  = parseFloat(document.getElementById('projDeposit')?.value || 100);
    const risk = parseFloat(document.getElementById('projRisk')?.value || 1);
    const mode = document.getElementById('projMode')?.value || 'manual3';
    const ev_  = window._ev;
    const wr_  = window._wr;
    const tpdMap = { manual3: 3, manual5: 5, manual10: 10, auto: window._cpdAll || 10 };
    const tpd = tpdMap[mode] || 3;
    const n = tpd * 30;
    if (ev_ <= 0) {
      document.getElementById('projPct').textContent = '—';
      document.getElementById('projFin').textContent = '—';
      return;
    }
    const finalDep = dep * Math.pow(1 + (risk / 100) * ev_, n);
    const gain = finalDep - dep;
    const pct = Math.round(gain / dep * 1000) / 10;
    document.getElementById('projPct').textContent = (gain > 0 ? '+' : '') + pct + '%';
    document.getElementById('projFin').textContent = '$' + Math.round(finalDep);
    const streak = maxLoseStreak(n, wr_);
    const dd = maxDD(streak, risk);
    document.getElementById('projStreak').textContent = streak;
    document.getElementById('projDD').textContent = '-' + dd + '%';
    const ddEl = document.getElementById('projDD');
    if (ddEl) ddEl.className = 'value ' + (dd > 30 ? 'red' : dd > 15 ? 'yellow' : 'green') + ' ';
    ddEl.style.fontSize = '1.6rem';
    const pctEl = document.getElementById('projPct');
    if (pctEl) { pctEl.className = 'value green'; pctEl.style.fontSize = '1.6rem'; }
  };

  return `

    <!-- DEV-144d: Hero grid — 3 карточки вверху -->

        <div class="hc-sub">${_riskMeta.risk_exposure_usdt != null && _riskMeta.deposit_usdt != null ? '$' + _riskMeta.risk_exposure_usdt.toFixed(0) + ' из $' + _riskMeta.deposit_usdt.toFixed(0) : 'нет данных о депозите'}</div>
        <div class="hc-bar"><div class="hc-bar-fill" id="heroRiskBar" style="width:${Math.min(_riskMeta.risk_exposure_pct||0, 100)}%;background:${(_riskMeta.risk_exposure_pct||0) > 10 ? '#f85149' : (_riskMeta.risk_exposure_pct||0) > 5 ? '#d29922' : '#3fb950'}"></div></div>
      </div>
      <!-- Карточка 3: Позиций / WR -->
      <div class="hero-card">
        <div class="hc-label">Позиций открыто / WR</div>
        <div class="hc-val">${s.open_count ?? 0} <span style="font-size:1.1rem;color:#8b949e;font-weight:400">/ ${s.total ?? 0}</span></div>
        <div class="hc-row">
          <div class="hc-mini green">TP ${s.tp_count ?? 0}</div>
          <div class="hc-mini purple">TSL ${s.tsl_count ?? 0}</div>
          <div class="hc-mini red">SL ${s.sl_count ?? 0}</div>
          <div class="hc-mini" style="margin-left:auto;font-size:.95rem;font-weight:700" class="${wr >= 0.5 ? 'green' : 'red'}">
            <span style="color:${wr >= 0.5 ? '#3fb950' : '#f85149'}">${s.win_rate != null ? s.win_rate + '%' : '—'}</span>
            <span style="color:#8b949e;font-size:.7rem;font-weight:400"> WR</span>
          </div>
        </div>
      </div>
      <!-- D-067 QW3: Drops summary (топ-3 gates за час, заполняется loadDropsCard) -->
      <div class="hero-card" id="heroDrops" style="border-color:#d2992233">
        <div class="hc-label">Drops за последний час</div>
        <div id="heroDropsContent"><div class="hc-sub">загрузка…</div></div>
      </div>
    </div>
    <!-- Equity curve -->
    ${renderEquitySection(eq, d.open_trades)}
    <!-- KPI карточки -->
    <section>
      <h2>Метрики стратегии</h2>
      <div class="cards">
        <div class="card" style="border-color:${evRound > 0 ? '#3fb950' : '#f85149'}44">
          <div class="label">EV / сделку <span style="color:#444;font-size:.7rem" title="Expected Value = WR×R_win + (1-WR)×R_loss">ожидаемый R</span></div>
          <div class="value ${evRound > 0 ? 'green' : 'red'}">${evRound > 0 ? '+' : ''}${evRound.toFixed(2)}R</div>
          <div class="label" style="margin-top:4px">${evRound > 0 ? '✅ Система прибыльна' : '❌ Система убыточна'}</div></div>
        <div class="card"><div class="label">Profit Factor</div>
          <div class="value ${pf >= 1.5 ? 'green' : pf >= 1 ? 'yellow' : 'red'}">${pf != null ? pf.toFixed(2) : '—'}</div>
          <div class="label" style="margin-top:4px">${pf >= 1.5 ? '🔥 Отличный' : pf >= 1.2 ? '👍 Хороший' : pf >= 1 ? '⚡ Слабый' : '❌ < 1'}</div></div>

  return `<table><thead><tr>

    <th>Avg Profit%</th><th>Avg R</th>
  </tr></thead><tbody>` +
  rows.map(r => `<tr>
    <td><span${tip(r[labelKey])}${TOOLTIPS[r[labelKey]] ? ' style="cursor:help;border-bottom:1px dotted #8b949e"' : ''}>${r[labelKey] || '—'}</span></td>
    <td>${r.total}</td>
    <td class="${r.win_rate >= 50 ? 'green' : 'red'}">${r.win_rate != null ? r.win_rate + '%' : '—'}</td>
    <td class="green">${r.tp_count ?? r.wins ?? 0}</td>

    <td class="red">${r.sl_count ?? r.losses ?? 0}</td>

  </tr>`).join('') + '</tbody></table>';
}

// DEV-179: расширенная таблица с median/Sharpe/p90/top20 + warning-подсветка
function tableByGroupExtended(rows, labelKey) {
  if (!rows || !rows.length) return '<p class="note">Нет данных</p>';

  const warnTip = (warnings) => {
    if (!warnings || !warnings.length) return '';
    const msgs = {
      'n<100': 'Мало сделок (<100) — выводы шумовые',
      'sharpe<0.5': 'Sharpe < 0.5 — стратегия живёт на удаче или хвосте',
      'heavy_tail': 'Тяжёлый хвост: median_R << avg_R — среднее неинформативно',
      'top20_concentrated': 'Топ-20 сделок дают >50% прибыли — проверь концентрацию',
    };
    const tips = warnings.map(w => msgs[w] || w).join('\n');
    const icons = warnings.map(w => w === 'n<100' ? '⚠' : '🚨').join('');
    return `<span title="${tips}" style="cursor:help;margin-left:4px;font-size:.75rem">${icons}</span>`;
  };

  const warnStyle = (warnings) => {
    if (!warnings || !warnings.length) return '';
    return warnings.some(w => w !== 'n<100') ? 'background:#161010;' : '';
  };

  return `<table><thead><tr>
    <th>${labelKey}</th><th>n</th><th>WR%</th>
    <th class="green">TP</th><th class="purple">TSL</th><th class="red">SL</th>
    <th>avg R</th><th>median R</th><th>p90 R</th><th>Sharpe</th><th>top20%</th>
  </tr></thead><tbody>` +
  rows.map(r => {
    const warns = r.warnings || [];
    const style = warnStyle(warns);
    return `<tr style="${style}">
      <td><span${tip(r[labelKey])}${TOOLTIPS[r[labelKey]] ? ' style="cursor:help;border-bottom:1px dotted #8b949e"' : ''}>${r[labelKey] || '—'}</span>${warnTip(warns)}</td>
      <td>${r.total}</td>
      <td class="${(r.win_rate || 0) >= 50 ? 'green' : 'red'}">${r.win_rate != null ? r.win_rate + '%' : '—'}</td>
      <td class="green">${r.tp_count ?? r.wins ?? 0}</td>
      <td class="purple">${r.tsl_count ?? 0}</td>
      <td class="red">${r.sl_count ?? r.losses ?? 0}</td>
      <td class="${color(r.avg_r)}">${fmt(r.avg_r,2)}</td>
      <td class="${color(r.median_r)}">${fmt(r.median_r,2)}</td>
      <td class="${color(r.p90_r)}">${fmt(r.p90_r,2)}</td>
      <td class="${r.sharpe != null ? (r.sharpe >= 0.5 ? 'green' : (r.sharpe >= 0 ? '' : 'red')) : ''}">${fmt(r.sharpe,2)}</td>
      <td class="${(r.top20_share||0) > 0.5 ? 'red' : ''}">${r.top20_share != null ? Math.round(r.top20_share*100) + '%' : '—'}</td>
    </tr>`;
  }).join('') + '</tbody></table>' +
  `<p class="note" style="margin-top:6px">⚠ n<100 — шумовые данные &nbsp;|&nbsp; 🚨 Sharpe<0.5 / heavy_tail / top20>50% — качество под вопросом</p>`;
}

function regimeSection(rows) {
  const allUnknown = !rows || rows.every(r => r.regime === 'unknown');

  return tableByGroup(rows, 'regime');
}
