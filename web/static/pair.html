<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair — Crypto Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
  .topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 24px; display: flex; align-items: center; gap: 16px; }
  .topbar a { color: #8b949e; text-decoration: none; font-size: .85rem; }
  .topbar a:hover { color: #c9d1d9; }
  .topbar-title { font-size: .95rem; font-weight: 700; color: #c9d1d9; margin-left: 8px; }
  .topbar-sym { font-size: .85rem; color: #58a6ff; margin-left: 4px; }
  #updated { margin-left: auto; font-size: .75rem; color: #8b949e; }
  .content { padding: 24px; max-width: 1100px; margin: 0 auto; }
  section { margin-bottom: 28px; }
  h2 { font-size: .82rem; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; border-bottom: 1px solid #21262d; padding-bottom: 6px; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px 20px; min-width: 120px; flex: 1; }
  .card .label { font-size: .72rem; color: #8b949e; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
  .card .value { font-size: 1.5rem; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; padding: 8px 10px; background: #161b22; color: #8b949e; border-bottom: 1px solid #30363d; }
  td { padding: 7px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: #1c2128; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 600; }
  .badge-TP  { background: #1a3a1f; color: #3fb950; }
  .badge-SL  { background: #3a1a1a; color: #f85149; }
  .badge-TSL { background: #2a1a3a; color: #b87eff; }
  .badge-EXPIRED { background: #2d2a1a; color: #d29922; }
  .badge-OPEN { background: #1a2a3a; color: #58a6ff; }
  .green { color: #3fb950; } .red { color: #f85149; } .blue { color: #58a6ff; }
  .yellow { color: #d29922; } .purple { color: #b87eff; }
  .tv-link { font-size: .75rem; color: #8b949e; text-decoration: none; }
  .tv-link:hover { color: #58a6ff; }
  #loader { text-align: center; padding: 80px; color: #8b949e; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Dashboard</a>
  <a href="/performance">← Перформанс</a>
  <span class="topbar-title">Пара:</span>
  <span class="topbar-sym" id="sym-title">...</span>
  <span id="updated"></span>
</div>
<div class="content">
  <div id="loader">Загрузка...</div>
  <div id="main" style="display:none">

    <!-- Stats -->
    <section>
      <h2>Статистика</h2>
      <div class="cards">
        <div class="card"><div class="label">Сделок</div><div class="value blue" id="st-total">—</div></div>
        <div class="card"><div class="label">Win Rate</div><div class="value" id="st-wr">—</div></div>
        <div class="card"><div class="label">Avg R</div><div class="value" id="st-avgr">—</div></div>
        <div class="card"><div class="label">Best R</div><div class="value green" id="st-bestr">—</div></div>
        <div class="card"><div class="label">Worst R</div><div class="value red" id="st-worstr">—</div></div>
        <div class="card"><div class="label">LONG / SHORT</div><div class="value" id="st-dir">—</div></div>
      </div>
    </section>

    <!-- Open -->
    <section id="sec-open" style="display:none">
      <h2>Открытые сделки</h2>
      <table>
        <thead><tr><th>Направление</th><th>Entry</th><th>SL</th><th>Текущая</th><th>Unrealized R</th><th>Сигнал</th></tr></thead>
        <tbody id="tbl-open"></tbody>
      </table>
    </section>

    <!-- History -->
    <section>
      <h2>История (последние 50)</h2>
      <table>
        <thead><tr><th>Направление</th><th>Сигнал</th><th>Статус</th><th>R</th><th>P%</th><th>Закрыта</th></tr></thead>
        <tbody id="tbl-history"></tbody>
      </table>
    </section>

  </div>
</div>
<script>
// Symbol из пути: /pair/BTC_USDT → BTC/USDT
const rawSym = location.pathname.split('/pair/')[1] || '';
const symbol = decodeURIComponent(rawSym).replace(/_/g, '/');
document.title = `${symbol} — Crypto Bot`;
document.getElementById('sym-title').textContent = symbol;

const fmt = (v, d=2) => v == null ? '—' : Number(v).toFixed(d);
const color = v => v == null ? '' : Number(v) >= 0 ? 'green' : 'red';
const wrClass = v => v == null ? '' : Number(v) >= 40 ? 'green' : Number(v) >= 25 ? 'yellow' : 'red';

function renderStats(s) {
  document.getElementById('st-total').textContent = s.total ?? '—';
  const wrEl = document.getElementById('st-wr');
  wrEl.textContent = s.wr_pct != null ? fmt(s.wr_pct, 1) + '%' : '—';
  wrEl.className = 'value ' + wrClass(s.wr_pct);
  const arEl = document.getElementById('st-avgr');
  arEl.textContent = fmt(s.avg_r);
  arEl.className = 'value ' + color(s.avg_r);
  document.getElementById('st-bestr').textContent  = fmt(s.best_r);
  document.getElementById('st-worstr').textContent = fmt(s.worst_r);
  document.getElementById('st-dir').textContent = `${s.longs ?? 0} / ${s.shorts ?? 0}`;
}

function renderOpen(rows) {
  if (!rows.length) return;
  document.getElementById('sec-open').style.display = 'block';
  const tb = document.getElementById('tbl-open');
  tb.innerHTML = rows.map(r => {
    const ur = r.unrealized_r;
    const dirCol = r.direction === 'LONG' ? 'green' : 'red';
    return `<tr>
      <td class="${dirCol}">${r.direction}</td>
      <td>${fmt(r.entry_price, 5)}</td>
      <td class="red">${fmt(r.stop_loss, 5)}</td>
      <td>${r.current_price != null ? fmt(r.current_price, 5) : '—'}</td>
      <td class="${color(ur)}">${ur != null ? fmt(ur) + 'R' : '—'}</td>
      <td>${r.signal_type || '—'}</td>
    </tr>`;
  }).join('');
}

function renderHistory(rows) {
  const tb = document.getElementById('tbl-history');
  tb.innerHTML = rows.map(r => {
    const st = r.status || 'OPEN';
    const r_val = r.R_multiple;
    const dt = r.closed_at ? r.closed_at.split('T')[0] + ' ' + (r.closed_at.split('T')[1]||'').slice(0,5) : '—';
    const dirCol = r.direction === 'LONG' ? 'green' : 'red';
    return `<tr>
      <td class="${dirCol}">${r.direction || '—'}</td>
      <td>${r.signal_type || '—'}</td>
      <td><span class="badge badge-${st}">${st}</span></td>
      <td class="${color(r_val)}">${r_val != null ? fmt(r_val) + 'R' : '—'}</td>
      <td class="${color(r.profit_pct)}">${r.profit_pct != null ? fmt(r.profit_pct, 2) + '%' : '—'}</td>
      <td style="color:#8b949e;font-size:.8rem">${dt}</td>
    </tr>`;
  }).join('');
}

const apiSym = rawSym || symbol.replace(/\//g, '_');
fetch(`/api/pair/${apiSym}`)
  .then(r => r.json())
  .then(d => {
    renderStats(d.stats || {});
    renderOpen(d.open  || []);
    renderHistory(d.history || []);
    document.getElementById('updated').textContent = 'Обновлено ' + new Date().toLocaleTimeString();
    document.getElementById('loader').style.display = 'none';
    document.getElementById('main').style.display   = 'block';
  })
  .catch(e => {
    document.getElementById('loader').textContent = 'Ошибка: ' + e;
  });
</script>
</body>
</html>
