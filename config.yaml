# ─── ARCH-104: Pattern Mining + Risk Intelligence (D-030, 21.05.2026) ───
# Observer loop сканит 241 пары × 4 TF каждые 10 мин. Когда RI v1 решает
# apply=True → регистрирует сделку через trade_simulator (VST).
# Отключить: vst_trading.enabled: false → только shadow logging
# в risk_decisions_log без сделок.
# ═══ ARCH-96: Мульти-аккаунт (субаккаунты BingX) ═══════════════════════════
arch96:
  multiaccount:
    enabled: true             # 08.06 Ф2 ВКЛЮЧЁН: existing-пары закреплены за main (pre-seed),
                              # новые → least-loaded (sub, 10000 VST). Разгрузка лимита 100/акк.
                              # Ф3 sync агрегирует оба. OFF → один клиент (account=1, старое).

arch104:
  vst_trading:
    enabled: true             # 08.06 ВЕРНУЛ из shadow: моя оценка slippage 0.45% была ОШИБОЧНА
                              # (взял спред BingX-vs-рынок). DS-аудит (vst_slippage_audit.py): реальный
                              # entry-slip ~0.1% → arch104 real_avgR ≈ +0.12 (ПЛЮС!). OTE+arch104 = +1501R
                              # на VST. Реальный минус проекта = pivot_reversal+confluence (−1865R).
    signal_type: "arch104"    # в БД simulated_trades для разделения
  # C-01 (11.06.2026): слепота CHoCH/SMC length=50. Эталон OKO-SM = 5.
  # 5 → живой на 5m/15m (0 CHoCH при 50). Переключить после ре-майнинга + A/B бэктеста.
  choch_length: 50             # дефолт=50 (текущее). Поменять на 5 после ре-майнинга 69 паттернов.
  # D-051 (26.05.2026): wt_cross HARD gate для СТАРЫХ паттернов (+183% на 15m тогда).
  # ARCH-128 04.06: ВЫКЛЮЧЕН. Душил весь DS-реестр (200/200 без wt_cross в anchor →
  # требовал strict wt_cross_{tf} в OS/OB → 0 срабатываний = arch104 молчал). DS-паттерны
  # walkforford-валидированы БЕЗ wt_cross, их конфлюенция сама = подтверждение.
  d051_wt_cross_gate: false   # true только если вернуть старые паттерны с wt_cross-якорем
  shadow_trigger_check:
    enabled: false  # устарело — gate теперь в observer_loop напрямую

# ─── ARCH-128: OTE Observer — скелеты сетапов (геометрия OTE → выстрел) ───
# ote_observer_loop сканит пары каждые 5 мин: строит OTE-зону (provisional нога),
# собирает зональные триггеры (OB/FVG/EQL/SC), проверяет ВЫСТРЕЛ (касание+реакция+ATRTrend).
# ARMED (цена в зоне, ждём) → лог. FIRE (выстрел) → register_trade signal_type='ote_nested'.
