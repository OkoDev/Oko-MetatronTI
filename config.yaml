  use_ws: true          # Этап 2 LIVE (14.06): scan читает из WS-кэша, без REST-polling ohlcv
  timeframes: [3m, 5m, 15m]   # +3m (15.06): был 31% hit (не на WS, TTL 180с истекал) → −200 REST/цикл. WS-трафик +50%
  batch_pairs: 50       # пар на одно WS-соединение (526/50 ≈ 11 соединений)

