    max_total_risk_pct: 25.0     # 19.06 Режим В: 10→25 (диверсификация ~37 поз). потолок суммарного риска открытых VST
    risk_gate_shadow: false       # 19.06 Режим В: АКТИВИРОВАН (было shadow). Блокирует вход при суммарном риске >25%
    # Кирпич №2 margin pre-check (17.06): блок нового входа если available маржа per-account < порога
    # (из balance_snapshots). Корень фантомов: register пишет SIM ДО placement → margin-reject оставляет
    # SIM=фантом. Shadow 17.06: available ~22/acc, used 87%. Старт 5 USDT (margin сделки ~2-5), уточнить.
    min_available_usdt: 5.0      # порог доступной маржи. null/0 → проверка выключена
    margin_gate_shadow: false     # 19.06 Режим В: АКТИВИРОВАН (было shadow). Блокирует вход при available < min_available_usdt
