# ════════════════════════════════════════════════════════════════════════════
# ТЕЛЕГРАМ
#   токен и чат. Читает bot/ (aiogram).
# ════════════════════════════════════════════════════════════════════════════
telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: '428163099'

# ════════════════════════════════════════════════════════════════════════════
# БИРЖИ И КЛЮЧИ
#   bingx (боевой) и bingx_vst (тест). Ключи из .env через ${VAR}.
# ════════════════════════════════════════════════════════════════════════════
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
    bingx_vst:
      api_key: ${BINGX_VST_API_KEY}
      secret: ${BINGX_VST_SECRET_KEY}

# ════════════════════════════════════════════════════════════════════════════
# АНАЛИЗ И ДЕТЕКТОРЫ
#   пороги индикаторов, WT, конфлюэнция. Читают core/signals/, core/indicators/.
# ════════════════════════════════════════════════════════════════════════════
analysis:
  volume_multiplier: 4.0
  price_threshold: 3.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 60.0
      os_threshold: -60.0
    trend:
      atr_period: 43
      factor: 1.25
  signals:
    min_signals: 2
    single_signal_min_strength: 54
    min_confidence: 0.55
    min_confidence_by_type:
      wt_b_signal: 0.5
      wt_signal: 0.52
      pivot_reversal: 0.52
      confluence: 0.58
      mtf_bias: 0.55
      trend_signal: 0.55
      anomaly: 0.6
    premium_pairs:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - ADA
    - DOGE
    - DOT
    - MATIC
    - AVAX
  wt_b:
    enabled: true
    div_min: 3.0
    div_max: 20.0
    lookback: 35
    os_floor: -30.0
    ob_floor: 30.0
  divergence:
    pivot_proximity_pct: 0.3
  anomaly:
    max_per_cycle: 5
  confluence:
    enabled: true
    use_state_machine: false
    lookback_bars: 8
    cross_fresh_bars: 5
    min_strength: 60
    wt_os_threshold: -60.0
    wt_ob_threshold: 60.0
    pivot_touch_pct: 0.15
    div_min_bars: 9
    max_per_cycle: 10
    dynamic_os_enabled: true
    dyn_os_k: 1.2
    dyn_os_window: 50
    4h_gate_enabled: false
    pivot_proximity_pct: 0.2

# ════════════════════════════════════════════════════════════════════════════
# ТАРИФЫ
#   лимиты сигналов по уровням подписки. bot/handlers/.
# ════════════════════════════════════════════════════════════════════════════
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99

# ════════════════════════════════════════════════════════════════════════════
# ЛОГИ
#   уровень и ротация.
# ════════════════════════════════════════════════════════════════════════════
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5

# ════════════════════════════════════════════════════════════════════════════
# БАЗА
#   путь к subscriptions.db.
# ════════════════════════════════════════════════════════════════════════════
database:
  path: subscriptions.db
  backup_interval: 24

# ════════════════════════════════════════════════════════════════════════════
# МОНИТОРИНГ
#   пороги алертов по WR. ⚠️ wr_check_window / wr_warn / wr_critical читаются из кода (ml_loop.py:82-84), в файле их НЕТ.
# ════════════════════════════════════════════════════════════════════════════
monitoring:
  check_intervals:
    divergences_every_n_cycles: 5
    background_every_n_cycles: 3
    cascade_div_every_n_cycles: 60

# ════════════════════════════════════════════════════════════════════════════
# ML-ПРЕДИКТОР ИСХОДА
#   core/ml/.
# ════════════════════════════════════════════════════════════════════════════
outcome_predictor:
  training_window: null
strategy_name: multi_signal

# ════════════════════════════════════════════════════════════════════════════
# СИМУЛЯЦИЯ
#   режим SIM: без ордеров на бирже.
# ════════════════════════════════════════════════════════════════════════════
simulation:
  sl_touch_all: true
  taker_fee_pct: 0.045
  funding_est_pct: 0.01

# ════════════════════════════════════════════════════════════════════════════
# БОКОВИК
#   отдельный режим входов в диапазоне.
# ════════════════════════════════════════════════════════════════════════════
sideways_mode:
  # 17.08 ВЫКЛЮЧЕН (Егор): единственный потребитель 30m, а 30m тянулся 219 раз за цикл с нулевым
  # кэшем (20% REST-бюджета). Разрез по 7558 сделкам: 2026 LONG net −0.514% WR 38% · SHORT
  # −0.540% WR 37%; TREND_UP −0.438% · RANGE −0.513% · TREND_DOWN −0.661% — плюсового кармана нет
  # ни в одном разрезе. Освобождённые запросы отданы под 5m в снапшоте.
  enabled: false
  min_sideways_bars: 3
  timeframe: 30m
  min_strength: 60

# ════════════════════════════════════════════════════════════════════════════
# 🔴 ТОРГОВОЕ ЯДРО — 220 ключей, самая крупная секция
#   риск, плечо, стопы, TSL, гейты входа. Читают core/trading/, core/execution/, core/exchange/.
#   ⚠️ ВНИМАНИЕ: sl_tp_engine мержится СЮДА через setdefault (config_loader.py:38) —
#   ключ, объявленный здесь, ПЕРЕКРЫВАЕТ одноимённый из sl_tp_engine. Правь здесь.
# ════════════════════════════════════════════════════════════════════════════
trading:
  execution_mode: vst
  live_guard_timeout_min: 7
  method_v2:
    enabled: false
    scan_sec: 900
    max_positions: 5
    fresh_bars_15m: 3
    tp_shares:
    - 40
    - 30
    - 30
    conf_only: false
    max_symbols: 60
  ds_advisor:
    enabled: true    # 25.07 Егор: DC получает весь поток и принимает торговые решения (VST, кап 5)
    max_open: 5
  rangefade:
    enabled: true    # 30.07: фейд-семейство. 1h (чоп-режим) + 4h WT<-70 (СИЛЬНЕЕ: плюс в ОБА года,
    # 30.07 калибровка по ЧАСТОТЕ (Егор «чем чаще повторение тем ближе цель»):
    # цель = частота × медиана. 4h: −60 даёт 0.94 сд/мес/монету → +1.77%/мес против −70
    # (0.32 сд/мес → +0.49%/мес) при той же робастности (безтоп10% +426, плюс в ОБА года).
    # 1h: −70 единственный робастный (безтоп10% +580); −60 хрупкий (−586). 15m мёртв на всех порогах.
    wt_threshold: -70
    wt_threshold_4h: -60
    tp_r: 1.0
    max_open: 8
    cooldown_h: 6
    # 30.07 BIG-FLUSH 15m: тот же фейд, но гейт по РАЗМЕРУ сетапа (стоп>4%) — на 15m косты 0.15%
    # против стопа 0.5% съедали треть цели; при стопе>4% они 3%. Частота 1.83 сд/мес/монету.
    bigflush_enabled: true
    bigflush_min_stop_pct: 4.0
    bigflush_max_open: 6
    # 31.07 КЛАСТЕР-ГЕЙТ: весь эдж в рыночном заливе. Монета, залившаяся ОДНА (своя новость/слом)
    # льёт: МЕД −0.218% PF 0.67 безтоп10% −142 (n125). Залившаяся ВМЕСТЕ с рынком отскакивает:
    # МЕД +1.232% PF 2.24 безтоп10% +390 (n934). Теряем 12% сделок, сумма прибыли РАСТЁТ.
    min_cluster: 2
    # 05.08 СЕССИОННЫЙ ГЕЙТ для bigflush15 (там измерено, 40 монет 2024-26, косты 0.35%):
    # ASIA 00-08 PF 5.49 · OFF 21-24 PF 2.83 · LONDON 08-14 PF 0.45 (ЯД, медиана −1.55%) · NY PF 0.88.
    # ASIA/OFF + кластер: PF 3.90, безтоп10% +738, 19/20 монет, ПЛЮС ВО ВСЕ ТРИ ГОДА (чинит 2024).
    # Механизм: в тонкой ликвидности флеш механический (ликвидации/свипы) → откатывает;
    # в LONDON/NY он информированный (новости, институты) → продолжается.
    # 10.08 ПОСЛЕ ЖИВОГО РАЗБОРА: 4 сделки дали −126.6% из −101.5% итога rangefade4h.
    # Стопы у них: CATE 48.6%, GPUBSC 29.4/25.4/21.4% — на неликвиде 3-барный лоу уходит
    # на 20-48%. Медиана наших стопов 3.9%, 90-й перцентиль 13%. Кап 12% режет 13% сделок
    # и ВСЕ катастрофы. Оборот $2M отсекает 52% монет = ровно «ликвидная половина»,
    # на которой мерился бэктест (GPUBSC $619k, CATE $742k — оба под порогом).
    # 10.08 ГИБРИД-ВЫХОД: две половины по 0.5× риска — «банк» с TP1R и «раннер» с дальней
    # целью под штатным TSL (активация +1R, линия ATRTrend, доезжает до биржи).
    # Бэктест на вселенной боя: медиана +0.910% → +2.839%, безтоп10% +53 → +216, все 3 года +.
    hybrid_exit: true
    runner_tp_r: 5.0
    # 10.08 СТРУКТУРНЫЙ ГЕЙТ (из мысли Егора «складывай импульс через CHoCH и BOS»).
    # Фейдим ТОЛЬКО дислокацию, сломавшую ВНУТРЕННЮЮ структуру (медв. BOS len5 за 5ч).
    # 100 ликвидных монет 2024-26, косты 0.35%, n=4439:
    #   БЕЗ BOS  — PF 1.05, медиана +0.17%, безтоп10% −884%, плюс на 56/100 монет (балласт)
    #   ≥1 BOS   — PF 1.79, медиана +1.31%, безтоп10% +634%, 86/100, плюс ВСЕ 3 года
    #   ≥2 BOS   — PF 3.41, медиана +2.50%, WR 71%, 77/93 (идёт в САЙЗИНГ ×1.5, не в гейт:
    #              частота падает вшестеро, а по %/мес выигрывает более частый ≥1 BOS)
    # ШКАЛА КРИТИЧНА: тот же гейт по swing50 ВРЕДИТ (PF 0.91) — флеш ломает внутреннюю
    # структуру, не старшую. Бычий CHoCH («разворот подтверждён») — PF 0.78, восьмое
    # подтверждение закона «подтверждение = опоздание».
    # База БЕЗ гейта проваливает тест хрупкости (безтоп10% −277%), с гейтом проходит (+634%).
    # Разметка на окне 200 баров совпала с полной историей в 351/351 точке.
    bigflush_min_bos: 1
    # 13.08.2026: 12.0 → 4.0. Замер по БОЕВЫМ сделкам фейда (n=56, косты 0.35%):
    #   потолок ≤12% → PF 0.63, итог −68.8%   (текущее состояние)
    #   потолок ≤8%  → PF 0.85, итог −32.7%
    #   потолок ≤6%  → PF 1.40, итог  +7.2%
    #   потолок ≤4%  → PF 3.94, итог +45.5%   ← выбрано
    # По зонам видно, ГДЕ ломается: <2% → PF 6.30 · 2-4% → 3.03 · 4-6% → 0.00 · >6% → 0.18.
    # Кап 12% пропускал катастрофы на неликвиде (стопы 25.4%, 11.4%, 8.6% → SL подряд).
    # Это ПОТОЛОК, а не минимум: у фейда эдж в МАЛЫХ стопах, обратно radar_pump (>6% → PF 3.01).
    max_stop_pct: 4.0
    min_turnover_usd: 2000000
    bad_session_from_h: 8      # с 08:00 UTC
    bad_session_to_h: 21       # по 21:00 UTC (не включая) — окно, где НЕ торгуем
  choch_wavec:
    # 18.08 CHoCH → ОТКАТ 0.236 → ВОЛНА C · 1h · SHORT. Единственная механика проекта,
    # прошедшая ПЕРЕКРЁСТНЫЙ OOS (OOS-монеты × OOS-время: n=1150, WR 53.1%, PF 1.17).
    # 5 соседних настроек дают PF 1.13–1.19 — плато устойчивости, а не подогнанный пик.
    # Нога берётся из oko_sm_engine.leg_history (структурная), НЕ «от свинга до свинга»:
    # грубая нога расходится со структурной в 4.06× по длине и в 44% по направлению.
    enabled: true    # 19.08 ВКЛЮЧЕНО по команде Егора («Включить ядро CHoCH на VST»)
    shadow: false    # шлём в router (execution_mode: vst → торгует на VST-аккаунтах)
    # Журнал choch_shadow всё равно ведётся — по нему сверяем ФАКТИЧЕСКУЮ цену фила
    # с заявленной. Это единственный вопрос, который бэктест закрыть не может:
    # он считает фил по касанию high>=entry, биржа — по стакану.
    min_atr_pct: 1.59    # вторая половина ядра, см. min_stop_pct ниже
    universe_top: 250    # вселенная замера; расширение до 400 роняло PF 1.15 → 1.06
    # 🔑 КОРИДОР СТОПА (замер 19.08, 198 монет, 4885 сделок, окно 2022-2026):
    # база PF 1.07 → в коридоре 8-15% PF 1.21, медиана +0.055% → +0.881%,
    # хрупкость безтоп10% −6193 → −1738. Поднимает PF в КАЖДОМ из 5 лет, не подгонка.
    # Вне коридора: <8% PF 1.01 (косты съедают цель), >15% PF 0.88.
    min_stop_pct: 8.0
    max_stop_pct: 15.0
    min_boosters: 0      # 0 = база (1.90 сд/дн). Усилители режут частоту в 5-10 раз:
    # помеха≤34 PF 1.50 · под S1(1W) 1.84 · ATR>1.59% 1.29 · час≤7 UTC 1.39.
    # Пары дают PF 2.0-2.31 при ПОЛОЖИТЕЛЬНОМ безтоп10%, но 0.07-0.19 сд/дн.
    max_open: 8
    bars: 1000
  impulse_fib:
    # 🔴 25.08 до 2 сделок на монету/сторону (решение Егора «дать дышать»).
    max_per_symbol: 2
    # 20.08 ИМПУЛЬС → ЛИМИТ 0.382 · 1h · ОБЕ стороны. Импульс ПО ОПРЕДЕЛЕНИЮ:
    # ход ≥3 ATR, контр-откат ≤35%, длина ≤60 баров. Стоп 2.5·ATR, цель −1.618.
    #
    # 🔴 МЕХАНИКА В ШИРОКОМ ВИДЕ МЁРТВА: перемер 20.08 на 250 монетах / 28 818 входов
    # дал OOS-время (2025-26) PF 0.99 и 2026 PF 0.95 при 2022 PF 3.88 — вся сборка
    # ехала на эпохе 2022-23. Прежние «OOS×OOS 1.53» относились к сборке с пивотным
    # фильтром, стопом за origin и решёткой сканирования — при починке не воспроизвелись.
    #
    # ✅ В БОЙ ИДЁТ УЗКАЯ КЛЕТКА: три гейта + СТОП 1.5-3.2%. Она пережила перекрёстный OOS:
    #   OOS-монеты 2.29 · OOS-время 1.73 · OOS×OOS PF 1.90 (n=269), безтоп10% +13 —
    #   плюс НЕ висит на верхних 10% сделок. Обе стороны живы (long 1.64 / short 1.56
    #   на 2025-26). Плато по порогу стопа: ≤2.5% → 1.51 · ≤3.0% → 1.59 · ≤3.2% → 1.62 ·
    #   ≤3.5% → 1.51 · ≤4.0% → 1.31 — не подогнанный пик.
    #   WR ~48% на всём окне (2023: 65%, 2025: 52%, 2026: 29%) — прибыль из RR (медиана
    #   6.2), а не из процента побед. Частота ~17 сделок/мес на 250 монетах.
    #   ⚠️ 22.08 ЧАСТОТА УСТАРЕЛА — «17/мес» из эпохи, когда лимитка наполнялась 25%.
    #   Замер 22.08 (n=25361): филл с гейтами 2023 24.9% → 2025 6.8% → 2026 12.0%.
    #   При нынешних ~10% сделок вдвое-втрое меньше. Механизм: гейты отбирают импульсы
    #   СИЛЬНЕЕ (медиана 10.61 против 8.11 ATR), а сильный импульс не откатывается
    #   до 0.382 — гейты и лимитный вход конфликтуют по конструкции. TASKS RESEARCH-FILL-GAP.
    # 🔴 Нижняя граница 1.5% обязательна: косты 0.35% лимитом, и зона стопа 1.0-1.5%
    #   даёт PF 0.49 — цель не окупает комиссию ([[principle_measure_pct_not_r_LAW]]).
    enabled: true
    # 🔴 20.08 первый боевой скан вскрыл ДВА дефекта, оба починены до первого фила:
    #  1. LIMIT-вход регистрировался как OPEN вместо PENDING_ENTRY → TSL трейлил
    #     НЕСУЩЕСТВУЮЩУЮ позицию (SOL: стоп уехал с 81.40 на 86.67, ВЫШЕ входа 83.08,
    #     при actual_entry=None). Фикс: mark_pending после submit + ведение в
    #     _check_pending (radar_armed_loop) со своим TTL = WAIT_BARS часов.
    #  2. ТРЕТЬЯ копия гейта min_sl_dist — в order_manager (англ. текст «SL too close»),
    #     без per-strategy → exch=none. Фикс: проброс source до open_bracket.
    shadow: false    # шлём в router (execution_mode: vst → торгует на VST-аккаунтах);
    # журнал impulse_shadow ведётся всё равно — по нему сверяем ФАКТИЧЕСКУЮ цену фила
    # с заявленной, единственный вопрос, который бэктест закрыть не может.
    universe_top: 250
    require_gates: true   # объём 1.0-1.5× · по тренду EMA200 · ATR/SMA100 ≥ 1.1
    sides: [long, short]
    min_stop_pct: 1.5
    max_stop_pct: 3.234
    max_open: 8              # ПОЗИЦИЙ в рынке — рыночный риск
    # 🔴 22.08 ЗАЯВКИ СЧИТАЮТСЯ ОТДЕЛЬНО ОТ ПОЗИЦИЙ (Егор: «неактуальные лимитки
    # не слишком ли долго висят?»). Висят они измеренные 12 баров — дефект был в
    # том, что ожидающая лимитка занимала слот РЫНОЧНОГО РИСКА, не будучи в рынке.
    # 22.08: восемь заявок держали кэп 8/8 при НОЛЕ позиций, 1h-луп восемь часов
    # писал «скан 250 пар · новых 0».
    # Замер (45 симв., 2024+, боевые константы): наполняется 20.1% заявок → на одну
    # позицию нужно ~5 заявок. Потолок здесь не от эджа, а от МАРЖИ: 8 заявок
    # зарезервировали ~200 из 451 VST (~25/заявку), при 252 свободных влезает ~10.
    max_pending: 12          # ЗАЯВОК в ожидании фила — резерв маржи
    bars: 1000
    # 🔴 21.08 ДРЕЙФ-ГЕЙТ. Правило прошло слепой тест ДВАЖДЫ независимо:
    #   short + медиана 30-дневной доходности вселенной ≥ +10%
    #   → OOS PF 5.54 против базы 1.22, охват 59%, безтоп10% +1931.
    # Робастен: плато окна 20-45д (PF 4.1-5.5), на 60д исчезает. Контроль long чист.
    # Механизм: фейдим ОТСКОК внутри падающего рынка.
    # 🔴 ОТСЕКАЕТ ~93% ВРЕМЕНИ — это конструкция, а не поломка (зона редкая, 6.7%).
    # 🔴 НЕ ЗАКРЫТО: поведение в долгом РАСТУЩЕМ рынке (в истории такого нет).
    # Данные: scripts/universe_drift.py → pm2 universe-drift, ежечасно.
    drift_gate:
      # 🔴 21.08 РЕШЕНИЕ ЕГОРА: на 1h НЕ РЕЗАТЬ — там механика доказана БЕЗ гейта
      # (OOS×OOS 1.88 против контроля 0.70, безтоп10% +866, охват 63%).
      # Гейт найден и проверен на 15m; на 1h он НЕПРОВЕРЯЕМ — до 30 сделок в зоне
      # там 25.6 месяца против 0.7 на 15m. Блокировать боевые сигналы результатом
      # с чужого ТФ нельзя → mode=shadow: пишем «заблокировал бы», но ПРОПУСКАЕМ.
      mode: shadow          # off | shadow (только лог) | live (реально блокирует)
      min_drift30: 10.0     # порог из слепого теста; менять только с новым замером
      sides: [short]        # long НЕ трогаем: на 1h он работает (OOS 1.74)
      max_age_days: 3       # данные старше — гейт САМОУСТРАНЯЕТСЯ (не блокирует)
  impulse_fib_15m:
    # 🔴 21.08 МЕХАНИКА НА 15m. БЕЗ ГЕЙТА УБЫТОЧНА (PF 0.89, OOS 0.93) —
    # торгуется ТОЛЬКО в связке с дрейф-гейтом:
    #   short + drift30 >= +10% → PF 7.04 · WR 56.9% · охват 62% · OOS 10.82
    # Гейт найден и прошёл слепой тест ИМЕННО здесь → на 15m он ОБОСНОВАН.
    # sides: только short. Long с тем же гейтом даёт 0.68 (OOS 0.08) — исключён.
    # 🔴 25.08 ЦИФРА ИСПРАВЛЕНА. «655 сд/мес» считалось БЕЗ дрейф-гейта и на ОБЕ
    # стороны (8692 сделки / 60 монет / 55.2 мес). При боевой настройке собственный
    # замер проекта даёт ~89 сд/мес (см. таблицу плато ниже) — факт совпал: ~90.
    # Смысл инстанса — ПОТОК ДАННЫХ, поэтому 25.08 ограничения сняты (см. drift_gate).
    enabled: true
    shadow: false            # в бой (VST-песочница)
    universe_top: 250
    # 🔴 25.08 НИЖНЯЯ ГРАНИЦА 1.5 → 1.0. Зона 1.5-3.234% откалибрована на 1h, где
    # медиана стопа 3.16% и зона ложится ровно. На 15m медиана стопа 1.46% — НИЖЕ
    # границы: замер 25.08 показал, что 44-54% сетапов, прошедших ВСЕ гейты,
    # отсеивались только по ней. Это перенос чужой константы, тот же класс, что окна
    # WAIT_BARS ([[twins_15m_stabilized_by_measure]]), а не ослабление фильтра.
    # 🔴 25.08 ФИНАЛ: 1.0 → 1.5. Довод про медиану 1.46% верен арифметически, но
    # мерился на потоке БЕЗ дрейф-гейта. Эдж PF 4.61 / OOS 3.97 воспроизведён именно
    # на зоне 1.5-3.234 — возвращаем её целиком, а не половину.
    min_stop_pct: 1.5
    # 🔴 25.08 ВЕРХНЯЯ ГРАНИЦА 3.234 → 5.0 → 3.0 (ночной замер того же дня).
    # Расширение до 5.0 делалось по частотному доводу («сверху отсеивалось 36%») —
    # то есть по ПОТОКУ, без проверки, что эти сетапы зарабатывают. Проверка на
    # 14250 сделках / 70 монет / 2022-2026 показала обратное:
    #   корзина 1.5-2.5%  n=7111  +0.16   (2023 +0.77 · 2024 +0.27 · 2025 +0.52 · 2026 -0.73)
    #   корзина 2.5-3.5%  n=2972  -0.37   (2023 +0.49 · 2024 +1.20 · 2025 -1.32 · 2026 -0.79)
    #   корзина 3.5-5.0%  n=1370  -0.77   OOS -1.31, минус в 3 годах из 4
    # Обрезка сверху по порогу (нижняя граница 1.0 остаётся):
    #   3.0 → 83% потока, A +0.04, OOS -0.01, 4 года из 5 в плюсе   ← выбрано
    #   5.0 → 100% потока, A -0.11, OOS -0.20, 3 года из 5
    # Компромисс поток↔эдж: теряем 17% сетапов, OOS с -0.20 до -0.01.
    # 🔑 Урок: «граница отсеивает много» — довод о ЧАСТОТЕ, а не о деньгах.
    # Прежде чем двигать порог ради потока, мерить, что отсеиваемое приносит.
    # 🔴 25.08 ФИНАЛ: 3.0 → 3.234 — ровно та зона, на которой воспроизведён эдж
    # (short + drift30>=10 + зона 1.5-3.234 → PF 4.61, OOS 3.97). Числа выше
    # мерились БЕЗ дрейф-гейта и потому занижены; при живом гейте зона держится.
    max_stop_pct: 3.234
    # 🔴 25.08 НЕСКОЛЬКО СДЕЛОК НА МОНЕТУ (решение Егора). Счёт ведётся ПО СТОРОНЕ:
    # long и short на одной монете — независимые позиции, а не дубль. 0 = без лимита.
    max_per_symbol: 3
    require_gates: true
    # 🔴🔴 25.08 ОБЕ СТОРОНЫ → SHORT ОБРАТНО. Открытие лонга ради данных обошлось
    # дороже, чем выглядело: замер на своей базе (2022-2026, 90 монет) показал, что
    # long не просто «мёртв», он РАЗБАВЛЯЕТ работающий short —
    #   только short, без гейта:  PF 1.20 · OOS 1.17 · +0.37%/сд · сумма +2380
    #   только long,  без гейта:  PF 0.90 · OOS 0.83 · -0.18%/сд · сумма -1743
    #   обе стороны вместе:       PF 1.02 · OOS 0.96 · +0.04%/сд · сумма  +636
    # long + дрейф-гейт + зона:   PF 0.94 · OOS 0.83 · -0.12%/сд — гейт его не спасает.
    # Наблюдение по long набирается 1h-инстансом, где он живой (OOS 1.74), и вахтой
    # [[long_15m_dead_six_axes]] — держать его на 15m ради «данных» не требуется.
    sides: [short]
    max_open: 10             # 🔴 25.08 6 → 10: слоты РИСКА, а поток вырос кратно
    # ЗАЯВОК — резерв маржи, см. пояснение у impulse_fib. Держим ниже 1h-инстанса:
    # 12+8=20 заявок × ~25 VST уже упираются в баланс 451.
    # 🔴 22.08: прежнее обоснование («15m оборачивается быстрее, TTL 3ч против 12ч»)
    # БОЛЬШЕ НЕ ДЕЙСТВУЕТ — TTL выровнен по замеру и теперь тоже 12 ч (48 баров).
    # Слоты оборачиваются вчетверо медленнее прежнего. Маржа при 8 заявках:
    # стоп 3.2% → 49% депо · 2.4% → 67% · 1.5% → 107% (сайзинг от свободной маржи
    # упрётся сам). Поднимать кэп некуда — следим за строкой «заявок 8/8» в логе.
    max_pending: 12          # 🔴 25.08 8 → 12: заявка = маржа, не риск; при стопе 2.4% это ~100% депо VST
    drift_gate:
      # 🔴 25.08 LIVE → SHADOW по решению Егора: «я же просил дать стратегиям дышать!
      # нашли эдж и навешали на него ограничений, получили просев до нуля — и всё это
      # на VST-ПЕСОЧНИЦЕ. Пропустили огромный импульс, который дал бы много данных».
      # Признано справедливым: на песочнице ценность — ДАННЫЕ, а не сохранность депо.
      # Гейт отсекал ~93% времени (89 сд/мес против 606 без него) — это оправдано для
      # РЕАЛЬНЫХ денег, но на VST убивает то, ради чего инстанс и создан: поток.
      # SHADOW: условие пишется в extra_features (ud_*) и в лог «пропустил бы /
      # заблокировал бы», решение по нему принимаем ПОТОМ на накопленных сделках.
      # Ровно так уже работает 1h-инстанс.
      # ────────────────────────────────────────────────────────────────────────
      # 🔴🔴 25.08 SHADOW → LIVE ОБРАТНО. Воспроизведение боевой конфигурации на
      # своей базе (21213 сетапов после трёх гейтов · 90 монет · 2022-2026):
      #   short + drift30>=10 + зона 1.5-3.234  →  PF 4.61 · OOS 3.97 · WR 47% · +4.97%/сд
      #   то же БЕЗ дрейф-гейта                 →  PF 1.24 · OOS 1.28 · WR 20% · +0.48%/сд
      #   обе стороны без гейта (что было в бою)→  PF 1.02 · OOS 0.96 · WR 18% · +0.04%/сд
      # Разница измеренного и того, что стояло в бою: 124× по деньгам на сделку.
      # 🔑 Гейт пропускает 22% сетапов — это ОТБОР, а не удушение. Довод «отсекает
      # 93% времени» был про частоту; про деньги он ничего не говорил.
      # 🔑 И про поток: измеренная конфигурация даёт ~50 сд/мес на 250 пар (~1.7/день).
      # Бот показывал 7 сделок за 3 дня — то есть РАБОТАЛ КАК ИЗМЕРЕН. Малый поток
      # у этой механики — норма, а не неисправность. См. [[gate_threshold_frequency_vs_money]].
      mode: live             # 25.08: live → shadow → live (замер вернул обратно)
      # 🔴 21.08 ПОРОГИ ОСЛАБЛЕНЫ по решению Егора («боюсь зажать поток»).
      # Замер суммы % за месяц (OOS, пересчёт на 250 монет) показал ПЛАТО:
      #   без фильтров: 606 сд/мес, +264%, но без топ-10% МИНУС 680% (всё на хвосте)
      #   d30≥+5 · slope≥+10:  89 сд/мес, +554%, без топ-10% +402%   ⬅ ВЫБРАНО
      #   d30≥+10 · slope≥+20: 77 сд/мес, +558%, без топ-10% +426%
      # Дальнейшее ужесточение даёт +4% суммы ценой −16% потока → не окупается.
      min_drift30: 5.0       # было 10.0
      min_slope180: 10.0     # ВТОРОЕ условие: производная d180 за 30д (разворот цикла)
      sides: [short]
      max_age_days: 3        # данные старше — гейт самоустраняется (fail-open)

    # 🔴 29.08 ВТОРАЯ ДВЕРЬ ВХОДА: цена у скопления стопов (EQH).
    # Замер на 6730 сделках (40 монет, 2023-2026): short в пределах 0.25 ATR от уровня
    # равных хаёв даёт PF 5.06 против 2.40 у чистого дрейф-гейта, безтоп10% +525,
    # охват 64%. Зеркало на long — 0.75 (идёт прямо в стопы), P(перестановка)=0.000,
    # временной OOS train ×1.41 → test ×2.18. Плато порога проверено: 0.1→1.5 ATR PF
    # монотонно 8.35→3.28, то есть 0.25 не подогнан.
    #
    # 🔑 ПОЧЕМУ АЛЬТЕРНАТИВА, А НЕ ДОБАВКА. По годам эта ось и дрейф-гейт — КОНКУРЕНТЫ:
    #   год    только ГЕЙТ         только EQH
    #   2024   2.81 (безтоп +315)  2.19 (+16)
    #   2025   4.37 (+1008)        5.17 (+472)
    #   2026   1.06 (−200)         1.93 (+5)     ← на текущем рынке EQH ЛУЧШЕ гейта
    # Их пересечение в 2026 (1.19) хуже чистого EQH. Поэтому сигнал проходит по ЛЮБОЙ
    # из двух дверей, а в лог пишется, какая сработала.
    #
    # 🔴 Признак появился ТОЛЬКО после переписывания SMC из событий в состояния: раньше
    # `detect_equal_levels` находил 303 события, а в матрицу шёл один флаг с частотой 1.1%.
    # 🔴 НЕ проверено: n=163 в главной клетке (2% выборки), в 2026 у чистого EQH 71 сделка;
    # только 15m; 2023 непроверяем (в бычьем году short почти не торговался).
    # Решение Егора 29.08: ставим как ВТОРОЙ вход и смотрим форвардом, а не заменяем гейт.
    # 🔴🔴 29.08 ИСТОРИЯ ТРЁХ ВЕРДИКТОВ — читать, прежде чем трогать пороги.
    # Признак трижды менял оценку, и каждый раз причина была в РЕАЛИЗАЦИИ, не в рынке:
    #   1) первый замер шёл на ПОЛНОЙ истории (~60k баров), а runner подаёт bars: 1000;
    #   2) перемер боевым окном дал ×1.20 → признак объявлен мёртвым И ЭТО БЫЛО ОШИБКОЙ:
    #      сравнивались РАЗНЫЕ версии. Матрица считает признаки со `shift(1)` (закрытый
    #      бар), а проверочный код смотрел последний. Замер сдвига: 0 → ×1.20 ·
    #      1 → ×3.73 · 2 → ×2.05. Физика: «цена БЫЛА у уровня и уже отходит» = отбой,
    #      «цена У уровня сейчас» = касание, которое ещё может обернуться проколом;
    #   3) на правильной версии порог 0.25 оказался тоже неверным — он был откалиброван
    #      на полной истории, где масштаб набора уровней другой.
    #
    # ФИНАЛЬНЫЙ ЗАМЕР (боевое окно 1000, сдвиг 1, база `гейт+short` PF 2.40, n=939):
    #   порог    n    PF   подъём  безтоп10%   2024      2025      2026
    #   0.25     99  8.67  ×3.61     +547      мало    12.3(64)    мало
    #   0.50    196  7.05  ×2.94     +915    13.2(38)   9.0(124)   мало
    #   1.00    310  5.39  ×2.25    +1066     8.5(67)   7.3(180)  1.4(38)   ⬅ ВЫБРАНО
    #   1.50    424  4.24  ×1.77    +1076     7.1(77)   7.5(223)  0.8(70)
    # Плато монотонное — порог не подогнан. На 1.0 ATR выборка втрое больше, деньги
    # максимальны, и ВСЕ измеримые годы положительны, включая 2026 (единственный признак
    # смены с таким свойством). Зеркало long+EQH — 1.08 при базе long 1.04, то есть
    # правило одностороннее. Перестановка P=0.000, охват 15/24 монет.
    # 🔴 НЕ проверено: 2023 непроверяем (в бычьем году short почти не торговался);
    # только 15m; n=310 это 33% сделок гейта — решение на средней выборке.
    eqh_entry:
      enabled: true
      tolerance_atr: 1.0     # 🔴 НЕ 0.25: та калибровка сделана на полной истории
      sides: [short]         # long у тех же уровней не даёт подъёма — правило одностороннее
      confirm_bars: 3        # = eq_len детектора: пивот помечается только через 3 бара

