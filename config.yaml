    # 🔴 20.08 impulse_fib: выход по конструкции ФИКСИРОВАННЫЙ. БУ, трейлинг и частичная
    # фиксация измерены на этой механике — каждый забирает от 7 до 25% дохода: WR растёт,
    # деньги падают ([[backlog_impulse_session_19_08]]). 75% прибыли даёт не достижение
    # цели, а ход к ней за 96 часов — трейлинг обрубает ровно эту часть.
    # 99.0 = практическое отключение: цель по конструкции RR 7-13, до 99R не дойдёт
    # (DEV-220 активирует при R ≥ порог×0.5 = 49.5R — тоже недостижимо).
    impulse_fib: 99.0
    # 🔴 22.08 БЛИЗНЕЦ 15m БЫЛ ПРОПУЩЕН → TSL включался у него с +1R и обрубал ход к цели,
