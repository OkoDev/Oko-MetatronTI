  # ⚠️ ДВА РАЗНЫХ ГЕЙТА С ПОХОЖИМИ ИМЕНАМИ (разведено аудитом 13.08.2026 — НЕ путать):
  #   market_stress_gate  → HARD-блок, ARCH-42, читает register_gates.py:61 (весь словарь)
