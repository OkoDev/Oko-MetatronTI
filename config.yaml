# ════════════════════════════════════════════════════════════════════════════
# SMC — источник структуры (ARCH-137.5, 02.09.2026)
#   structure_canon: true  → detect_structure берёт сломы из ДВУХСЛОЙНОГО эталона
#                            oko_sm_engine.run_structure(swing_len=50, internal_len=5):
#                            структура и микроструктура одновременно, раздельные
#                            trend / itrend, у каждого события флаг `internal`.
#   structure_canon: false → откат на прежнюю реализацию _detect_breaks (один слой).
#
#   Почему переключено: прежняя метила тип как `if trend==BULLISH: BOS else: CHoCH`,
#   а тренд не определялся в 45% случаев (NEUTRAL 34.4% + None 10.8%) — и все они
#   молча становились CHoCH. BOS/CHoCH было 29/71 против канонических 54/46
#   у эталона на ТОЙ ЖЕ длине 5. После правки: 55/45 на 1h, 53/47 на 15m.
# ════════════════════════════════════════════════════════════════════════════
smc:
  structure_canon: true
  # fvg_canon: true → зоны из эталона smc_engine.detect_fvg (LuxAlgo-порт).
  #   Причины расхождения измерены 02.09 (16 пар, 1h/400):
  #     · условие close импульсной свечи — 1 зона из 1292 (0%), не влияет
  #     · mitigation: эталон по CLOSE за дальней границей, прежняя по фитилю —
  #       расходятся на 9% зон (согласие 91%)
  #     · 🔑 ПОРОГ — главное: эталон адаптивный (средний |gap%| × 2), прежний
  #       ФИКСИРОВАННЫЙ 0.05%. Эталон отсекает 578 зон против 187 — строже втрое.
  #   Почему адаптивный верен: 0.05% на BTC и на мем-коине — разная значимость.
  #   Это закон проекта об ОТНОСИТЕЛЬНОМ пороге, а не вкусовщина.
  #   Эффект: всего зон 834 → 536, активных bull 129 → 150, bear 11 → 15.
  fvg_canon: true
  # ob_canon: true → Order Blocks из эталона smc_engine (LuxAlgo ob_coord).
  #   Это НЕ баг, а два определения: эталон берёт «спокойную» свечу (размер < 2×ATR200)
  #   с ЭКСТРЕМУМОМ в интервале [свинг..пробой]; прежняя — последнюю ПРОТИВОТРЕНДОВУЮ
  #   свечу (ICT). Одну и ту же свечу выбирают лишь в 13% случаев (343 слома, 16 пар).
  #   Обрезка lookback=10 не влияет вовсе (0 из 343) — проверено отдельно.
  #   🔑 Почему эталон: chart_builder.py:297 и structure_terminal РИСУЮТ эталон —
  #   на графиках виден он. А smc_snapshot (ML-сфера 4) и cascade_tsl (боевой TSL)
  #   работали на прежней. Смотрели на одни зоны, торговали по другим.
  #   Эффект: активных bull 33 → 89, bear 1 → 3 (прежняя гасила по фитилю, эталон по close).
  ob_canon: true
  # eq_canon: true → сводка EQH/EQL строится поверх эталонных уровней
  #   smc_engine.detect_equal_levels (соседние ПИВОТЫ, допуск 0.1×ATR — адаптивный).
  #   🔴 Прежняя логика сравнивала ВСЕ high с ВСЕМИ в окне 50 баров при фиксированном
  #   допуске 1% — то есть спрашивала не «есть ли равные вершины», а «ходила ли цена
  #   в коридоре 1%». Замер 02.09 (16 пар): eqh_near=True у 75% пар на 1h и у 100%
  #   на 15m; «плотность кластера» 320 и 906 пар баров. Признак был ВЫРОЖДЕН —
  #   как CHoCH до этой же задачи. Эталон даёт 4.4 пары уровней на 1h.
  #   На эталоне уже стоят боевой IMPULSE-FIB, chart_builder и structure_terminal.
  eq_canon: true
  # swings_canon: true → raw-пивоты берутся у эталона (smc_engine._swings_luxalgo).
  #   Причина: сломы уже эталонные, а свинги оставались прежние — и fibonacci.py:190-191
  #   брал ПРОБИТЫЙ свинг у эталона, а предыдущие экстремумы у прежней реализации,
  #   то есть строил диапазон между точками РАЗНЫХ детекторов.
  #   Сверка (12 пар, 1h/400): major(50) эталона прежняя находила на 89%, minor(5) на 59%.
  #   Конвейер после пивотов не тронут: чередование, классификация HH/LH/HL/LL, тренд.
  swings_canon: true
