  # Значения = прежние дефолты кода → поведение НЕ меняется, но теперь ими можно управлять.
  market_stress_gate:
    enabled: false
    sl_threshold: 5
    window_minutes: 30
  market_stress:
    window_minutes: 30
    sl_threshold: 5
  # 🛑 ПРЕДОХРАНИТЕЛЬ (13.08.2026) — пауза ИСТОЧНИКА после серии убытков подряд.
  # Замер на РЕАЛЬНОЙ боевой базе (19 039 закрытых сделок с exchange_order_id):
  #   без предохранителя −4462.6%  ·  с ним −201.7%  →  спасено +4260.9% (95% убытка)
  # Спасено по источникам: wt_sideways +815 · arch104 +739 · oko_ote +466 ·
  #   confluence +460 · watch_list_breach +434 · atr_change +426 · pivot_reversal +419.
  # Мотив: ote_nested отработал ДВЕ недели (PF 2.69, +864%) и умер (PF 0.53, −752%),
  # а бот лил его ещё месяц — выключателя не было.
  # НЕ дублирует: pair_cooldown_streak = SOFT и по ПАРЕ; circuit_breaker поднимает
  # min_strength, а не останавливает (0 срабатываний за 96 дней); sl_cooldown без серии.
  # enabled: false — включать осознанно, гейт HARD и режет поток.
  # ГРАНУЛЯРНОСТЬ: пауза ставится на ИСТОЧНИК целиком (все его монеты), а не на пару.
  # Это осознанно — механика ломается ЦЕЛИКОМ (ote_nested умер весь сразу, не по монетам).
  # Замер трёх вариантов (3 убытка → 72ч): по источнику спасает +3999% (взято 7% сделок),
  # по паре +1173% (81%), источник+пара +982% (89%). Пара мягче, но спасает ВТРОЕ меньше.
  # 🔴 ПОДБОР streak ЗАВИСИТ ОТ ТОГО, ЕСТЬ ЛИ ГЕЙТ СТОПА — мерить надо ПОВЕРХ него:
  #   на СЫРОМ потоке (без гейта): 3 → +3999% · 4 → +4009% · 5 → +4165% ← казалось лучшим
  #   ПОВЕРХ гейта стопа (как в бою сейчас, 87 дней, n=1099, база 12.63 сд/день PF 0.77 −882%):
  #     streak=5 → 6.99 сд/день · PF 1.03 · −182%   (частота −45%, профит +700 п.п.)
  #     streak=4 → 5.80 сд/день · PF 1.18 · −39%    (частота −54%, профит +843 п.п.)
  #     streak=3 → 4.94 сд/день · PF 1.37 · **+74.5%** (частота −61%, профит +956 п.п.) ← ЕДИНСТВЕННЫЙ В ПЛЮС
  # Гейт стопа уже отсёк мусор → на очищенном потоке агрессивная пауза работает ЛУЧШЕ.
  # Урок: параметр защиты подбирать в связке с остальными гейтами, а не на сырой базе.
  loss_streak_halt:
    # 19.08 ВКЛЮЧЁН вместе с выпуском choch_wavec в бой. Контрфакт на боевой базе:
    # «3 убытка подряд → пауза 72ч» превращал −4463% в −202%, спасено +4261%
    # (memory/live_no_circuit_breaker_cost_95pct_loss). ote_nested работал ДВЕ НЕДЕЛИ
    # и умер — без предохранителя это повторится с любым источником, включая новый.
    enabled: true
    streak: 3
    # 🔴 22.08 ПЕРЕМЕР ОТМЕНИЛ ПРЕЖНЮЮ ТРАКТОВКУ. Решение Егора: «loss_streak_halt для
    # наших механик выключить, 72 часа это слишком много для крипты и VST».
    # Замер на боевой базе (13 821 закрытая сделка с exchange_order_id, 2026):
    #   вся база                    n=13821  ср −0.186%
    #   вырезала бы пауза 72ч       n=13269  ср −0.184%   ← 96% ВСЕЙ ТОРГОВЛИ
    #   вырезала бы пауза 12ч       n=12134  ср −0.172%   (ЛУЧШЕ базы — режет хорошее)
    #   вырезала бы пауза 6ч        n=11119  ср −0.189%   ← единственное окно хуже базы
    # 🔑 Вырезаемое статистически НЕ ОТЛИЧАЕТСЯ от базы → пауза не отбирает плохие
    # сделки, она просто ОСТАНАВЛИВАЕТ ТОРГОВЛЮ. Прежнее «спасено +4261%» означало
    # ровно это: убыток исчезал вместе с 96% сделок, а не благодаря селекции.
    # Отдельно видно на ote_nested: его вырезаемая паузой 72ч часть даёт +124.5% —
    # предохранитель срезал бы ПРИБЫЛЬ.
    pause_hours: 6         # было 72
    # 🔴 streak: 0 = ВЫКЛЮЧЕНО (gates/loss_streak_halt.py: `if streak <= 0 → pass`).
    # Выключено для механик, у которых выход и серия убытков — ЧАСТЬ КОНСТРУКЦИИ,
    # измеренная в замере: там нет никакого предохранителя, и эдж посчитан без него.
    # У impulse_fib_15m это особенно остро: дрейф-зона открыта редко, три SL подряд
    # при WR 57% — рядовое событие, и пауза глушила бы стратегию внутри её же зоны.
    per_source:
      impulse_fib:     {streak: 0}
      impulse_fib_15m: {streak: 0}
      choch_wavec:     {streak: 0}
      rangefade:       {streak: 0}
      rangefade4h:     {streak: 0}
      bigflush15:      {streak: 0}
      atr_s2:          {streak: 0}
      radar:           {streak: 0}
