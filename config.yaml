    wt_signal:         {min_strength: 70, exchange_enabled: false, trade_mode: ""}  # 13.06 VST OFF: avgR −0.42 убыточен в VST (DS-аудит 13.06.2026). SIM копится. Вернуть после разбора DISSECT-спринта.
    wt_b_signal:       {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
