telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: '428163099'
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
    bingx_vst:
      api_key: ${BINGX_VST_API_KEY}
      secret: ${BINGX_VST_SECRET_KEY}
analysis:
  volume_multiplier: 4.0
  price_threshold: 3.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 60.0
      os_threshold: -60.0
    trend:
      atr_period: 43
      factor: 1.25
  signals:
    min_signals: 2
    single_signal_min_strength: 54
    min_confidence: 0.55
    min_confidence_by_type:
      wt_b_signal: 0.5
      wt_signal: 0.52
      pivot_reversal: 0.52
      confluence: 0.58  # DEV-149: 0.68→0.58, ML блендинг срезал до 0.53-0.60
      mtf_bias: 0.55
      trend_signal: 0.55
      anomaly: 0.6
    premium_pairs:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - ADA
    - DOGE
    - DOT
    - MATIC
    - AVAX
  wt_b:
    enabled: false  # DATA-10.04: WR<10%, avgR -0.7..-1.1R, все комбо убыточны
    div_min: 3.0
    div_max: 20.0
    lookback: 35
  divergence:
    pivot_proximity_pct: 0.5
  anomaly:
    max_per_cycle: 5
  confluence:
    enabled: true
    use_state_machine: false
    lookback_bars: 8
    cross_fresh_bars: 5
    min_strength: 60
    wt_os_threshold: -60.0
    wt_ob_threshold: 60.0
    pivot_touch_pct: 0.15
    div_min_bars: 9
    max_per_cycle: 10
    dynamic_os_enabled: false
    dyn_os_k: 1.2
    dyn_os_window: 50
    4h_gate_enabled: false
    pivot_proximity_pct: 0.2
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5
database:
  path: subscriptions.db
  backup_interval: 24
monitoring:
  check_intervals:
    divergences_every_n_cycles: 5
    background_every_n_cycles: 3
    cascade_div_every_n_cycles: 60
outcome_predictor:
  training_window: null
strategy_name: multi_signal
trading:
  execution_mode: vst
  tp1_close_pct: 0.2
  deposit_usdt: 110.0
  risk_pct: 0.5
  leverage: 5
  regime_direction_block:
    enabled: true
    TREND_DOWN: LONG
    TREND_UP: SHORT
  blocked_regimes: []  # DEV-149: HIGH_VOL → фильтр по min_strength_by_regime вместо глобального блока
  pivot_proximity_filter:
    enabled: true
    hard_block_mult: 2
  pivot_touch_staleness:
    enabled: true
    staleness_bars: 5
    score_penalty: -10
  future_pp_score_modifier:
    enabled: true
  market_event_marker:
    enabled: true
    sl_count: 5
    window_minutes: 30
  market_stress_gate:
    enabled: false
    sl_threshold: 5
    window_minutes: 30
  phase_guard_enabled: false
  weekly_bias_filter:
    enabled: true
    soft_penalty: 25
    hard_block_ctx_score: 3
    near_level_pct: 1.5
  pivot_reversal_bias:
    enabled: false
    against_bias_penalty: 20
    near_level_pct: 1.5
  l3_checker:
    enabled: false
    min_score: 85
    max_open_long: 2
    max_open_short: 2
    max_open_total: 4
  correlation_groups:
  - - PAXG
    - XAUT
  - - BTC
    - WBTC
  - - ETH
    - STETH
    - WETH
  entry_timeframe: 15m
  bounce_mode:
    enabled: false
    max_bounces: 2
    min_trend_strength: 50
    cooldown_sec: 300
    scalp_atr_multiplier: 1.0
  active_strategy: wt_entry
  active_strategies:
  - wt_entry
  - reversal
  - trend_following
  - pivot_reversal
  - multi_signal
  - mtf_bias
  strategies:
    wt_entry:
      min_strength: 60
      tp_rr: 3.0
      sl_buffer_pct: 0.3
      tsl_max_dist: 3.0
      tsl_min_dist: 0.6
    reversal:
      min_strength: 70
      min_confidence: 0.6
      conflict_margin: 0.15
      tp_rr: 3.0
    trend_following:
      min_signals: 2
      min_strength: 55
      min_confidence: 0.55
      conflict_threshold: 0.25
      tp_rr: 3.0
    multi_signal:
      min_signals: 2
      conflict_threshold: 0.3
    conservative:
      min_signals: 3
      min_confidence: 0.65
    pivot_reversal:
      min_strength: 60
      tp_rr: 3.0
  btc_market_gate:
    enabled: true
    shadow_mode: true
    block_short_in_uptrend: false
  verdict_gate:
    enabled: true
    smc_block_confidence: 0.65
    wt_exhaustion_confidence: 0.65
    strength_boost: 5.0
    strength_penalty: -10.0
  range_bounce:
    enabled: false
    sl_buffer_pct: 0.003
    min_tp_r: 3.5
    max_sl_dist_pct: 0.02
  dual_tp:
    enabled: true
    tp1_fix_pct: 30
  use_tsl: true
  tsl_activation_r: 1.0
  tsl_min_move_pct: 0.15
  tsl_activation_r_range: 0.7
  cascade_tsl: true
  cascade_tsl_deescalation_r: 2.5
  cascade_tsl_opts:
    cap_tf_after_tp1: 1h
    no_degrade_above_r: 3.0
    r_gradient_peak_min_r: 2.0
    r_gradient_rollback_pct: 0.75
  use_breakeven: false
  use_be_after_tp1: false
  expired_extend_min_r: 5.0
  expired_extend_hours: 120
  expired_management:
    tsl_convert_min_r: 1.5
    tsl_convert_regimes:
    - TREND_UP
    - TREND_DOWN
  max_positions_per_direction: 0
  sl_tp:
    atr_multiplier: 1.0
    sl_min_pct: 0.5
    sl_max_pct: 3.0
    tp_fallback_rr: 3.0
    max_rr: 3.0
    max_rr_range: 2.5
    require_pivot_tp: false
    tp_pivot_min_r: 3.0
    tp_pivot_min_r_range: 1.2
    tp_reversal_min_r: 3.0
    tp_partial_pct: 0.2
    atr_dynamic: true
    atr_expand_threshold: 1.3
    atr_contract_threshold: 0.8
    struct_sl_buffer_pct: 0.3
    struct_sl_max_dist: 2.0
    tsl_too_tight_pct: 1.0
market_regime:
  use_v2: false
trigger_bus:
  shadow: false
  cascade_min: 3
  interval_sec: 120
event_bus:
  enabled: true
  shadow: false
  cooldown_minutes: 30
  max_concurrent: 3
  btc_macro_shock_pct: 2.5
signal_quality:
  sl_cooldown_hours: 2.0
  dedup_minutes: 30
  min_volume_usd: 0
  min_strength: 50
  min_strength_register: 50  # DEV-149: было 63 — съедал ~40% валидных, возврат к прежнему уровню
  min_strength_wl_breach: 45
  pivot_reversal_max_strength: 79
  ote_shadow_mode: true
  ote_zone_tfs:
  - 1h
  - 4h
  - 1d
  ote_scalp_zone_tfs:
  - 15m
  ote_scalp_trigger_tf: 3m
  min_strength_by_regime:
    RANGE: 60       # DEV-149: 70→60, слишком агрессивный фильтр в RANGE
    HIGH_VOL: 75    # DEV-149: 80→75, HIGH_VOL больше не в blocked_regimes
  signal_regime_block:
    pivot_reversal:
      blocked_regimes: []
      blocked_combos:
      - direction: LONG
        regime: TREND_DOWN
      - direction: SHORT
        regime: TREND_UP
      # HIGH_VOL разблокирован: LONG +0.069R, ранее заблокирован ошибочно
      - direction: LONG
        regime: TREND_UP    # DATA-10.04: -0.642R (58 сделок)
      - direction: SHORT
        regime: HIGH_VOL    # DATA-10.04: -0.955R (7 сделок)
    confluence:
      blocked_regimes: []
      blocked_combos:
      - direction: LONG
        regime: TREND_DOWN
      - direction: SHORT
        regime: TREND_UP
      - direction: SHORT
        regime: HIGH_VOL    # -1.237R (31 сделок) — оставляем
      # LONG HIGH_VOL разблокирован: +0.482R (12 сделок)
      - direction: LONG
        regime: TREND_UP    # -0.313R (62 сделки) — оставляем
      - direction: LONG
        regime: RANGE       # DATA-10.04: -0.289R (97 сделок!)
      - direction: SHORT
        regime: RANGE       # DATA-10.04: -0.297R (64 сделки)
    wt_signal:
      blocked_regimes: []
      blocked_combos:
      - direction: LONG
        regime: TREND_DOWN
      - direction: SHORT
        regime: TREND_UP
  weekly_bias_gate:
    enabled: true
    shadow_mode: false
  counter_trend_strength_threshold: 30
  btc_filter_enabled: false
  btc_filter_mode: shadow
  watch_list_ttl_hours: 4
  watch_list_breach_pct: 0.8
  wl_sl_buffer_pct: 0.5
detectors:
  anomaly:
    min_bars: 20
    volume_ma_period: 20
    volume_ratio_threshold: 3.0
    strength_trend_multiplier: 12
    strength_counter_multiplier: 8
performance:
  scan_semaphore_size: 10
  analyze_semaphore_size: 3
  prefetch_pivots_semaphore_size: 2
  background_check_semaphore_size: 5
  cascade_div_semaphore_size: 3
  api_rps: 15
  api_semaphore_size: 10
  ohlcv_scan_limit: 161
  ohlcv_slow_threshold_sec: 8.0
  divergence_slow_threshold_sec: 3.0
  pair_slow_threshold_sec: 10.0
  scan_cycle_warning_threshold_sec: 70.0
strategy:
  name: multi_signal
  multi_signal:
    min_signals: 2
    conflict_threshold: 0.3
    signal_weights:
      mtf_alert: 0.3
      mtf_bias: 0.3
      pivot_reversal: 0.2
      divergence: 0.15
      wt_signal: 0.1
      trend_signal: 0.1
      anomaly: 0.05
      pivot_alert: 0.15
      confluence: 0.35
  mtf_bias:
    min_strength: 60
    require_confluence: false
  conservative:
    min_signals: 3
    min_confidence: 0.65
    conflict_threshold: 0.2
ml:
  use_outcome_predictor: false
future_pivots:
  enabled: false
  broadcast_tg: false
  ttl_sec: 1800
  confluence_threshold_pct: 0.5
  pre_alert_pct: 1.0
