# ════════════════════════════════════════════════════════════════════════════
# WS-ПОТОК РЫНКА
#   S2 WSFeed.
# ════════════════════════════════════════════════════════════════════════════
market_ws:
  # 02.09.2026 ВКЛЮЧЁН В SHADOW (решение Егора). Наблюдатель, НЕ источник данных:
  #   enabled: true  + use_ws: false → WS подписывается и считает, scan работает на REST
  #   enabled: true  + use_ws: true  → scan читает из WS (следующий этап, после проверки)
  # 🔴 use_ws ОБЯЗАН остаться false, пока не подтверждены: отсутствие банов,
  # покрытие ≥99% и стабильный rate. Переключение — отдельное решение.
  enabled: true
  # 02.09 03:23-04:16 проба use_ws:true, откачено. ЧТО ИЗМЕРЕНО ЧЕСТНО:
  #   🟢 hit 3m 27→90%, 5m 21→82%, REST за цикл 2711→1869 (−31%),
  #      merge чистый: stale 1-5 из 180 000. Данные WS даёт хорошие.
  #   ⚪ цикл скана: 990 с, затем один незавершённый >2100 с — ВСЕГО ДВА цикла.
  #
  # 🔴 МОЯ ОШИБКА АТРИБУЦИИ, исправлена сразу: я связал деградацию с
  # `[DEV-227] force REST refresh (stale-guard)`, увидев его рядом в логе. Проверка
  # по часам показала обратное — форсированных обновлений было БОЛЬШЕ ДО WS:
  #   21ч 355 · 22ч 391 · 23ч 554 · 00ч 570 · 01ч 589 · 02ч 594 · 03ч (WS live) 392.
  # И сам цикл плавает без всякого WS: 374 · 410 · 446 · 509 · 578 · 901 · 961 · 1890 с.
  # На фоне такого разброса ДВА цикла ничего не доказывают ни в одну сторону.
  #
  # 🔑 Откат оставлен в силе не потому, что WS «сломал», а потому что доказательств
  # пользы для ЦИКЛА нет, а риск на живом боте есть. Чтобы решить честно, нужен
  # длинный замер (≥6 циклов подряд в каждом режиме) и метрика поустойчивее
  # длительности цикла — например, медиана времени OHLCV на пару.
  # 🔬 02.09 19:15 ПРОБА №2 (Егор: «WS проверить»). Первая проба 03:23-04:16
  # была неубедительной: всего 2 цикла, и в те же минуты latency выросла втрое —
  # эффект утонул. Сейчас впервые есть ЧИСТАЯ база: прокси дали медиану 318 с
  # при стабильных 15/30/40, выбросы latency ушли в ноль.
  # Ожидание: REST −31% (2711→1869) → цикл ~220 с вместо 318.
  # 🔴 ОТКАТ (вернуть false) при ЛЮБОМ из: hit по ТФ < 70% · рост stale в merge
  # per TF · цикл не улучшился за 2 прогретых цикла · расхождение цен с REST.
  use_ws: true
  # Только младшие ТФ: их TTL (3m — 180 с, 5m — 300 с) КОРОЧЕ цикла скана (400-960 с),
  # поэтому запись протухает 3-5 раз внутри одного прохода и даёт 63% всех REST.
  # 15m (TTL 1800 с) пока оставлен на REST — там hit и так 81%.
  # 02.09 19:55 добавлен 15m (Егор: «давай проверять»).
  # Замер показал, что поток НЕ пропорционален частоте бара: 5m дал 162 542
  # сообщения, 3m — 158 025, то есть поровну, хотя 3m-баров закрывается втрое
  # больше. WS шлёт обновление на КАЖДОЕ изменение свечи. Значит каждый новый ТФ
  # добавляет ~90 сообщ/с (сейчас 182 на два ТФ), а не пропорционально частоте.
  # 15m — это entry_tf, основной рабочий: снимает ~109 REST-запросов за цикл.
  # 🔴 Ограничитель — reader: если очередь q начнёт расти монотонно, merge
  # не успевает за потоком → убрать 15m обратно.
  # 02.09 20:20 — 15m ВЕРНУЛСЯ. Откат в 20:16 был ОШИБОЧНЫМ, оба довода не устояли:
  #
  #   ❌ «обработка выросла 16.9 → 24.2 с» — метрика СМЕЩЁННАЯ: это медиана `total`
  #      по МЕДЛЕННЫМ парам, а их состав меняется от цикла к циклу. Честная метрика —
  #      длительность цикла, и она говорит обратное:
  #        с 15m    955.6 с (первый после рестарта, холодный кэш) → 255.6 с ← ЛУЧШИЙ за день
  #        без 15m  311.3 · 281.5 с
  #
  #   ❌ «stale 55 = торгуем по устаревшим свечам» — НАОБОРОТ. По коду merge_dict:
  #        if new_last_t < cache_last_t: return "stale"
  #      то есть отбрасывается ПРИШЕДШАЯ свеча, потому что в кэше УЖЕ СВЕЖЕЕ.
  #      Это защита. На 15m их больше просто потому, что по нему параллельно идёт
  #      REST-форсирование позиций (stale-guard) — оно пишет бар, WS приходит следом.
  #
  # 15m — entry_tf, снимает ~109 REST-запросов за цикл.
  # 🔴 Настоящий критерий отката: РОСТ очереди reader (merge идёт в главном процессе).
  # При 280 сообщ/с очередь держалась q≈0-13 — запас есть.
  timeframes:
  - 3m
  - 5m
  - 15m
  batch_pairs: 50

# ════════════════════════════════════════════════════════════════════════════
# ПРОКСИ
#   для обхода гео-ограничений бирж.
# ════════════════════════════════════════════════════════════════════════════
proxy_pool:
  # 🔀 ПЕРЕКЛЮЧАТЕЛЬ ПРОКСИ (Егор 16.07): enabled = вкл/выкл. Прокси-адреса живут в .env →
  # PROXY_LIST (url1,url2,... — пароли НЕ в git). Логика ЧЕСТНАЯ (config_loader.proxy_active):
  #   enabled:true  + PROXY_LIST заполнен  → ПРОКСИ + farm-профиль (30 конн, 40rps)
  #   enabled:true  + PROXY_LIST пуст (не оплачены) → авто-щадящий direct (канал не душим)
  #   enabled:false → всегда щадящий direct (~8 конн)
  # Оплатил прокси → вписал в .env PROXY_LIST + enabled:true. Кончились → enabled:false (или пусто).
  #
  # 02.09.2026 ВКЛЮЧЁН: 3 ISP-прокси Сингапура, оплачены до 02.12.2026.
  #   подсети 192.147.176/177/179.0/24 — ТРИ РАЗНЫЕ /24 (у прежних все три были в ОДНОЙ)
  #   латентность 1360-1422 мс против 1297 direct = +5-10% за лишний хоп (замер 02.09)
  #   взамен накопительный троттлинг BingX делится на 3 IP, а он стоит дороже:
  #   0% выбросов >8с в первые 10 мин против 40% после 30 минут работы процесса.
  # Проверка пула: python scripts/proxy_check.py --live
  enabled: true
  proxies: []              # можно и сюда список, но лучше .env PROXY_LIST (не в git)
  rps_per_proxy: 35.0
  health_cooldown_sec: 30.0
  overrides:
    # 🔴 Прокси меняют выходной IP, но трафик идёт через ТОТ ЖЕ домашний канал —
    # шире он не становится. 16.07 на этом обожглись: 30 коннектов = сатурация линии,
    # таймауты BingX, CancelledError на load_markets (коммит c757b48).
    # Поэтому профиль поднят ЧАСТИЧНО: 12/20 вместо целевых 15/30.
    # Подняли до целевых — только после 2-3 чистых циклов без таймаутов.
    # 02.09 18:30 — МАКСИМУМ, выверенный замером (Егор: «выверь максимальные настройки»).
    #
    # Что мерили, а не предполагали:
    #   фактический rps     3.6 медиана / 5.3 по циклу — ПРИ РАЗРЕШЁННЫХ 40
    #   CPU процесса        44% одного ядра (2.8% из 16) — запас ×2 до GIL-потолка
    #   latency прокси      1797 мс медиана; 4 ТФ подряд ≈ 7 с только сети
    #   время на пару       575 пар / 437 с при семафоре 15 ≈ 11 с
    #
    # Вывод: держал НЕ api_rps и НЕ семафор API (их не выбирали и вполовину),
    # а scan_semaphore — сколько пар идёт одновременно. Внутри пары запросы к ТФ
    # последовательны, поэтому пара занимает ~11 с, и параллельных запросов просто
    # не набирается до лимитов.
    #
    # Проверка на бан: 60 rps ÷ 3 IP = 20 rps на адрес. Бан 100410 ловили при
    # 100 rps на один IP (15.06) — пятикратный запас.
    # 🔴 Откат при таймаутах/CancelledError/росте 100410: 15/30/40, затем 12/20.
    # 🔴 18:50 ОТКАТ к 15/30/40. Разгон до 25/50/60 ПРОВЕРЕН И НЕ РАБОТАЕТ:
    #   параллелизм ×1.67 (15→25)  →  latency ×1.78 (1828→3250 мс, p90 4453→8110)
    #   пропускная ×0.94 — даже УПАЛА. Циклы 652 и 685 с против медианы 400 на 15/30.
    # Значит узкое место НАСЫЩЕНО и оно ОБЩЕЕ для всех трёх прокси: будь дело
    # в per-IP лимите биржи, latency при трёх адресах так расти не могла бы.
    # Общее у них одно — домашний канал.
    # 🔑 Практическое следствие: покупка ещё прокси НЕ ускорит скан. Рычаги
    # остаются два — сократить число запросов (WS на 3m/5m: −63%) или сменить
    # канал/вынести бота на VPS.
    api_rps: 40
    scan_semaphore_size: 15
    api_semaphore_size: 30

