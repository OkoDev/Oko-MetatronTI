  min_strength: 60          # минимальный strength для регистрации

trading:
  execution_mode: vst
  # OPS-06 (12.06.2026): LIVE-GUARD таймаут. Симулятор (trade_simulator) детектит SL/TSL hit на
  # exchange-managed сделке → трекает время в _live_guard_first_detect (НЕ закрывает БД сам — это
  # плодило orphan). Закрытие — в position_sync._emergency_close_check (есть состояние биржи): если
  # биржа ДЕРЖИТ позицию + прошло N мин → market close РЕАЛЬНОЙ позиции + БД (orphan-prevent). Доп.
  # триггер к dev185_2 overshoot: ловит «биржевой SL не сработал, overshoot мал». Цикл=60с → 7=7циклов.
  live_guard_timeout_min: 7
  # EXEC-WS (12.06.2026): real-time user-data WS (order/account push) → лечит рассинхрон
  # БД↔биржа в корне (надёжный exch_id, мгновенный sync). 1 соединение/аккаунт (не per-pair)
  # → scan_loop НЕ затронут. Включать поэтапно после проверки логов [EXEC-WS].
  exec_ws:
    enabled: true         # Шаг 1 (12.06): запуск UserDataStream — события в лог [EXEC-WS]
    write_exch_id: false  # ОТКАТ 12.06: маппинг symbol+dir+свежайшая НЕВЕРЕН (писал orderId в чужие старые сделки). Нужен точный маппинг по qty+время. Шаг 2 после фикса.
    sync_close: false     # Этап 2b (позже): sync БД при ACCOUNT_UPDATE pa=0
  # ⚡ PERF (DS 12.06, внедрено 13.06): срез direct-REST → лечит бан 100410.
  # Корень: repair_missing_sl/tp каждые 60с × 47 биржевых сделок = ~150 direct-вызовов/мин.
  open_orders_global: true          # #1 глобальный get_open_orders (per-account, без symbol) → −90% вызовов. Откат: false
  open_orders_cache_ttl_sec: 10     # без изменений (force=True путь точечный)
  positions_cache_ttl_sec: 45       # #2 было 15. НЕ 60 — чтобы не совпасть с циклом 60с (детект закрытий). Откат: 15
  balance_cache_ttl_sec: 120        # #3 было 30. Баланс не влияет на закрытия. Откат: 30
  # ⚡ PERF-LOOP-DRIFT шаг B (13.06): выделенный торговый event loop (изоляция от scan-нагрузки).
  # Шаг 1 = только инфраструктура (loop пустой). Подключение торговых вызовов — шаги 2+.
  # Включать ТОЛЬКО после шага 2 (REST→торг.loop, DB-write→очередь в main). Откат: false.
  dedicated_loop: true              # ⚡ АКТИВИРОВАН 13.06 — VST-наблюдение. Откат: false. docs/PLAN_PERF_LOOP_DRIFT_B.md
  sl_limit_buffer_pct: 1.0  # DEV-185 (26.04.2026): 0.0→1.0. Корень catastrophic slippage: STOP_MARKET без буфера. Расследование: 121 сделок overshoot ≥0.5% = -465R. Buffer 1% защитит ~51 сделку (-113R экономии). Risk: non-execution при overshoot >1% — позиция повисит до TP/EXPIRED/manual. Через 48ч мерить p90 overshoot, при ОК → 2.0 + watchdog. Откат: sl_limit_buffer_pct: 0.0
  # DEV-185.2 (27.04.2026): emergency watchdog для STOP-LIMIT non-execution.
  # Подтверждение из боя: #8010 APE 26.04 — overshoot 32.7% R=-11.83 за 3ч (limit-ордер не fill, позиция висла).
  # Watchdog проверяет каждый цикл sync_positions (60s): если current_price ушла за SL > overshoot_threshold
  # и удерживается > dwell_seconds → emergency market close.
  # Откат: dev185_2_emergency_enabled: false
  dev185_2_emergency_enabled: true
  dev185_2_overshoot_threshold_pct: 0.5    # цена за SL > 0.5% от entry → старт таймера
  dev185_2_dwell_seconds: 300              # 5 минут удержания → emergency close
  tp1_close_pct: 0.2
  deposit_usdt: 100.0
  risk_pct: 1.0
  leverage: 5
  regime_direction_block:
    enabled: false  # 14.04: убран — режимный классификатор ненадёжен, блокирует прибыльные входы
    TREND_DOWN: LONG
    TREND_UP: SHORT
  blocked_regimes: [HIGH_VOL]  # P1.5 24.04: откат DEV-149 — HIGH_VOL режим статистически убыточен
