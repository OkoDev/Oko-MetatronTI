  btc_market_gate:
    enabled: true
    shadow_mode: true               # DEV-237 30.05: shadow (было false). BTC флэт +0.51%/48ч метится BEAR (Supertrend streak 17 баров) → блок LONG → paper. Тест 24-48ч возврата потока. Откат: false
    block_short_in_uptrend: true    # ARCH-78: блок SHORT при BTC BULL
    counter_trend_min_strength: 75  # SHORT при BTC BULL требует strength >= 75
    reversal_exception: true        # pivot_reversal всегда проходит (разворот у уровня)
  verdict_gate:
    enabled: true
    smc_block_confidence: 0.65
    wt_exhaustion_confidence: 0.65
    strength_boost: 5.0
    strength_penalty: -10.0
  range_bounce:
    enabled: true  # ARCH-55 shadow активирован 12.04.2026
    sl_buffer_pct: 0.003
    min_tp_r: 3.5
    max_sl_dist_pct: 0.02
  # ARCH-113: TPSelector — Intelligent TP Gravity Engine
  # Исследование: 156K уровней, alpha=1.5 доказан, FVG <0.3R = 73-86% reach
sl_tp_engine:
  tp_selector_enabled: true    # DEV-224 (30.05): shadow A/B подтвердил +0.298R/сделку (n=133, +39.6R), liquidity_sweep +0.327R. Включено.
  tp_selector_shadow: true     # оставляем shadow-запись для A/B мониторинга production vs прежние выходы
  tp_selector_eps_pct: 0.5     # ±% для кластеризации магнитов
  tp_selector_alpha: 1.5       # score = gravity / dist^alpha (оптимум из исследования)
  tp_selector_max_dist_pct: 15.0  # фильтр дальних уровней
  dual_tp:
    enabled: true
    tp1_fix_pct: 10
  narrative:
    enabled: true              # NarrativeBuilder включён (ARCH-90)
    include_in_tg: true        # ARCH-91: показывать SMC-блок в TG-сигналах
    max_factors_in_tg: 4       # не более N строк нарратива в TG
    include_past_outcome: true # показывать прошлый исход на паре (если <4ч)
  # DEV-177: адаптивные веса через EMA по хронологии закрытия
  adaptive_weights:
    method: "ema"                 # "ema" | "full_history" (shadow-режим для сравнения)
    half_life: 50                 # сделок: 30=реактивно, 50=баланс, 100=консервативно
    data_era_filter: "post_fix"   # null = все эры; "post_fix" = только >= 15.04
    history_log_enabled: true     # писать снэпшот в signal_weights_history
    history_log_interval_min: 60  # не чаще раз в N минут
  use_tsl: true
  tsl_hybrid_enabled: true   # DS-321: гибридная коробка передач (false=откат на текущий)
  tsl_activation_r: 1.0
  tsl_min_move_pct: 0.15
  tsl_activation_r_range: 0.7
  tsl_activation_r_per_strategy:
    pivot_reversal: 0.5
    wt_b: 0.8
    wt_signal: 1.0
    wt_sideways: 0.8
    atr_change: 1.5
    confluence: 1.0
    ote_nested: 4.0   # ARCH-128 04.06: компактный SL → R-единицы малы в %, TSL рано выбивал runner. BE@0.5R защищает раньше, TSL поздно (+4R) → runner до HTF-target дышит
  cascade_tsl: true
  cascade_tsl_deescalation_r: 2.5
  cascade_tsl_opts:
    cap_tf_after_tp1: 1h
    no_degrade_above_r: 8.0    # было 3.0 — 22.05.2026: поднят, т.к. 2.5-3.0R окно блокировало все позиции ≥3R
    r_gradient_peak_min_r: 2.5
    r_gradient_rollback_pct: 0.40  # было 0.25 — триггер при -60% от пика (было -75%, слишком поздно)
  use_breakeven: true           # 26.05.2026: BE@0.5R активирован (A/B: +0.32..+0.47R vs -0.14..−0.25R current)
  breakeven_activation_r: 0.5  # SL → entry после +0.5R (54.4% сделок достигают)
  use_be_after_tp1: true       # DEV-173: после хита TP1 → SL переносится в entry+0.1%
  expired_extend_min_r: 5.0
  expired_extend_hours: 120
  expired_management:
    tsl_convert_min_r: 1.5
    tsl_convert_regimes:
    - TREND_UP
    - TREND_DOWN
  max_positions_per_direction: 0  # 27.05.2026: DEV-14 hard guard отключён (актуальность утеряна — есть circuit_breaker, RI v1, TSL, ARCH-88 Loss Memory). Soft penalty correlation_guard.py остаётся.
  min_sl_dist_pct: 0.3    # DEV-157: пропуск если SL < 0.1% от entry (защита от R=-450)
  sl_tp:
    atr_multiplier: 1.0
    sl_min_pct: 0.5
    sl_max_pct: 2.0
    tp_fallback_rr: 3.0
    max_rr: 3.0
    max_rr_range: 2.5
    require_pivot_tp: false
    tp_pivot_min_r: 3.0
    tp_pivot_min_r_range: 1.2
    tp_reversal_min_r: 3.0
    tp_partial_pct: 0.2
    atr_dynamic: true
    atr_expand_threshold: 1.3
    atr_contract_threshold: 0.8
    struct_sl_buffer_pct: 0.3
    struct_sl_max_dist: 2.0
    tsl_too_tight_pct: 1.0
market_regime:
  use_v2: true   # АКТИВИРОВАН 11.06 (REGIME-V2 Э4): Bus публикует classify_v2 (HTF-доминанта),
                 # ВСЕ гейты (scan_loop:234/848) видят v2. A/B: +334R сум, раннеры целы, HIGH_VOL
                 # ложные блоки убраны (876→102), RANGE-мислейбл чинится (3420→1645). Откат: false.
trigger_bus:
  shadow: false
  cascade_min: 3
  interval_sec: 120
event_bus:
  enabled: true
  shadow: false
  cooldown_minutes: 30
  max_concurrent: 3
  btc_macro_shock_pct: 2.5
# ARCH-125: AdvisorPort — глобальный стратегический брифинг роя (высота B+C).
# Default OFF. Включение требует DEEPSEEK_API_KEY (дирижёр). Всегда shadow на старте.
advisor:
  enabled: true           # ✅ ВКЛ 02.06.2026 (shadow) — spawn_advisor() поднимает advisor_loop. balance=0 → mistral-fallback
  shadow: true            # вердикт пишется в advisor_snap, НОЛЬ влияния на исполнение
  interval_hours: 4       # 03.06: 1ч→4ч (экономия API роя ×4). 1 consult/цикл, latency-tolerant
  timeout_s: 600          # часовой shadow-брифинг — латентность неважна; каскад без баланса бывает >200с
  send_telegram: true     # слать брифинг в ТГ с #тегом
  telegram_tag: "#брифинг"
  breaker_fails: 3        # circuit breaker: open после N подряд сбоев
  breaker_cooldown_s: 1800  # 30 мин до half-open
signal_quality:
  sl_cooldown_hours: 1.0
  # Per-signal_type cooldown (16.05.2026): какие signal_type ИГНОРИРУЮТ какие источники SL.
  # Корень: wt_sideways генерит много SL → блокирует независимые сигналы (anomaly затих 6 дней).
  # anomaly не зависит от SL-серий wt_sideways — это event-driven сигнал на объём/цену.
  sl_cooldown_ignore_sources:
    anomaly: [wt_sideways]
  dedup_minutes: 30
  min_volume_usd: 0  # 13.06 СТРЕСС-ТЕСТ B при ПОЛНОМ масштабе: гейт снят → ~531 пара (как 09.06, но теперь OPS-05+B+PERF сняли блокер). 2M дал 278 пар, торговый rtt держал 255ms ✅. МОНИТОРИТЬ: торговый rtt (<1с — тест B при 531), check_open цикл (<5мин — OPS-05, иначе зомби как 09.06: 12мин→186 зомби), зомби >8ч, прокси (3 IP × 531 OHLCV), RISK (overflow→margin reject новых, на VST ок). Откат: 5000000. Промежуточно было 2000000(278п). [[liq_gate_experiment]] Условия выполнены: OPS-05 (параллельный check_open) ✅ + B изоляция торгового loop ✅ + PERF #1 глобальный get_open_orders ✅. МОНИТОРИТЬ: торговый rtt (должен держать <1с — тест B), check_open цикл (<5мин), зомби (>8ч OPEN), RISK acc1 (85%, avail $28). Если ОК → 0 (531 пара). Откат: 5000000. История: 09.06 гейт 0 → 531 пара → последовательный check_open захлебнулся (~12мин) → 186 зомби >8ч. ПРИОСТАНОВЛЕН до OPS-05. Теперь OPS-05+B сняли блокер. [[liq_gate_experiment]]
  min_strength: 50
  # ARCH-88: Per-pair Loss Memory — блок регистрации при серии SL подряд.
  # Защита от сценария API3 (8 SL без автоматической остановки).
  pair_cooldown_sl_streak: 5   # порог SL подряд для блока
  pair_cooldown_shadow: true   # первые 48ч — только лог [PAIR-COOLDOWN SHADOW WOULD_BLOCK]
  # DEV-170: Time-of-day gate — блок вне торговых сессий
  # Данные: 09-18 UTC = прибыльно (+0.15R avg), 23-06 UTC = убыточно (-0.3R avg)
  # TRADER (14.04): wt_signal хорош с 04:00 (04:00=+1.097R, 06:00=+1.285R)
  time_gate:
    enabled: false
    start_hour_utc: 9
    end_hour_utc: 18
    overrides:
      wt_signal:
        start_hour_utc: 4
        end_hour_utc: 18
  # DEV-186 (26.04.2026): wt_signal SHORT блок в TREND_UP/HIGH_VOL.
  # Данные RE-AUDIT: TREND_UP n=22 avgR=-1.12, HIGH_VOL n=12 avgR=-0.77.
  # 27.04: фикс кода monitoring.py:903 (regime через pair_context, был баг recommendation.regime пустое). Требует restart #2.
