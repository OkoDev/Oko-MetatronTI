  min_strength_register: 50  # 26.05.2026: 60→50 — увеличиваем трафик divergence/arch104 (50→40 в source_policies)
  min_strength_atr_change: 0   # ГЕЙТ СНЯТ 11.06 (REGIME-V2): strength atr_change = trigger-вес (15-18) + confirmations,
                               # НЕ качество (направление ±1 бинарно из ATRTrend) → порог 15 = формальность (trigger≥15).
                               # Реальный фильтр качества = OTE-позиция (PLAN_ATR_CHANGE_OTE, шаг 3). Было: 15.
  atr_change:
    # REGIME-V2/arch124 (11.06): СНЯТЫ режимные гейты atr_change.
    # Причина: atr_change SHORT = ATRTrend −1 → направление УЖЕ в сигнале (regime-гейт = тавтология);
    # реальный фильтр качества = OTE-зона (atr_change слеп к структуре — входит на ATR-всплеске
    # вслепую: иногда в OTE-откате=хороший R, иногда на дне импульса=плохой R → шум +0.072).
    # −178R утечки (arch124). Снято для чистого сбора + OTE-интеграции (atr_change как триггер в OTE).
    long_strength_penalty: 0   # снят (был 35 — SOFT-штраф LONG на regime-метке)
    # allow_short_regimes снят (был [TREND_DOWN] HARD-блок). min_strength_atr_change тоже снят (→0, формальность).
  min_strength_wl_breach: 45
  pivot_reversal_max_strength: 79
  # SIGNAL-CLEANUP (11.06.2026): pivot_reversal ОТКЛЮЧЁН полностью. Балласт −1272R (25% системы),
