telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: ${ADMIN_ID}
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
analysis:
  volume_multiplier: 4.0
  price_threshold: 5.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 60.0
      os_threshold: -60.0
    trend:
      atr_period: 43
      factor: 1.1
  signals:
    min_signals: 2
    single_signal_min_strength: 54
    premium_pairs:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - ADA
    - DOGE
    - DOT
    - MATIC
    - AVAX
  divergence:
    pivot_proximity_pct: 0.5
  confluence:
    enabled: true
    lookback_bars: 40
    min_strength: 60
    wt_os_threshold: -60.0
    wt_ob_threshold: 60.0
    pivot_proximity_pct: 0.5
    div_min_bars: 9
    max_per_cycle: 3
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5
database:
  path: subscriptions.db
  backup_interval: 24
monitoring:
  check_intervals:
    divergences_every_n_cycles: 5
    background_every_n_cycles: 3
    cascade_div_every_n_cycles: 60
trading:
  use_tsl: true
  tsl_activation_r: 1.2
  tsl_buffer_pct: 0.1
  sl_tp:
    atr_multiplier: 1.2        # множитель ATR для SL (было 1.5)
    sl_min_pct: 0.8            # мин. SL в % (было 1.0)
    sl_max_pct: 3.0            # макс. SL в % (было 4.0)
    tp_fallback_rr: 3.0        # базовый RR — TP1 (было 1.5→2.0→3.0)
    tp_pivot_min_r: 3.0        # пивот принимается только если он ≥ 3R
    tp_partial_pct: 0.50       # 50% позиции закрывается на TP1, остаток по TSL
    atr_dynamic: true          # динамический ATR-множитель по динамике волатильности
    atr_expand_threshold: 1.3  # ATR_14/ATR_28 > 1.3 → волатильность растёт → SL уже
    atr_contract_threshold: 0.8 # ATR_14/ATR_28 < 0.8 → тихо → SL чуть шире
    struct_sl_buffer_pct: 0.3  # отступ за структурным уровнем (% от цены)
    struct_sl_max_dist: 3.0    # макс. расстояние до структурного SL от входа (%)
    tsl_too_tight_pct: 0.6    # если TSL < этого % → искать свинг-вершину как резерв
signal_quality:
  sl_cooldown_hours: 4
  dedup_minutes: 30
  min_volume_usd: 1000000
  min_strength: 50
  min_strength_register: 40
  counter_trend_strength_threshold: 30
  btc_filter_enabled: true
detectors:
  anomaly:
    min_bars: 20
    volume_ma_period: 20
    volume_ratio_threshold: 3.0
    strength_trend_multiplier: 12
    strength_counter_multiplier: 8
performance:
  scan_semaphore_size: 20
  analyze_semaphore_size: 3
  prefetch_pivots_semaphore_size: 5
  background_check_semaphore_size: 10
  cascade_div_semaphore_size: 5
  ohlcv_scan_limit: 160
  ohlcv_slow_threshold_sec: 5.0
  divergence_slow_threshold_sec: 3.0
  pair_slow_threshold_sec: 10.0
  scan_cycle_warning_threshold_sec: 55.0

# ============================================================================
# STRATEGY CONFIGURATION (Этап 8.5 onwards)
# ============================================================================
strategy:
  name: "confluence"  # Available: "confluence", "mtf_bias", "conservative"
  
  # Confluence Strategy (по умолчанию)
  confluence:
    min_signals: 2
    conflict_threshold: 0.3
    signal_weights:
      mtf_signal: 0.25
      mtf_alert: 0.30
      pivot_reversal: 0.20
      divergence: 0.15
      wt_signal: 0.10
      trend_signal: 0.10
      anomaly: 0.05
      pivot_alert: 0.15
      confluence: 0.35
  
  # MTF Bias Strategy (быстрая, только MTF alerts)
  mtf_bias:
    min_strength: 60
    require_confluence: false
  
  # Conservative Strategy (для минимизации просадок)
  conservative:
    min_signals: 3
    min_confidence: 0.65
    conflict_threshold: 0.2

