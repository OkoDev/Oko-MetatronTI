  orphan_autoclose: shadow   # D-070 PREVENTION (19.06): orphan (биржа без OPEN в БД) → off(только alert)/shadow(лог "закрыл бы")/live(account-aware close, one_click_on_fail). Корень рассинхрона БД↔биржа [[orphan_root_dbexch_desync]]. Hedge-safe: skip символов с DB-OPEN (one-click задел бы брата). Дефолт shadow → валидировать перед live (как sl_reconcile)
  exec_ws:
    enabled: true
    write_exch_id: false
    sync_close: true
    sphere_shadow: true    # Ф4.1 EXECUTION-REBUILD: true → строит NEW pipeline (ExecutionSphere, on_close=None) ПАРАЛЛЕЛЬНО старому 2a/2b. Лог "[SPHERE-SHADOW] would close", реально НЕ закрывает, position_sync не тронут. Сверка would-close с фактом на живом потоке → потом CUTOVER. Откат = false. Требует рестарта.
  open_orders_global: true
  open_orders_cache_ttl_sec: 10
  positions_cache_ttl_sec: 45
  balance_cache_ttl_sec: 120
  dedicated_loop: true
  sl_limit_buffer_pct: 1.0
  dev185_2_emergency_enabled: true
  dev185_2_overshoot_threshold_pct: 0.5
  dev185_2_dwell_seconds: 300
  tp1_close_pct: 0.2
  # EXEC-SIM-SPLIT (17.06): SIM-номинал + fallback для sizing при сбое REST. НЕ источник истины
  # для VST: реальный риск/дашборд берут equity per-account из balance_snapshots (ARCH-DB-V2),
  # VST sizing — live availableMargin. ⚠️ реальный equity ~316 (acc1 ~150 + acc2 ~167) ≠ 710.
  deposit_usdt: 598.0   # 19.06 OTE-ONLY Режим В (DS): SIM-номинал ≈ реальный equity
  # 19.06: risk_pct/leverage — ГЛОБАЛЬНЫЙ FALLBACK (для источников без per-source override).
  # Режим В живёт в source_policies.ote_nested (leverage:50/risk_pct:0.5). Глобал вернул к
  # безопасному дефолту, чтобы новые стратегии НЕ наследовали 50x ote_nested.
  risk_pct: 1.0
  leverage: 5
  max_notional_mult: 20.0
  # 🔴 SL-SAFETY КАП ПЛЕЧА (19.06): ликвидация (~1/leverage) должна быть ДАЛЬШЕ SL+буфер.
  # leverage ≤ 1/(sl_dist + liq_safety_buffer). Иначе при тугом SL × высоком плече стоп
  # оказывается ЗА ликвидацией → слив маржи вместо −1R. Пример: POPCAT 50× SL 2.75% → liq 1.9% < SL.
  # Кап ТОЛЬКО снижает плечо (никогда не повышает). Буфер кроет maintenance-margin + slippage.
  liq_safety_enabled: true
  liq_safety_buffer_pct: 0.5
  # CONFIG-SLTP-BUG fix (15.06): код читает trading.min_sl_dist_pct (gates/min_sl_dist.py:24,
  # trade_simulator.py:469/677), а значение лежало ТОЛЬКО в sl_tp_engine:321 (не читается) →
  # дефолт 0.1 → SL≈entry проходили → fake-R −15R + реальные −20%. Дублируем сюда до миграции sl_tp_engine.
  # 18.06: ОПУЩЕН 0.5→0.25 — пол 0.5% резал ТУГИЕ SL<0.5% (avgR+1.07!) с 15.06, оставлял
  # широкие (+0.39, вдвое хуже). Тест порогов ote n=2680 (NET, комиссия 0.1%): 0.5%→net+0.461/
  # sumR898; 0.25%→net+0.546/sumR1448 (+61%). Пол был ПРОТИВ fake-R (SL≈entry→R-взрыв), а fake-R
  # закрыт clamp R≤MFE (bug_phantom_exit_resolve). 0.25% держит буфер от SL≈entry, пропускает
  # тугое золото (ote естеств. минимум SL ~0.15%). Откат: вернуть 0.5.
  min_sl_dist_pct: 0.25
  min_rr_per_strategy:
    ote_nested: 3.0
  regime_direction_block:
    enabled: false
    TREND_DOWN: LONG
    TREND_UP: SHORT
