# ════════════════════════════════════════════════════════════════════════════
# 🔴 МАРШРУТИЗАТОР ИСТОЧНИКОВ — 193 ключа
#   per-source политики: exchange_enabled, trade_mode, leverage, risk_pct, entry_order_type.
#   ⚠️ ЗДЕСЬ 31 ключ `exchange_enabled` и 12 разных `leverage` — правь ТОЧЕЧНО, не sed'ом.
# ════════════════════════════════════════════════════════════════════════════
signal_router:
  enabled: true    # 25.07 КРИТ-ФИКС (Егор «торгует всё что можно»): router off = старый путь ставил
                   # VST-ордер БЕЗ source-гейта. Включён → source_policies.exchange_enabled наконец
                   # гейтит биржу: торгуют ТОЛЬКО radar/atr_change_S2/atr_s2/ds_advisor, прочее SIM-only.
  shadow_compare:
    enabled: false
    log_path: logs/router_shadow.log
  default_policy:
    min_strength: 50
    exchange_enabled: false
    trade_mode: ''
    soft_gates_enabled:
    - strength_threshold
    - regime_safety
    - btc_market
    - time_gate
    - correlation_guard
    - market_stress
    - pair_cooldown_streak
  source_policies:
    # 🔴 20.08 IMPULSE-FIB · 1h · ОБЕ стороны. Включён по команде Егора («всё в бой»).
    # В бой идёт УЗКАЯ КЛЕТКА: три гейта + стоп 1.5-3.2% (OOS×OOS PF 1.90, безтоп10% +13).
    # Механика в широком виде мертва на 2025-26 (PF 0.99) — фильтр стопа в лупе обязателен.
    # 🔴 ПЛЕЧО 10, А НЕ 20: стоп 1.5-3.2%, при плече 20 ликвидация около 4.5% движения —
    # запас над стопом менее полутора крат, любой фитиль сносит позицию раньше стопа.
    # При 10 ликвидация ~9%, то есть втрое дальше медианного стопа 2.7%.
    # entry_order_type LIMIT обязателен: экономика считана на костах 0.35%, вход по рынку
    # добавляет 0.44% налога на исполнение — при стопе 2.7% это шестая часть стопа.
    impulse_fib:
      min_strength: 0
      exchange_enabled: true
      trade_mode: impulse_fib
      entry_order_type: LIMIT
      leverage: 10
      risk_pct: 2.0
      lev_set_to_max: false
      soft_gates_enabled: []

    impulse_fib_15m:
      min_strength: 0
      exchange_enabled: true
      trade_mode: impulse_fib_15m
