                              # Откат при мусоре: enabled false + рестарт.
    signal_type: "ote_nested" # в БД simulated_trades для разделения

# ─── ARCH-118: Единый снимок признаков (snapshot_features, 30.05.2026) ───
# Вариант B: live=бэктест ОДНИМ калькулятором combinator_v2.compute_flags.
# SHADOW-режим: пишет снимок ~211 флагов (sparse) в features_json.arch118_snapshot
# параллельно текущим полям. На входы/решения НЕ влияет. Стоимость: ~3 get_ohlcv
# (1h/15m/4h, 1d из resample) на КАЖДУЮ регистрируемую сделку (входы редки).
# Цель: накопить консистентные снимки для проверки parity (Шаг 3) и ML.
arch118:
  shadow_enabled: true     # legacy: дубль снимка в features_json.arch118_snapshot
  # Шаг 5b: снимок в отдельную таблицу trade_features (FK, generated/индексы).
  # write_table=true → prod-путь (таблица); features_json НЕ дублируется (data-era граница
