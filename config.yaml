telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: ${ADMIN_ID}
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
analysis:
  volume_multiplier: 4.0
  price_threshold: 5.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 58.0
      os_threshold: -58.0
    trend:
      atr_period: 43
      factor: 1.0
  signals:
    min_signals: 2
    single_signal_min_strength: 56
    premium_pairs:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - ADA
    - DOGE
    - DOT
    - MATIC
    - AVAX
  divergence:
    pivot_proximity_pct: 1.5
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5
database:
  path: subscriptions.db
  backup_interval: 24
monitoring:
  check_intervals:
    divergences_every_n_cycles: 5
    background_every_n_cycles: 3
    cascade_div_every_n_cycles: 60
trading:
  use_tsl: true
  tsl_activation_r: 1.5
  tsl_buffer_pct: 0.1
signal_quality:
  sl_cooldown_hours: 4
  dedup_minutes: 30
  min_volume_usd: 1000000
  min_strength: 50
  min_strength_register: 20
  counter_trend_strength_threshold: 30
detectors:
  anomaly:
    min_bars: 20
    volume_ma_period: 20
    volume_ratio_threshold: 3.0
    strength_trend_multiplier: 12
    strength_counter_multiplier: 8
performance:
  scan_semaphore_size: 20
  analyze_semaphore_size: 3
  prefetch_pivots_semaphore_size: 5
  background_check_semaphore_size: 10
  cascade_div_semaphore_size: 5
  ohlcv_scan_limit: 160
  ohlcv_slow_threshold_sec: 5.0
  divergence_slow_threshold_sec: 3.0
  pair_slow_threshold_sec: 10.0
  scan_cycle_warning_threshold_sec: 55.0
