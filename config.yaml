  scan_semaphore_size: 5   # базовый (proxy off → proxy_pool.overrides переключает)
  analyze_semaphore_size: 3
  prefetch_pivots_semaphore_size: 2
  background_check_semaphore_size: 5
  cascade_div_semaphore_size: 3
  # D-065 (24.05): rps 15→30 — официальный потолок BingX market data = 500 req/10s per IP = 50 RPS.
  # 12.06 A/B: 30→40 дал лишь +5% (цикл 115→109с) НО поймал GlobalRateLimiter бан 5с (40 задел
  # потолок 50). Откат на 35 (компромисс): чуть быстрее 30, реже throttle чем 40. Вывод: один IP
  # near-optimal ~30-35, реальный кратный буст = PROXY-NODE (новые IP = новые RPS-бюджеты).
  api_rps: 35   # базовый (proxy off). При proxy on → proxy_pool.overrides.api_rps=100
  api_semaphore_size: 10   # базовый (proxy off → proxy_pool.overrides переключает)
  ohlcv_scan_limit: 250
  # D-055 откатан (пороги обратно). Реальный fix — sequential TF fetch в scan_loop.
  ohlcv_slow_threshold_sec: 8.0
  divergence_slow_threshold_sec: 3.0
  pair_slow_threshold_sec: 10.0
  scan_cycle_warning_threshold_sec: 70.0
  # 28.05 DEV-230: kill-switch WS. false → WsFeed не запускается, поток данных на REST.
  # Тест-откат: WS перегружал общий event loop (5 ccxt.pro соединений → SLOW await 64-92s,
  # scan ohlcv 76-96s, health 339×DEGRADED). REST-only разгружает loop.
  ws_enabled: false
  # DEV-231 (30.05): event loop debug — логает медленные callback'и для диагностики
  # blocking-кода. Включать ТОЛЬКО на время расследования (много логов).
  event_loop_debug: true
  slow_callback_threshold_sec: 1.0
  # 27.05: WsFeed настройки выведены из ws_feed.py хардкодов.
  # Шаг B — снижены под текущий deg BingX (был 100/120/2.0).
  # Лимит BingX: 200 подписок/WS + 500 req/10s per IP.
  ws_ticker_batch_size: 75         # 243 пары / 75 = 4 батча × WS (было 3 × 100)
  ws_ohlcv_batch_size: 80          # 80 пар на 1 instance (было 120)
  ws_batch_start_delay_sec: 5.0    # пауза между стартом батчей (был 2)
  ws_reconnect_base_delay_sec: 5.0 # × consecutive_errors, max 60
  ws_ohlcv_error_pause_sec: 1.0    # пауза после OHLCV error per-symbol

# PROXY-NODE (13.06): пул прокси для market-data (обход per-IP RPS-лимита BingX).
# 3 Singapore прокси через VPN → 3 разных выходных IP к BingX = +RPS-бюджет.
# 🔴 ТОЛЬКО public OHLCV/tickers. Торговля — direct IP (ключ↔whitelist). Прокси в .env (PROXY_LIST).
proxy_pool:
  enabled: true             # PROXY-тест при 500+ пар (гейт объёма снят 13.06)
  proxies: []               # пусто → PROXY_LIST из .env (пароли не в git)
  rps_per_proxy: 35.0       # готово к 500+ пар (3×35=105 RPS)
  health_cooldown_sec: 30.0 # карантин мёртвого прокси (3 fails подряд)
  # ПРОФИЛЬ: эти значения применяются ВМЕСТО performance.* когда enabled=true (через config.perf()).
  # Прокси-оптимизированные (3 IP → больше RPS/параллелизма). enabled=false → performance.* базовые.
  # Один флаг enabled переключает весь профиль — не править параметры руками.
  overrides:
    api_rps: 100            # 3 IP × ~33 RPS (vs base 35 на 1 IP)
    scan_semaphore_size: 15 # больше параллелизма (латентность прокси ~1с компенсируется)
    api_semaphore_size: 30

