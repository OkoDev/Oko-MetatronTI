  # Слеп к рыночной фазе (LONG на обвале WR2-7%). Вернуть только после WaveService/контекст-гейта (PIVOT-CONTEXT).
  pivot_reversal_enabled: false
  # SIGNAL-CLEANUP (12.06.2026): watch_list_breach ОТКЛЮЧЁН. Балласт −169R, длинные сделки (avg 701мин).
  watch_list_breach_enabled: false
