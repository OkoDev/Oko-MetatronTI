telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: ${ADMIN_ID}
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
analysis:
  volume_multiplier: 5.0
  price_threshold: 7.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 58.0
      os_threshold: -58.0
    trend:
      atr_period: 43
      factor: 1.0
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5
database:
  path: subscriptions.db
  backup_interval: 24
monitoring:
  health_check_interval: 300
  alert_on_errors: true
  max_errors_per_hour: 10
trading:
  use_tsl: true
  tsl_activation_r: 1.0
  tsl_buffer_pct: 0.1
signal_quality:
  sl_cooldown_hours: 4
  dedup_minutes: 30
  min_volume_usd: 1000000
  min_strength: 50
