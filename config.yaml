    # 🔴 20.08: у impulse_fib эдж ИМЕННО в МАЛОМ стопе (1.5-3.2%) — обратное choch_wavec.
    # Глобальный min_sl_dist_pct=4.0 зарезал бы источник ЦЕЛИКОМ, как min_rr=2.0 уже
    # убивал rangefade (memory/bug_rr_gate_killed_tp1r_edge). 1.4 — чуть ниже нижней
    # границы лупа (1.5), чтобы гейт не спорил с фильтром на границе float.
    impulse_fib: 1.4
    # 🔴 28.08: у ote_nested стоп ТУГОЙ ПО КОНСТРУКЦИИ (за свип/импульс) — медиана
    # 0.63% по 9472 боевым сделкам. Глобальные 4.0 режут источник ЦЕЛИКОМ: preflight
    # 28.08 показал «min_sl_dist УБИЛ: 2.0% < 4.00%» даже на стопе ВТРОЕ шире медианного.
    # Без исключения перевод на лимитный вход не проявился бы никак — луп молчал бы
    # без причины ([[feedback_selftest_every_strategy_loud]]).
    # 0.3 — ниже медианы, но не ноль: совсем микроскопические стопы (<0.3%) косты
    # съедают гарантированно (комиссия за круг 0.20% — две трети такого стопа).
    ote_nested: 0.3
    impulse_fib_15m: 1.4
  # 07.08: жёсткий потолок множителя риска из extra_features.risk_mult. Основной сайзинг по
  # funding×AC отложен до 20-30 чистых net+ форварда; пока только ×1.5 на bigflush15.
  risk_mult_cap: 1.5
  # 13.08.2026 (аудит конфига): ключ ВНЕСЁН ЯВНО. Раньше его здесь не было, и порог 2.0
  # жил хардкодом в двух местах — gates/rr_filter.py:41 и trade_simulator.py:450.
  # Цена невидимости: 18 464 отсечённых сигнала за 96 дней (3.3% потока) без возможности
  # управлять из конфига; он же однажды убил ВЕСЬ rangefade (RR=1.0 по конструкции,
  # см. memory/bug_rr_gate_killed_tp1r_edge). Значение = прежний дефолт → поведение НЕ меняется.
  min_rr_ratio: 2.0
  # 🔴 20.08 ИСТОЧНИКИ С ОДНОЙ ЦЕЛЬЮ (без DUAL_TP). Ключ ОБЯЗАН быть здесь явно:
  # в коде есть фолбэк `["ote_nested", "impulse_fib"]`, и если кто-то впишет сюда свою
  # стратегию, не перечислив эти две, — они молча потеряют режим SINGLE.
  # Почему важно: DUAL_TP заполняет tp1_price, а условие детекта цели в sim_exit требует
  # tp1_price IS NULL → распознавание TP отключается НАВСЕГДА, остаётся только SL.
  # Позиция уходит в аварийное закрытие по рынку (KAIA #58367: 0.02566 вместо цели 0.031).
  single_tp_sources: [ote_nested, impulse_fib, impulse_fib_15m]

  # 🔴 20.08 СЕКЦИЯ СОЗДАНА. Код читает `trading.sl_management.*`
  # (trade_simulator.py:776-780), но такой секции в конфиге НЕ БЫЛО — все её значения
  # брались из дефолтов кода, а одноимённые ключи в `sl_tp_engine.sl_tp` были СИРОТАМИ
  # (их никто не читал). Это ровно то, на что ругался config_audit.
  sl_management:
    # 🔴 21.08 ТОЛЬКО rr_cap_exempt. Ключи max_rr/max_rr_range СЮДА НЕ ДОБАВЛЯТЬ:
    # секции раньше не существовало, и код брал ЕДИНЫЙ дефолт 3.0 для любого режима.
    # Стоило вписать max_rr_range: 2.5 — как selftest L12 упал (tp=112.5≠115) и бот
    # отказался стартовать: цель тестовой сделки в RANGE обрезалась сильнее прежнего.
    # Урок: «перенёс значение как было» ≠ «поведение не изменилось», если раньше
    # значение не читалось вовсе.
    # источники, ОСВОБОЖДЁННЫЕ от обрезки RR: у них дальняя цель — КОНСТРУКЦИЯ.
    # Замер impulse_fib (89 монет, 707 сделок): цель −1.618 против обрезанной до RR 3.0
    # → PF 2.80/2.19, OOS×OOS 1.90/1.46. Кэп растит WR и долю достигнутых целей,
    # но режет деньги.
    # 🔴 22.08 ДОБАВЛЕН impulse_fib_15m. Близнец 1h-инстанса был здесь пропущен, и его
    # цель обрезалась до RR 3.0 — тогда как ВЕСЬ его измеренный эдж (short + дрейф-гейт:
    # PF 7.04, OOS 10.82) посчитан на фибо-цели без обрезки. Замер целей на 15m прямо
    # показывает цену подмены: фибо-цель 1.60 против RR-цели 1.13
    # ([[target_fib_minus1_beats_1618_on_15m]]).
    rr_cap_exempt: [ote_nested, impulse_fib, impulse_fib_15m]
  min_rr_per_strategy:
    ote_nested: 0.9
    oko_ote: 0.1
    radar: 0.5
    # 30.07: rangefade — TP1R ПО КОНСТРУКЦИИ (RR=1.0), глобальный min_rr=2.0 резал ВСЕ его сигналы
    # (лог «rr_filter:RR=1.00 < min_rr=2.0» — причина 0 сделок форварда). 0.95 вместо 1.0 —
    # запас на float (tp_dist/sl_dist может дать 0.9999). Правило «RR≥3» у нас опровергнуто.
    rangefade: 0.95
    rangefade4h: 0.95
    # 20.08: у impulse_fib RR по конструкции ВЫСОКИЙ (медиана 6.2, минимум 2.5 —
    # цель 1.654 амплитуды импульса против стопа 2.5·ATR), глобальный 2.0 проходит.
    # Прописано явно, чтобы источник не зависел от будущих правок глобального порога.
    impulse_fib: 2.0
    impulse_fib_15m: 2.0
    bigflush15: 0.95
    # 19.08: у CHoCH→волна C цель = длине ноги, а стоп = ноге + откат 0.236 → RR по
    # КОНСТРУКЦИИ около 1.29 (медиана замера). Глобальный порог 2.0 зарезал бы источник
    # целиком — ровно то, что уже случилось с rangefade (memory/bug_rr_gate_killed_tp1r_edge).
    choch_wavec: 0.95
  regime_direction_block:
