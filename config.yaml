    min_score: 85
    max_open_long: 25
    max_open_short: 25
    max_open_total: 50
    # EXEC-SIM-SPLIT кирпич №1 (17.06): риск-экспозиция % депозита (VST). Мерка = Σ(qty×|entry−sl|)/deposit,
    # НЕ количество (узкий стоп взрывает notional при том же risk%). Старт SHADOW: лог [DEV-52][RISK]
    # exposure/would_block без блокировки → собрать распределение → выбрать потолок по данным.
