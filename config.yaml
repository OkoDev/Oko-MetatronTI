telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: '428163099'
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
    bingx_vst:
      api_key: ${BINGX_VST_API_KEY}
      secret: ${BINGX_VST_SECRET_KEY}
analysis:
  volume_multiplier: 4.0
  price_threshold: 3.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 60.0
      os_threshold: -60.0
    trend:
      atr_period: 43
      factor: 1.25
  signals:
    min_signals: 2
    single_signal_min_strength: 54
    min_confidence: 0.55
    min_confidence_by_type:
      wt_b_signal: 0.5
      wt_signal: 0.52
      pivot_reversal: 0.52
      confluence: 0.58  # DEV-149: 0.68→0.58, ML блендинг срезал до 0.53-0.60
      mtf_bias: 0.55
      trend_signal: 0.55
      anomaly: 0.6
    premium_pairs:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - ADA
    - DOGE
    - DOT
    - MATIC
    - AVAX
  wt_b:
    enabled: true  # DATA-10.04: WR<10%, avgR -0.7..-1.1R, все комбо убыточны
    div_min: 3.0
    div_max: 20.0
    lookback: 35
    # DEV-187 (26.04.2026): floor для adaptive порогов p10/p90.
    # На трендовом рынке pXX падают к нулю → детектор пускает входы в N зоне.
    # SHORT при wt1_1h в +10..+30 → avgR=-2.44 (n=7). Откат: floor=0.
    os_floor: -30.0   # os_ = min(p10, -30) — LONG только при wt1<-30
    ob_floor: 30.0    # ob_ = max(p90, +30) — SHORT только при wt1>+30
  divergence:
    pivot_proximity_pct: 0.3
  anomaly:
    max_per_cycle: 5
  confluence:
    enabled: true   # 05.05.2026: разблокирован для сбора данных; BIAS фильтрует направление
    use_state_machine: false
    lookback_bars: 8
    cross_fresh_bars: 5
    min_strength: 60
    wt_os_threshold: -60.0
    wt_ob_threshold: 60.0
    pivot_touch_pct: 0.15
    div_min_bars: 9
    max_per_cycle: 10
    dynamic_os_enabled: true
    dyn_os_k: 1.2
    dyn_os_window: 50
    4h_gate_enabled: false
    pivot_proximity_pct: 0.2
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5
database:
  path: subscriptions.db
  backup_interval: 24
monitoring:
  check_intervals:
    divergences_every_n_cycles: 5
    background_every_n_cycles: 3
    cascade_div_every_n_cycles: 60
outcome_predictor:
  training_window: null
strategy_name: multi_signal

sideways_mode:
  enabled: false  # 17.05.2026: отключён — -131R/24ч, 50% убыточного флоу (решение команды + пользователя)
  min_sideways_bars: 3      # N последовательных RANGE-циклов для активации (защита от флуктуаций)
  timeframe: 30m            # ТФ для WT OS/OB детекции (бэктест: 30m лучший в боковике)
  min_strength: 60          # минимальный strength для регистрации

trading:
  execution_mode: vst
  sl_limit_buffer_pct: 1.0  # DEV-185 (26.04.2026): 0.0→1.0. Корень catastrophic slippage: STOP_MARKET без буфера. Расследование: 121 сделок overshoot ≥0.5% = -465R. Buffer 1% защитит ~51 сделку (-113R экономии). Risk: non-execution при overshoot >1% — позиция повисит до TP/EXPIRED/manual. Через 48ч мерить p90 overshoot, при ОК → 2.0 + watchdog. Откат: sl_limit_buffer_pct: 0.0
  # DEV-185.2 (27.04.2026): emergency watchdog для STOP-LIMIT non-execution.
  # Подтверждение из боя: #8010 APE 26.04 — overshoot 32.7% R=-11.83 за 3ч (limit-ордер не fill, позиция висла).
  # Watchdog проверяет каждый цикл sync_positions (60s): если current_price ушла за SL > overshoot_threshold
  # и удерживается > dwell_seconds → emergency market close.
  # Откат: dev185_2_emergency_enabled: false
  dev185_2_emergency_enabled: true
  dev185_2_overshoot_threshold_pct: 0.5    # цена за SL > 0.5% от entry → старт таймера
  dev185_2_dwell_seconds: 300              # 5 минут удержания → emergency close
  tp1_close_pct: 0.2
  deposit_usdt: 100.0
  risk_pct: 1.0
  leverage: 5
  regime_direction_block:
    enabled: false  # 14.04: убран — режимный классификатор ненадёжен, блокирует прибыльные входы
    TREND_DOWN: LONG
    TREND_UP: SHORT
  blocked_regimes: [HIGH_VOL]  # P1.5 24.04: откат DEV-149 — HIGH_VOL режим статистически убыточен
  pivot_proximity_filter:
    enabled: true
    hard_block_mult: 2
  pivot_touch_staleness:
    enabled: true
    staleness_bars: 5
    score_penalty: -10
  future_pp_score_modifier:
    enabled: true
  market_event_marker:
    enabled: true
    sl_count: 5
    window_minutes: 30
  market_stress_gate:
    enabled: false
    sl_threshold: 5
    window_minutes: 30
  circuit_breaker:            # DEV-156: поднимает min_strength при низком WR
    enabled: true
    lookback_trades: 50       # последние N закрытых сделок
    wr_trigger_pct: 15.0      # WR < 15% → активация
    wr_reset_pct: 20.0        # WR > 20% → деактивация (после cooldown)
    cooldown_minutes: 30      # держать активным минимум 30 мин
    strength_bonus: 10        # +10 к min_strength при активации
  phase_guard_enabled: false
  weekly_bias_filter:
    enabled: true
    soft_penalty: 25
    hard_block_ctx_score: 3
    near_level_pct: 1.5
  pivot_reversal_bias:
    enabled: false
    against_bias_penalty: 20
    near_level_pct: 1.5
  l3_checker:
    enabled: false  # 14.04: выключен — при включении блокирует всё (уже открыто >лимита)
    min_score: 85
    max_open_long: 2
    max_open_short: 2
    max_open_total: 4
  correlation_groups:
  - - PAXG
    - XAUT
  - - BTC
    - WBTC
  - - ETH
    - STETH
    - WETH
  entry_timeframe: 15m
  bounce_mode:
    enabled: false
    max_bounces: 2
    min_trend_strength: 50
    cooldown_sec: 300
    scalp_atr_multiplier: 1.0
  active_strategy: pivot_reversal
  active_strategies:
  - reversal
  - trend_following
  - pivot_reversal
  - multi_signal
  - mtf_bias
  strategies:
    wt_entry:
      min_strength: 60
      tp_rr: 3.0
      sl_buffer_pct: 0.3
      tsl_max_dist: 3.0
      tsl_min_dist: 0.6
    reversal:
      min_strength: 70
      min_confidence: 0.6
      conflict_margin: 0.15
      tp_rr: 3.0
      sl_min_pct: 0.5   # DEV-SL-MIN 04.05: зажим снизу (до: 116 сделок с SL<0.5% → catast)
      sl_max_pct: 3.0   # DEV-SL-MIN: зажим сверху
    trend_following:
      min_signals: 2
      min_strength: 55
      min_confidence: 0.55
      conflict_threshold: 0.25
      tp_rr: 3.0
    multi_signal:
      min_signals: 2
      conflict_threshold: 0.3
    conservative:
      min_signals: 3
      min_confidence: 0.65
    pivot_reversal:
      min_strength: 60
      tp_rr: 3.0
  btc_market_gate:
    enabled: true
    shadow_mode: false              # ARCH-78: активный блок (было shadow)
    block_short_in_uptrend: true    # ARCH-78: блок SHORT при BTC BULL
    counter_trend_min_strength: 75  # SHORT при BTC BULL требует strength >= 75
    reversal_exception: true        # pivot_reversal всегда проходит (разворот у уровня)
  verdict_gate:
    enabled: true
    smc_block_confidence: 0.65
    wt_exhaustion_confidence: 0.65
    strength_boost: 5.0
    strength_penalty: -10.0
  range_bounce:
    enabled: true  # ARCH-55 shadow активирован 12.04.2026
    sl_buffer_pct: 0.003
    min_tp_r: 3.5
    max_sl_dist_pct: 0.02
  dual_tp:
    enabled: true
    tp1_fix_pct: 10
  narrative:
    enabled: true              # NarrativeBuilder включён (ARCH-90)
    include_in_tg: true        # ARCH-91: показывать SMC-блок в TG-сигналах
    max_factors_in_tg: 4       # не более N строк нарратива в TG
    include_past_outcome: true # показывать прошлый исход на паре (если <4ч)
  # DEV-177: адаптивные веса через EMA по хронологии закрытия
  adaptive_weights:
    method: "ema"                 # "ema" | "full_history" (shadow-режим для сравнения)
    half_life: 50                 # сделок: 30=реактивно, 50=баланс, 100=консервативно
    data_era_filter: "post_fix"   # null = все эры; "post_fix" = только >= 15.04
    history_log_enabled: true     # писать снэпшот в signal_weights_history
    history_log_interval_min: 60  # не чаще раз в N минут
  use_tsl: true
  tsl_activation_r: 1.0
  tsl_min_move_pct: 0.15
  tsl_activation_r_range: 0.7
  cascade_tsl: true
  cascade_tsl_deescalation_r: 2.5
  cascade_tsl_opts:
    cap_tf_after_tp1: 1h
    no_degrade_above_r: 3.0
    r_gradient_peak_min_r: 2.0
    r_gradient_rollback_pct: 0.75
  use_breakeven: false
  use_be_after_tp1: true       # DEV-173: после хита TP1 → SL переносится в entry+0.1%
  expired_extend_min_r: 5.0
  expired_extend_hours: 120
  expired_management:
    tsl_convert_min_r: 1.5
    tsl_convert_regimes:
    - TREND_UP
    - TREND_DOWN
  max_positions_per_direction: 0
  min_sl_dist_pct: 0.3    # DEV-157: пропуск если SL < 0.1% от entry (защита от R=-450)
  sl_tp:
    atr_multiplier: 1.0
    sl_min_pct: 0.5
    sl_max_pct: 3.0
    tp_fallback_rr: 3.0
    max_rr: 3.0
    max_rr_range: 2.5
    require_pivot_tp: false
    tp_pivot_min_r: 3.0
    tp_pivot_min_r_range: 1.2
    tp_reversal_min_r: 3.0
    tp_partial_pct: 0.2
    atr_dynamic: true
    atr_expand_threshold: 1.3
    atr_contract_threshold: 0.8
    struct_sl_buffer_pct: 0.3
    struct_sl_max_dist: 2.0
    tsl_too_tight_pct: 1.0
market_regime:
  use_v2: false
trigger_bus:
  shadow: false
  cascade_min: 3
  interval_sec: 120
event_bus:
  enabled: true
  shadow: false
  cooldown_minutes: 30
  max_concurrent: 3
  btc_macro_shock_pct: 2.5
signal_quality:
  sl_cooldown_hours: 1.0
  # Per-signal_type cooldown (16.05.2026): какие signal_type ИГНОРИРУЮТ какие источники SL.
  # Корень: wt_sideways генерит много SL → блокирует независимые сигналы (anomaly затих 6 дней).
  # anomaly не зависит от SL-серий wt_sideways — это event-driven сигнал на объём/цену.
  sl_cooldown_ignore_sources:
    anomaly: [wt_sideways]
  dedup_minutes: 30
  min_volume_usd: 5000000  # DEV-185.3 04.05: 13 катастроф (R<=-5) — все DOLO/CLO/GIGGLE/VELODROME, low liquidity
  min_strength: 50
  # ARCH-88: Per-pair Loss Memory — блок регистрации при серии SL подряд.
  # Защита от сценария API3 (8 SL без автоматической остановки).
  pair_cooldown_sl_streak: 5   # порог SL подряд для блока
  pair_cooldown_shadow: true   # первые 48ч — только лог [PAIR-COOLDOWN SHADOW WOULD_BLOCK]
  # DEV-170: Time-of-day gate — блок вне торговых сессий
  # Данные: 09-18 UTC = прибыльно (+0.15R avg), 23-06 UTC = убыточно (-0.3R avg)
  # TRADER (14.04): wt_signal хорош с 04:00 (04:00=+1.097R, 06:00=+1.285R)
  time_gate:
    enabled: false
    start_hour_utc: 9
    end_hour_utc: 18
    overrides:
      wt_signal:
        start_hour_utc: 4
        end_hour_utc: 18
  # DEV-186 (26.04.2026): wt_signal SHORT блок в TREND_UP/HIGH_VOL.
  # Данные RE-AUDIT: TREND_UP n=22 avgR=-1.12, HIGH_VOL n=12 avgR=-0.77.
  # 27.04: фикс кода monitoring.py:903 (regime через pair_context, был баг recommendation.regime пустое). Требует restart #2.
  # 4 пост-restart SHORT прошли gate (+TP среднее +R≈4) — НО gate физически не работал из-за бага. Не достоверная выборка для пересмотра гипотезы.
  # После restart #2 gate начнёт работать корректно — собираем чистую выборку N≥30 → решение по shadow/откату.
  # Откат: dev186_wt_signal_regime_gate: false. Shadow: dev186_shadow: true.
  dev186_wt_signal_regime_gate: true
  dev186_shadow: false
  min_strength_register: 60  # P1.5 24.04: откат DEV-149 (50→60) — 50 пропускал слабые сигналы, 63 был слишком строг
  min_strength_atr_change: 15  # A1 14.05: снижен с 40 → 15 (backtest: 1h_LONG+0.12, 4h_LONG+0.275)
  min_strength_wl_breach: 45
  pivot_reversal_max_strength: 79
  ote_shadow_mode: false  # ARCH-87: активирован 18.04 — rejection 1W FVG [0.4235–0.4416]
  ote_zone_tfs:
  - 1h
  - 4h
  - 1d
  ote_scalp_zone_tfs:
  - 15m
  ote_scalp_trigger_tf: 3m
  # 04.05.2026: ОТКАТ — бэктест C4 (0.5, no-gates) дал WR=23.7%, −588R за 90 дней
  # Возврат к wide-only [0.705–0.786] + ATR-trend gate включён
  ote_zone_min_fib: 0.705
  ote_use_trend_gate: true
  min_strength_by_regime: {}       # 14.04: убраны — режим ненадёжен как фильтр
  min_strength_by_direction_regime: {}  # 14.04: убраны
  signal_regime_block:
    # 14.04.2026: ВСЕ режимные блоки убраны.
    # Причина: сделки без режима (NULL, до 04.03.2026) были прибыльны (+0.247R avg).
    # MarketRegimeClassifier добавляет шум, а не сигнал — блоки по нему режут прибыльные входы.
    # Активные фильтры: time_gate (DEV-170) + l3_checker (max 3 позиции).
    pivot_reversal:
      blocked_regimes: []
      blocked_combos: []
    confluence:
      blocked_regimes: []
      blocked_combos: []
    wt_signal:
      blocked_regimes: []
      blocked_combos: []
  weekly_bias_gate:
    enabled: true
    shadow_mode: false
  counter_trend_strength_threshold: 30
  btc_filter_enabled: false
  btc_filter_mode: shadow
  mtf_gate_enabled: true          # ARCH-84: блок SHORT при сильном LONG bias пары
  mtf_bias_threshold: 0.70        # bias_strength > 0.70 → ~85% ТФ пары в LONG
  mtf_gate_shadow: true           # true = только лог WOULD_BLOCK, false = реальный блок
  watch_list_ttl_hours: 4
  watch_list_breach_pct: 0.8
  wl_sl_buffer_pct: 0.5
detectors:
  anomaly:
    min_bars: 20
    volume_ma_period: 20
    volume_ratio_threshold: 3.0
    strength_trend_multiplier: 12
    strength_counter_multiplier: 8
performance:
  scan_semaphore_size: 10
  analyze_semaphore_size: 3
  prefetch_pivots_semaphore_size: 2
  background_check_semaphore_size: 5
  cascade_div_semaphore_size: 3
  api_rps: 15
  api_semaphore_size: 10
  ohlcv_scan_limit: 161
  ohlcv_slow_threshold_sec: 8.0
  divergence_slow_threshold_sec: 3.0
  pair_slow_threshold_sec: 10.0
  scan_cycle_warning_threshold_sec: 70.0
strategy:
  name: multi_signal
  multi_signal:
    min_signals: 2
    conflict_threshold: 0.3
    signal_weights:
      mtf_alert: 0.3
      mtf_bias: 0.3
      pivot_reversal: 0.2
      divergence: 0.15
      wt_signal: 0.1
      trend_signal: 0.1
      anomaly: 0.05
      pivot_alert: 0.15
      confluence: 0.35
  mtf_bias:
    min_strength: 60
    require_confluence: false
  conservative:
    min_signals: 3
    min_confidence: 0.65
    conflict_threshold: 0.2
ml:
  use_outcome_predictor: true  # ARCH-45: AUC=0.582 после фикса features (>= 2026-04-15, 483 сделки)
future_pivots:
  enabled: false
  broadcast_tg: false
  ttl_sec: 1800
  confluence_threshold_pct: 0.5
  pre_alert_pct: 1.0
  strength_bonus: 15
signals:
  mtf_alert_enabled: true   # 16.05: включён для полного наблюдения через router
  mtf_alert_register: true  # 16.05: регистрируем в БД
  cascade_div_enabled: true
  send_chart: true
  show_fvg_confluences: true
  chart_tf: 1h
  chart_bars: 300
risk_management:
  regime_strategy:
    enabled: true
    trend_sl_factor: 0.85
    trend_strategy_type: DUAL_TP   # DEV-184 (26.04.2026): DUAL_TSL → DUAL_TP. Причина: DUAL_TSL avgR=-0.61 vs SINGLE -0.19 vs DUAL_TP -0.23 за 10 дней (-290R). Откат: вернуть DUAL_TSL после RE-AUDIT slippage.
    trend_position_multiplier: 1.0
    range_sl_factor: 1.15
    range_strategy_type: SINGLE
    range_position_multiplier: 1.0
    high_vol_sl_factor: 1.0
    high_vol_strategy_type: DUAL_TP
    high_vol_position_multiplier: 0.5
    high_vol_tp1_r: 0.5
trade_analyzer:
  provider: groq
  api_key: ${GROQ_API_KEY}
  model: llama-3.3-70b-versatile  # 70B — намного меньше галлюцинаций, free tier на Groq

# ── TradeRouter (Сфера 9 Куба Метатрона — Phase 1, 15.05.2026) ────────────────
# Единый узел регистрации сделок. Soft scoring (без блоков): hard блоки только
# для technical safety (validate, dedup, sl_cooldown, min_sl_dist, rr_filter).
# Trading gates → soft penalty к strength.
signal_router:
  enabled: true                               # Этап 1.Б 15.05.2026: pilot atr_change через router
  shadow_compare:
    enabled: false                            # dual_run пока не нужен — atr_change полностью переключен
    log_path: logs/router_shadow.log
  default_policy:
    min_strength: 50
    exchange_enabled: true
    trade_mode: ""
    soft_gates_enabled:
      - strength_threshold
      - regime_safety
      - btc_market
      - time_gate
      - correlation_guard
      - market_stress
      - pair_cooldown_streak
  source_policies:
    # ── Уже подключённые источники (Этапы 1.Б, 1.В) ───────────────────
    atr_change:        {min_strength: 15, exchange_enabled: true,  trade_mode: "atr_change"}
    wt_sideways:       {min_strength: 60, exchange_enabled: true,  trade_mode: "sideways"}
    wl_breach:         {min_strength: 45, exchange_enabled: true,  trade_mode: "wl_breach"}
    # ── Per-signal_type sources через monitoring main path (Этап 1.Д) ─
    mtf_alert:         {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    mtf_bias:          {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    pivot_reversal:    {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    wt_signal:         {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    wt_b_signal:       {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    confluence:        {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    divergence:        {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    anomaly:           {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    trend_signal:      {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    composite:         {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    monitoring:        {min_strength: 50, exchange_enabled: true,  trade_mode: ""}  # fallback для неопознанных
    monitoring_escal:  {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    # ── Источники для Этапа 1.Г ───────────────────────────────────────
    trigger_loop:      {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    event_bus:         {min_strength: 50, exchange_enabled: true,  trade_mode: ""}
    intelligence_cmd:  {min_strength: 0,  exchange_enabled: false, trade_mode: ""}
    other_strategy:    {min_strength: 40, exchange_enabled: false, trade_mode: ""}
  penalties:
    regime_safety:
      wt_signal_short_trend_up: 15            # DEV-186 история avgR=-1.12
