# MARKET-WS (LOOP-разгрузка): kline-push 5m/15m → OhlcvCache, scan без REST-polling.
# Кастомный aiohttp WS в отдельном потоке (НЕ ccxt.pro). Доказан тестом 14.06.
# ЭТАПЫ: enabled=true + use_ws=false = SHADOW (теневой кэш, scan на REST, сравнение).
#        use_ws=true = ОСНОВНОЙ cache (scan читает WS) — ТОЛЬКО после shadow-валидации ≥99%.
dashboard:
  enabled: true         # false → не запускать aiohttp :8000 (диагностика нагрузки на loop). Замер 14.06: dashboard НЕ грузит цикл (OFF 282 ≈ ON 299, в шуме)
  host: 127.0.0.1       # SEC-01a: localhost по умолчанию
  threaded: true        # PERF-DASH-THREAD: dashboard в отдельном потоке+loop → не ждёт scan-очередь (лечит латентность 11с). false=в главном loop (старое поведение)

