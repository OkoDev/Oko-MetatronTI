telegram:
  token: ${TELEGRAM_TOKEN}
  admin_id: ${ADMIN_ID}
exchanges:
  default: bingx
  supported:
  - binance
  - bybit
  - bingx
  - okx
  api_keys:
    bingx:
      api_key: ${BINGX_API_KEY}
      secret: ${BINGX_SECRET_KEY}
analysis:
  volume_multiplier: 4.0
  price_threshold: 5.0
  history_size: 200
  check_interval: 60
  indicators:
    wavetrend:
      n1: 10
      n2: 21
      ob_threshold: 60.0
      os_threshold: -60.0
    trend:
      atr_period: 43
      factor: 1.1
  signals:
    min_signals: 2
    single_signal_min_strength: 54
    premium_pairs:
    - BTC
    - ETH
    - BNB
    - SOL
    - XRP
    - ADA
    - DOGE
    - DOT
    - MATIC
    - AVAX
  divergence:
    pivot_proximity_pct: 0.5
  confluence:
    enabled: true
    lookback_bars: 5
    cross_fresh_bars: 5
    min_strength: 60
    wt_os_threshold: -60.0
    wt_ob_threshold: 60.0
    pivot_proximity_pct: 0.5
    div_min_bars: 9
    max_per_cycle: 3
subscriptions:
  free:
    daily_limit: 5
    signals:
    - anomaly
    price: 0
  basic:
    daily_limit: 10
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    price: 9.99
  premium:
    daily_limit: 50
    signals:
    - anomaly
    - wt_signal
    - mtf_signal
    - mtf_alert
    - trend_signal
    - divergence
    price: 29.99
  pro:
    daily_limit: 999999
    signals:
    - all
    price: 99.99
logging:
  level: INFO
  file: crypto_bot.log
  max_size: 10MB
  backup_count: 5
database:
  path: subscriptions.db
  backup_interval: 24
monitoring:
  check_intervals:
    divergences_every_n_cycles: 5
    background_every_n_cycles: 3
    cascade_div_every_n_cycles: 60
trading:
  active_strategy: confluence_scanner  # главная: отправляет TG-сигналы
  active_strategies:                   # все симулируются в БД для сравнения WR
    - confluence_scanner
    - pivot_reversal
    - confluence
    - mtf_bias
  strategies:
    confluence_scanner:
      min_strength: 60
      tp_rr: 3.0
      sl_buffer_pct: 0.3
      tsl_max_dist: 3.0
      tsl_min_dist: 0.6
    confluence:
      min_signals: 2
      conflict_threshold: 0.3
    conservative:
      min_signals: 3
      min_confidence: 0.65
    pivot_reversal:
      min_strength: 60
      tp_rr: 2.5
      sl_buffer_pct: 0.1
  use_tsl: true
  tsl_activation_r: 1.0
  tsl_buffer_pct: 0.5
  use_breakeven: true           # Безубыток: SL → entry после достижения прибыли
  breakeven_activation_r: 0.8  # 0.5→0.8R: данные показали что 0.5R — зона волатильности,
                                # риск срезания хороших сделок. 0.8R = уверенное движение,
                                # буфер 0.2R до TSL-активации (1.0R) минимизирует преждевременные выходы
  sl_tp:
    atr_multiplier: 1.2
    sl_min_pct: 0.5        # DEV-05: зажим [0.5%, 3%] — S1/FVG/TSL приоритет
    sl_max_pct: 3.0
    tp_fallback_rr: 3.0
    tp_pivot_min_r: 3.0
    tp_partial_pct: 0.5
    atr_dynamic: true
    atr_expand_threshold: 1.3
    atr_contract_threshold: 0.8
    struct_sl_buffer_pct: 0.3
    struct_sl_max_dist: 3.0
    tsl_too_tight_pct: 1.0  # было 0.6 — если TSL-линия <1% от цены → использовать swing_low
signal_quality:
  sl_cooldown_hours: 1
  dedup_minutes: 30
  min_volume_usd: 1000000
  min_strength: 50
  min_strength_register: 40
  counter_trend_strength_threshold: 30
  btc_filter_enabled: false
detectors:
  anomaly:
    min_bars: 20
    volume_ma_period: 20
    volume_ratio_threshold: 3.0
    strength_trend_multiplier: 12
    strength_counter_multiplier: 8
performance:
  scan_semaphore_size: 20
  analyze_semaphore_size: 3
  prefetch_pivots_semaphore_size: 5
  background_check_semaphore_size: 10
  cascade_div_semaphore_size: 5
  ohlcv_scan_limit: 160
  ohlcv_slow_threshold_sec: 5.0
  divergence_slow_threshold_sec: 3.0
  pair_slow_threshold_sec: 10.0
  scan_cycle_warning_threshold_sec: 55.0
strategy:
  name: confluence
  confluence:
    min_signals: 2
    conflict_threshold: 0.3
    signal_weights:
      mtf_signal: 0.25
      mtf_alert: 0.3
      mtf_bias: 0.30
      pivot_reversal: 0.2
      divergence: 0.15
      wt_signal: 0.1
      trend_signal: 0.1
      anomaly: 0.05
      pivot_alert: 0.15
      confluence: 0.35
  mtf_bias:
    min_strength: 60
    require_confluence: false
  conservative:
    min_signals: 3
    min_confidence: 0.65
    conflict_threshold: 0.2

risk_management:
  regime_strategy:
    enabled: true
    # TREND_UP / TREND_DOWN: агрессивный трейлинг
    trend_sl_factor: 0.85
    trend_strategy_type: TRIPLE_TP_TSL
    trend_position_multiplier: 1.0
    # RANGE: консервативная фиксация прибыли
    range_sl_factor: 1.15
    range_strategy_type: DUAL_TP
    range_position_multiplier: 1.0
    # HIGH_VOL: уменьшаем риск, берём TP1 сразу
    high_vol_sl_factor: 1.0
    high_vol_strategy_type: DUAL_TP
    high_vol_position_multiplier: 0.5
    high_vol_tp1_r: 0.5
